<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VNPT-IT | Ban KDGP - Quản lý Hợp đồng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --vnpt-navy: #003B7A; --vnpt-blue: #0094D9; --vnpt-green: #00B050; --vnpt-yellow: #FFC000; --vnpt-red: #D83A3A; }
    body, button, input, select, textarea { font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #F4F7FB; color: #1E293B; }
    .kpi-card { transition: transform .15s ease, box-shadow .15s ease; }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(0, 59, 122, .12); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 999px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    Chart.defaults.font.family = "'Nunito', sans-serif";

    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby6E6r6KhZ54J6by2s1PF8MqtOSJu74GcyqO4GsFnSwWd-GmDScZFrS5Brq0IwXlO1N/exec";
    const STORAGE_KEY_USER = "vnpt_dhkd_user_v1";

    function VnptLogo({ size = "sm" }) {
      const boxCls = size === "lg" ? "w-10 h-10 p-1.5" : "w-8 h-8 p-1";
      return (
        <div className={`${boxCls} rounded-lg bg-white flex items-center justify-center shrink-0 shadow-xs overflow-hidden text-[#003B7A] font-extrabold text-xs`}>
          <img
            src="./logo-vnpt.png"
            alt="VNPT"
            className="w-full h-full object-contain"
            onError={(e) => { e.target.style.display = 'none'; e.target.parentNode.innerText = 'VN'; }}
          />
        </div>
      );
    }

    const fmt = (n, dec = 0) => Number(n || 0).toLocaleString('vi-VN', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    const getVnptVal = (h) => Math.max(0, Number(h.giatri_hd || 0) - Number(h.giatri_liendanh || 0));

    function daysUntilExpire(h) {
      if (!h.ngay_hethan) return null;
      const dt = new Date(h.ngay_hethan);
      if (isNaN(dt.getTime())) return null;
      return Math.ceil((dt - new Date()) / 86400000);
    }

    function isOverBudget(h) {
      const dt = Number(h.dutoan_CPSX || 0);
      const tc = Number(h.thucchi_tong || 0);
      return (dt > 0 && tc > dt) || String(h.nhom_vuong_mac || '').toUpperCase().includes('VƯỢT');
    }

    function isDelayed(h) {
      return Number(h.songay_chamtiendo || 0) > 0 || String(h.nhom_vuong_mac || '').toUpperCase().includes('TRỄ');
    }

    function getAlertLevel(h) {
      if (h.mucdo_canhbao) return h.mucdo_canhbao;
      if (isOverBudget(h) || isDelayed(h) || (h.dexuat_chidao && !h.chidao_lanhdao)) return "Đỏ";
      const dExp = daysUntilExpire(h);
      if (dExp !== null && dExp >= 0 && dExp <= 60) return "Vàng";
      return "Xanh";
    }

    function ChartBox({ id, title, subtitle, type, data, options }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);
      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) chartRef.current.destroy();
        chartRef.current = new Chart(canvasRef.current, { type, data, options });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [type, data, options]);
      return (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 flex flex-col">
          <div className="mb-3">
            <h3 className="text-sm font-bold text-[#003B7A] uppercase tracking-wide">{title}</h3>
            {subtitle && <p className="text-xs text-slate-500 mt-0.5">{subtitle}</p>}
          </div>
          <div className="relative h-64 w-full"><canvas ref={canvasRef} id={id}></canvas></div>
        </div>
      );
    }

    function LoginModal({ onLogin, loading, errorMsg }) {
      const [email, setEmail] = useState("");
      const handleSubmit = (e) => { e.preventDefault(); if (email.trim()) onLogin(email.trim().toLowerCase()); };
      return (
        <div className="fixed inset-0 bg-[#003B7A]/90 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
            <div className="bg-gradient-to-r from-[#003B7A] to-[#0094D9] p-6 text-white">
              <div className="flex items-center gap-3">
                <VnptLogo size="lg" />
                <div>
                  <div className="text-xs uppercase tracking-widest opacity-80">VNPT-IT • Ban KDGP</div>
                  <h1 className="text-lg font-bold">War-Room Điều hành SXKD</h1>
                </div>
              </div>
            </div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-600 uppercase mb-1.5">Email xác thực (DMPHANQUYEN)</label>
                <input type="email" required placeholder="ten.ban@vnpt.vn" value={email} onChange={(e) => setEmail(e.target.value)}
                  className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#0094D9]" />
              </div>
              {errorMsg && <div className="text-xs text-[#D83A3A] bg-red-50 border border-red-200 rounded-lg p-2.5">{errorMsg}</div>}
              <button type="submit" disabled={loading}
                className="w-full py-2.5 bg-[#0094D9] hover:bg-[#007bb5] text-white font-semibold rounded-lg text-sm transition flex items-center justify-center gap-2">
                {loading ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-right-to-bracket"></i>}
                Đăng nhập hệ thống
              </button>
            </form>
          </div>
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(() => {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY_USER) || "null"); } catch { return null; }
      });
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [hopDong, setHopDong] = useState([]);
      const [poList, setPoList] = useState([]);
      const [updatedAt, setUpdatedAt] = useState("");
      const [loading, setLoading] = useState(false);
      const [authError, setAuthError] = useState("");

      const [fTinh, setFTinh] = useState("ALL");
      const [fLoai, setFLoai] = useState("ALL");
      const [fNhom, setFNhom] = useState("ALL");
      const [fNamKy, setFNamKy] = useState("ALL");
      const [quickTab, setQuickTab] = useState("ALL");
      const [search, setSearch] = useState("");

      const [selectedHD, setSelectedHD] = useState(null);
      const [chiDaoInput, setChiDaoInput] = useState("");
      const [savingChiDao, setSavingChiDao] = useState(false);

      const fetchData = async (email) => {
        setLoading(true);
        setAuthError("");
        try {
          const res = await fetch(`${GAS_API_URL}?action=getHopDongData&email=${encodeURIComponent(email)}`);
          const json = await res.json();
          if (json.status !== 'success') {
            setAuthError(json.message || 'Không có quyền truy cập');
            setUser(null);
            localStorage.removeItem(STORAGE_KEY_USER);
          } else {
            localStorage.setItem(STORAGE_KEY_USER, JSON.stringify(json.user));
            setUser(json.user);
            setHopDong(json.hopDong || []);
            setPoList(json.poList || []);
            setUpdatedAt(json.updatedAt || '');
          }
        } catch (err) {
          setAuthError("Lỗi kết nối GAS API: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { if (user && user.email) fetchData(user.email); }, []);

      const handleLogout = () => { localStorage.removeItem(STORAGE_KEY_USER); setUser(null); setHopDong([]); setPoList([]); };

      const handleSaveChiDao = async () => {
        if (!selectedHD) return;
        setSavingChiDao(true);
        try {
          const res = await fetch(GAS_API_URL, {
            method: 'POST',
            body: JSON.stringify({ email: user.email, target: 'hopdong', record_id: selectedHD.ma_hopdong, chidao_lanhdao: chiDaoInput })
          });
          const json = await res.json();
          if (json.status !== 'success') throw new Error(json.message || 'GAS từ chối ghi dữ liệu');
          setHopDong(prev => prev.map(h => h.ma_hopdong === selectedHD.ma_hopdong ? { ...h, chidao_lanhdao: chiDaoInput } : h));
          setSelectedHD(null);
        } catch (e) {
          alert("Lưu chỉ đạo thất bại: " + e.message);
        } finally {
          setSavingChiDao(false);
        }
      };

      const filterOpts = useMemo(() => ({
        tinh: [...new Set(hopDong.map(h => h.ma_tinh).filter(Boolean))].sort(),
        loai: [...new Set(hopDong.map(h => h.loai_hd).filter(Boolean))].sort(),
        nhom: [...new Set(hopDong.map(h => h.nhomspdv_code).filter(Boolean))].sort(),
        namKy: [...new Set(hopDong.map(h => String(h.ngay_kyhopdong || '').slice(0, 4)).filter(y => y.length === 4))].sort().reverse()
      }), [hopDong]);

      const filteredHD = useMemo(() => {
        return hopDong.filter(h => {
          if (fTinh !== "ALL" && h.ma_tinh !== fTinh) return false;
          if (fLoai !== "ALL" && h.loai_hd !== fLoai) return false;
          if (fNhom !== "ALL" && h.nhomspdv_code !== fNhom) return false;
          if (fNamKy !== "ALL" && String(h.ngay_kyhopdong || '').slice(0, 4) !== fNamKy) return false;

          const dExp = daysUntilExpire(h);
          if (quickTab === "DELAYED" && !isDelayed(h)) return false;
          if (quickTab === "OVERCOST" && !isOverBudget(h)) return false;
          if (quickTab === "RENTAL" && !String(h.loai_hd || '').toLowerCase().includes('thuê')) return false;
          if (quickTab === "EXPIRING" && !(dExp !== null && dExp >= 0 && dExp <= 60)) return false;
          if (quickTab === "ALERT" && !(getAlertLevel(h) === "Đỏ" || (h.dexuat_chidao && !h.chidao_lanhdao))) return false;

          if (search.trim()) {
            const q = search.toLowerCase();
            const hay = `${h.ma_tinh} ${h.ma_hopdong} ${h.so_hopdong} ${h.ten_hopdong} ${h.ten_khachhang} ${h.ten_spdv} ${h.nhom_vuong_mac}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }, [hopDong, fTinh, fLoai, fNhom, fNamKy, quickTab, search]);

      // Map tổng đối soát từ 08_PO_NOIBO theo ma_hd
      const poByHdMap = useMemo(() => {
        const m = {};
        poList.forEach(p => {
          if (!m[p.ma_hd]) m[p.ma_hd] = { count: 0, ds: 0, items: [] };
          m[p.ma_hd].count += 1;
          m[p.ma_hd].ds += Number(p.dt_doi_soat_ky || 0);
          m[p.ma_hd].items.push(p);
        });
        return m;
      }, [poList]);

      const kpis = useMemo(() => {
        const totalHD = filteredHD.length;
        const totalVnpt = filteredHD.reduce((s, h) => s + getVnptVal(h), 0);
        const totalKH26 = filteredHD.reduce((s, h) => s + Number(h.dt_ke_hoach_2026 || 0), 0);
        const totalNT = filteredHD.reduce((s, h) => s + Number(h.dt_da_nghiem_thu || 0), 0);
        const totalDS = filteredHD.reduce((s, h) => s + Number(h.dt_doi_soat || (poByHdMap[h.ma_hopdong] ? poByHdMap[h.ma_hopdong].ds : 0)), 0);
        const totalCost = filteredHD.reduce((s, h) => s + Number(h.thucchi_tong || 0), 0);
        const delayedCnt = filteredHD.filter(isDelayed).length;
        const overCostCnt = filteredHD.filter(isOverBudget).length;
        const expiringCnt = filteredHD.filter(h => { const d = daysUntilExpire(h); return d !== null && d >= 0 && d <= 60; }).length;
        const dsPct = totalVnpt > 0 ? Math.round((totalDS / totalVnpt) * 100) : 0;
        return { totalHD, totalVnpt, totalKH26, totalNT, totalDS, dsPct, totalCost, delayedCnt, overCostCnt, expiringCnt };
      }, [filteredHD, poByHdMap]);

      const chartFlowData = useMemo(() => ({
        labels: ['GT Hợp đồng (VNPT)', 'KH Doanh thu 2026', 'Đã Nghiệm thu', 'Đã Đối soát TTP', 'Tổng Thực chi CPSX'],
        datasets: [{
          label: 'Triệu VNĐ',
          data: [kpis.totalVnpt, kpis.totalKH26, kpis.totalNT, kpis.totalDS, kpis.totalCost],
          backgroundColor: ['#003B7A', '#0094D9', '#0EA5E9', '#00B050', '#D83A3A'],
          borderRadius: 6
        }]
      }), [kpis]);

      const chartTinhData = useMemo(() => {
        const map = {};
        filteredHD.forEach(h => {
          const t = h.ma_tinh || 'Trống';
          if (!map[t]) map[t] = { vnpt: 0, cost: 0 };
          map[t].vnpt += getVnptVal(h);
          map[t].cost += Number(h.thucchi_tong || 0);
        });
        const top = Object.entries(map).sort((a, b) => b[1].vnpt - a[1].vnpt).slice(0, 8);
        return {
          labels: top.map(x => x[0]),
          datasets: [
            { label: 'GT Hợp đồng VNPT (tr)', data: top.map(x => x[1].vnpt), backgroundColor: '#003B7A', borderRadius: 4 },
            { label: 'Tổng Thực chi CPSX (tr)', data: top.map(x => x[1].cost), backgroundColor: '#FFC000', borderRadius: 4 }
          ]
        };
      }, [filteredHD]);

      const navItems = [
        { id: 'p1', label: 'Tổng quan SXKD', icon: 'fa-chart-line', href: 'index.html' },
        { id: 'p2', label: 'Khung pháp lý CĐS', icon: 'fa-landmark', href: 'phaply.html' },
        { id: 'p3', label: 'Cơ hội kinh doanh', icon: 'fa-funnel-dollar', href: 'chkd.html' },
        { id: 'p4', label: 'Quản lý POC', icon: 'fa-flask', href: 'poc.html' },
        { id: 'p5', label: 'Đấu thầu', icon: 'fa-gavel', href: 'dauthau.html' },
        { id: 'p6', label: 'Hợp đồng', icon: 'fa-file-contract', href: 'hopdong.html', active: true },
        { id: 'p7', label: 'Triển khai', icon: 'fa-gears', href: 'po.html' },
        { id: 'p8', label: 'Danh mục', icon: 'fa-database', href: 'danhmuc.html' }
      ];

      if (!user) return <LoginModal onLogin={fetchData} loading={loading} errorMsg={authError} />;

      return (
        <div className="min-h-screen flex bg-[#F4F7FB]">
          {/* =============== SIDEBAR CHUẨN DÙNG CHUNG =============== */}
          <aside className={`${sidebarOpen ? 'w-52' : 'w-14'} bg-[#003B7A] text-white flex flex-col transition-all duration-200 shrink-0 shadow-xl z-20`}>
            <div className="h-16 px-3 flex items-center justify-between border-b border-white/10">
              {sidebarOpen && (
                <div className="flex items-center gap-2 overflow-hidden">
                  <VnptLogo size="sm" />
                  <div className="leading-tight truncate">
                    <div className="text-xs font-extrabold tracking-wide">VNPT-IT • KDGP</div>
                    <div className="text-[10px] text-sky-200">Executive War-Room</div>
                  </div>
                </div>
              )}
              <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-1.5 rounded-lg hover:bg-white/10 text-sky-200">
                <i className={`fa-solid ${sidebarOpen ? 'fa-bars-staggered' : 'fa-bars'}`}></i>
              </button>
            </div>

            <div className="p-2.5 border-b border-white/10 bg-[#002D5E]">
              {sidebarOpen ? (
                <div className="flex items-center justify-between gap-2">
                  <div className="min-w-0">
                    <div className="text-xs font-bold truncate">{user.name}</div>
                    <div className="text-[10px] text-sky-300 truncate">{user.role} • {user.scope}</div>
                  </div>
                  <button onClick={handleLogout} title="Đăng xuất" className="p-1.5 rounded-lg hover:bg-red-500/20 text-red-300 shrink-0">
                    <i className="fa-solid fa-right-from-bracket"></i>
                  </button>
                </div>
              ) : (
                <button onClick={handleLogout} title={`Đăng xuất (${user.name})`} className="w-full p-1.5 rounded-lg hover:bg-red-500/20 text-red-300">
                  <i className="fa-solid fa-right-from-bracket"></i>
                </button>
              )}
            </div>

            <nav className="flex-1 py-3 px-2 space-y-1">
              {navItems.map(item => (
                <a key={item.id} href={item.href}
                  className={`flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-semibold transition ${
                    item.active ? 'bg-[#0094D9] text-white shadow-md' : 'text-sky-100/80 hover:bg-white/10 hover:text-white'
                  }`}>
                  <i className={`fa-solid ${item.icon} w-4 text-center`}></i>
                  {sidebarOpen && <span className="truncate">{item.label}</span>}
                </a>
              ))}
            </nav>
          </aside>

          {/* =============== NỘI DUNG CHÍNH =============== */}
          <div className="flex-1 flex flex-col min-w-0">
            <header className="bg-white border-b border-slate-200 px-6 py-3.5 sticky top-0 z-10 shadow-sm">
              <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
                <div>
                  <div className="text-[11px] font-bold uppercase tracking-wider text-[#0094D9]">Phần 6 • 07_QUANLY_HOPDONG</div>
                  <h1 className="text-lg font-extrabold text-[#003B7A]">Quản trị Hợp đồng</h1>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <select value={fNamKy} onChange={e => setFNamKy(e.target.value)} className="text-xs border border-[#0094D9] rounded-lg px-2.5 py-1.5 bg-sky-50 font-bold text-[#003B7A]">
                    <option value="ALL">Năm ký: Tất cả</option>
                    {filterOpts.namKy.map(v => <option key={v} value={v}>Năm {v}</option>)}
                  </select>
                  <select value={fTinh} onChange={e => setFTinh(e.target.value)} className="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-slate-50 font-semibold">
                    <option value="ALL">Địa bàn: Tất cả</option>
                    {filterOpts.tinh.map(v => <option key={v} value={v}>{v}</option>)}
                  </select>
                  <select value={fLoai} onChange={e => setFLoai(e.target.value)} className="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-slate-50 font-semibold">
                    <option value="ALL">Loại HĐ: Tất cả</option>
                    {filterOpts.loai.map(v => <option key={v} value={v}>{v}</option>)}
                  </select>
                  <select value={fNhom} onChange={e => setFNhom(e.target.value)} className="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-slate-50 font-semibold">
                    <option value="ALL">Nhóm SPDV: Tất cả</option>
                    {filterOpts.nhom.map(v => <option key={v} value={v}>{v}</option>)}
                  </select>
                  <button onClick={() => fetchData(user.email)}
                    className="px-3 py-1.5 bg-[#0094D9] hover:bg-[#007bb5] text-white rounded-lg text-xs font-bold flex items-center gap-1.5">
                    <i className={`fa-solid fa-rotate ${loading ? 'fa-spin' : ''}`}></i> Đồng bộ
                  </button>
                </div>
              </div>
            </header>

            <main className="flex-1 p-6 space-y-5 max-w-[1600px] w-full mx-auto">
              {/* TẦNG 1: 5 THẺ KPI TRỌNG TÂM */}
              <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4">
                <div className="kpi-card bg-white rounded-xl border border-slate-200 p-4 border-l-4 border-l-[#003B7A]">
                  <div className="text-xs font-bold text-slate-500 uppercase">Tổng GT Hợp đồng (VNPT)</div>
                  <div className="mt-2 flex items-baseline gap-1.5">
                    <span className="text-2xl font-extrabold text-[#003B7A]">{fmt(kpis.totalVnpt)}</span>
                    <span className="text-xs text-slate-500">tr ({kpis.totalHD} HĐ)</span>
                  </div>
                  <div className="mt-1 text-[11px] text-[#0094D9] font-semibold">Đã trừ phần liên danh</div>
                </div>

                <div className="kpi-card bg-white rounded-xl border border-slate-200 p-4 border-l-4 border-l-[#00B050]">
                  <div className="text-xs font-bold text-slate-500 uppercase">Đã Đối soát TTP</div>
                  <div className="mt-2 flex items-baseline gap-1.5">
                    <span className="text-2xl font-extrabold text-[#00B050]">{fmt(kpis.totalDS)}</span>
                    <span className="text-xs text-slate-500">tr ({kpis.dsPct}%)</span>
                  </div>
                  <div className="mt-1 text-[11px] text-slate-500">Đã nghiệm thu: {fmt(kpis.totalNT)} tr</div>
                </div>

                <div className="kpi-card bg-white rounded-xl border border-slate-200 p-4 border-l-4 border-l-[#D83A3A]">
                  <div className="text-xs font-bold text-slate-500 uppercase">Trễ tiến độ / Vượt CPSX</div>
                  <div className="mt-2 flex items-baseline gap-2">
                    <span className="text-2xl font-extrabold text-[#D83A3A]">{kpis.delayedCnt}</span>
                    <span className="text-xs text-slate-500">trễ • <b className="text-[#D83A3A]">{kpis.overCostCnt}</b> vượt CP</span>
                  </div>
                  <div className="mt-1 text-[11px] text-[#D83A3A] font-semibold">Cần PLO & PM báo cáo gỡ vướng</div>
                </div>

                <div className="kpi-card bg-white rounded-xl border border-slate-200 p-4 border-l-4 border-l-[#0094D9]">
                  <div className="text-xs font-bold text-slate-500 uppercase">Tổng Thực chi CPSX</div>
                  <div className="mt-2 flex items-baseline gap-1.5">
                    <span className="text-2xl font-extrabold text-[#003B7A]">{fmt(kpis.totalCost)}</span>
                    <span className="text-xs text-slate-500">trVND</span>
                  </div>
                  <div className="mt-1 text-[11px] text-slate-500">Nội bộ + Thầu phụ + Thuê ngoài</div>
                </div>

                <div className="kpi-card bg-white rounded-xl border border-slate-200 p-4 border-l-4 border-l-[#FFC000]">
                  <div className="text-xs font-bold text-slate-500 uppercase">Sắp hết hạn (≤60 ngày)</div>
                  <div className="mt-2 flex items-baseline gap-2">
                    <span className="text-2xl font-extrabold text-amber-600">{kpis.expiringCnt}</span>
                    <span className="text-xs text-slate-500">HĐ cần gia hạn</span>
                  </div>
                  <div className="mt-1 text-[11px] text-amber-700 font-semibold">Giữ chân doanh thu thuê DV</div>
                </div>
              </div>

              {/* TẦNG 2: 2 BIỂU ĐỒ */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <ChartBox
                  id="chartFlow"
                  title="Dòng chảy Giá trị Hợp đồng → Đối soát → Thực chi (trVND)"
                  subtitle="So sánh quy mô đã ký, kế hoạch năm, đã nghiệm thu, đối soát và tổng CPSX"
                  type="bar"
                  data={chartFlowData}
                  options={{ responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }}
                />
                <ChartBox
                  id="chartTinhHD"
                  title="Top 8 Địa bàn: Giá trị HĐ VNPT vs Tổng Thực chi CPSX (trVND)"
                  subtitle="Theo dõi biên độ chi phí sản xuất tại từng địa bàn"
                  type="bar"
                  data={chartTinhData}
                  options={{ responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }}
                />
              </div>

              {/* TẦNG 3: BẢNG ĐIỀU HÀNH HỢP ĐỒNG */}
              <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div className="p-4 border-b border-slate-200 flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                  <div className="flex flex-wrap gap-1.5">
                    {[
                      { id: 'ALL', label: `Tất cả (${hopDong.length})` },
                      { id: 'DELAYED', label: '🔴 Trễ tiến độ' },
                      { id: 'OVERCOST', label: '💸 Vượt CPSX' },
                      { id: 'RENTAL', label: '🔵 Thuê dịch vụ' },
                      { id: 'EXPIRING', label: '🔄 Sắp hết hạn (≤60d)' },
                      { id: 'ALERT', label: '⚠️ Cảnh báo / Chờ LĐ' }
                    ].map(t => (
                      <button key={t.id} onClick={() => setQuickTab(t.id)}
                        className={`px-2.5 py-1.5 rounded-lg text-[11px] font-bold transition ${
                          quickTab === t.id ? 'bg-[#003B7A] text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}>{t.label}</button>
                    ))}
                  </div>
                  <div className="relative w-full lg:w-72">
                    <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    <input type="text" value={search} onChange={e => setSearch(e.target.value)}
                      placeholder="Tìm mã HĐ, số HĐ, tên dự án, SPDV..."
                      className="w-full pl-8 pr-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-[#0094D9]" />
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr className="bg-slate-50 text-[#003B7A] uppercase text-[11px] border-b border-slate-200">
                        <th className="py-3 px-3 font-bold">Địa bàn / Mã HĐ</th>
                        <th className="py-3 px-3 font-bold">Tên Hợp đồng / SPDV / Loại</th>
                        <th className="py-3 px-3 font-bold">Thời hạn & Bàn giao</th>
                        <th className="py-3 px-3 font-bold text-right">GT VNPT / Đối soát</th>
                        <th className="py-3 px-3 font-bold text-right">Thực chi CPSX</th>
                        <th className="py-3 px-3 font-bold">Cảnh báo & Chỉ đạo LĐ</th>
                        <th className="py-3 px-3 font-bold text-center">Thao tác</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredHD.length === 0 ? (
                        <tr><td colSpan="7" className="py-8 text-center text-slate-400">Không có hợp đồng phù hợp bộ lọc.</td></tr>
                      ) : filteredHD.slice(0, 100).map((h, idx) => {
                        const vnptVal = getVnptVal(h);
                        const poInfo = poByHdMap[h.ma_hopdong];
                        const dsVal = Number(h.dt_doi_soat || (poInfo ? poInfo.ds : 0));
                        const lvl = getAlertLevel(h);
                        return (
                          <tr key={h.ma_hopdong || idx} className="hover:bg-sky-50/40 transition">
                            <td className="py-3 px-3 align-top whitespace-nowrap">
                              <span className="inline-block px-2 py-0.5 rounded bg-[#003B7A] text-white font-bold text-[10px] mb-1">{h.ma_tinh}</span>
                              <div className="font-bold text-slate-800">{h.ma_hopdong}</div>
                              <div className="text-[10px] text-slate-500">{h.so_hopdong || '—'}</div>
                            </td>
                            <td className="py-3 px-3 align-top max-w-xs">
                              <div className="font-bold text-slate-800 line-clamp-2">{h.ten_hopdong}</div>
                              <div className="mt-1 flex flex-wrap gap-1">
                                {h.ten_spdv && <span className="px-1.5 py-0.5 bg-sky-50 text-[#0094D9] rounded text-[10px] font-bold">{h.ten_spdv}</span>}
                                {h.loai_hd && <span className="px-1.5 py-0.5 bg-slate-100 text-slate-600 rounded text-[10px] font-semibold">{h.loai_hd}</span>}
                                {Number(h.thoi_gian_cc) > 0 && <span className="px-1.5 py-0.5 bg-indigo-50 text-indigo-700 rounded text-[10px] font-bold">{h.thoi_gian_cc} tháng</span>}
                              </div>
                            </td>
                            <td className="py-3 px-3 align-top whitespace-nowrap">
                              <div>Ký: <b>{h.ngay_kyhopdong || '—'}</b></div>
                              <div>Hết hạn: <b>{h.ngay_hethan || '—'}</b></div>
                              {Number(h.songay_chamtiendo) > 0 && (
                                <span className="inline-block mt-1 px-1.5 py-0.5 bg-red-100 text-[#D83A3A] rounded text-[10px] font-bold">
                                  Trễ {h.songay_chamtiendo} ngày
                                </span>
                              )}
                            </td>
                            <td className="py-3 px-3 align-top text-right whitespace-nowrap">
                              <div className="font-bold text-[#003B7A]">{fmt(vnptVal, 1)} tr</div>
                              <div className="text-[11px] font-bold text-[#00B050]">ĐS: {fmt(dsVal, 1)} tr</div>
                              {poInfo && <div className="text-[10px] text-slate-500">{poInfo.count} kỳ PO</div>}
                            </td>
                            <td className="py-3 px-3 align-top text-right whitespace-nowrap">
                              <div className={`font-bold ${isOverBudget(h) ? 'text-[#D83A3A]' : 'text-slate-700'}`}>{fmt(h.thucchi_tong)} tr</div>
                              <div className="text-[10px] text-slate-500">Dự toán: {fmt(h.dutoan_CPSX)} tr</div>
                            </td>
                            <td className="py-3 px-3 align-top max-w-xs">
                              <div className="flex items-center gap-1.5 mb-1">
                                <span className={`w-2.5 h-2.5 rounded-full ${lvl === 'Đỏ' ? 'bg-[#D83A3A]' : lvl === 'Vàng' ? 'bg-[#FFC000]' : 'bg-[#00B050]'}`}></span>
                                <span className="font-bold text-[11px]">{lvl}</span>
                              </div>
                              {h.nhom_vuong_mac && <div className="text-[11px] text-[#D83A3A] font-semibold line-clamp-2">{h.nhom_vuong_mac}</div>}
                              {h.chidao_lanhdao && <div className="text-[11px] text-[#003B7A] mt-0.5 line-clamp-2"><b>Chỉ đạo:</b> {h.chidao_lanhdao}</div>}
                            </td>
                            <td className="py-3 px-3 align-top text-center">
                              <button onClick={() => { setSelectedHD(h); setChiDaoInput(h.chidao_lanhdao || ''); }}
                                className="px-2.5 py-1.5 bg-[#0094D9]/10 hover:bg-[#0094D9] text-[#0094D9] hover:text-white rounded-lg font-bold transition">
                                Chi tiết
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>

            <footer className="bg-white border-t border-slate-200 px-6 py-3 text-[11px] text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-2">
              <div>© 2026 <b>VNPT-IT | Ban KDGP - TTĐHKD</b> • Hệ thống Điều hành SXKD & Quản trị Dữ liệu (Fullstack Sheets → GitHub)</div>
              <div>Đồng bộ dữ liệu: <b className="text-[#003B7A]">{updatedAt}</b></div>
            </footer>
          </div>

          {/* =============== MODAL CHI TIẾT HĐ + CÁC KỲ PO ĐỐI SOÁT + CHỈ ĐẠO =============== */}
          {selectedHD && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-3xl w-full overflow-hidden">
                <div className="bg-[#003B7A] text-white px-5 py-3.5 flex justify-between items-center">
                  <div>
                    <div className="text-[10px] uppercase text-sky-300">{selectedHD.ma_tinh} • {selectedHD.ma_hopdong} • {selectedHD.so_hopdong}</div>
                    <h2 className="text-sm font-bold">{selectedHD.ten_hopdong}</h2>
                  </div>
                  <button onClick={() => setSelectedHD(null)} className="text-white/70 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
                </div>

                <div className="p-5 space-y-4 max-h-[75vh] overflow-y-auto text-xs">
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div><span className="text-slate-400">GT Tổng / Liên danh / VNPT:</span><b className="block text-[#003B7A]">{fmt(selectedHD.giatri_hd, 1)} / {fmt(selectedHD.giatri_liendanh, 1)} / {fmt(getVnptVal(selectedHD), 1)} tr</b></div>
                    <div><span className="text-slate-400">Loại HĐ / Thời gian CC:</span><b className="block">{selectedHD.loai_hd || '—'} ({selectedHD.thoi_gian_cc || 0} tháng)</b></div>
                    <div><span className="text-slate-400">Bàn giao DK / TT:</span><b className="block">{selectedHD.ngaydukien_bangiao || '—'} / {selectedHD.ngaythucte_bangiao || '—'}</b></div>
                    <div><span className="text-slate-400">Thực chi NB / TP / TN:</span><b className="block">{fmt(selectedHD.thucchi_noibo)} / {fmt(selectedHD.thucchi_thauphu)} / {fmt(selectedHD.thucchi_thuengoai)} tr</b></div>
                    <div><span className="text-slate-400">Tổng thực chi / Dự toán:</span><b className="block text-[#D83A3A]">{fmt(selectedHD.thucchi_tong)} / {fmt(selectedHD.dutoan_CPSX)} tr</b></div>
                    <div><span className="text-slate-400">PM / CLO PIC:</span><b className="block">{selectedHD.pm_du_an || 'Chưa giao PM'} • {selectedHD.clo_pic || '—'}</b></div>
                  </div>

                  {/* Danh sách PO nội bộ phân kỳ đối soát của HĐ này */}
                  <div>
                    <div className="font-bold text-[#003B7A] mb-1.5 uppercase text-[11px]">Phân kỳ Đối soát & PO Nội bộ (08_PO_NOIBO)</div>
                    {!(poByHdMap[selectedHD.ma_hopdong] && poByHdMap[selectedHD.ma_hopdong].items.length) ? (
                      <div className="p-3 bg-slate-50 rounded-lg text-slate-400">Chưa có kỳ đối soát PO cho hợp đồng {selectedHD.ma_hopdong}.</div>
                    ) : (
                      <div className="space-y-1.5">
                        {poByHdMap[selectedHD.ma_hopdong].items.map((p, i) => (
                          <div key={i} className="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-lg px-3 py-2">
                            <div>
                              <div className="font-bold text-slate-800">{p.ma_po_noibo} {p.ky_doi_soat ? `• Kỳ ${p.ky_doi_soat}` : ''}</div>
                              <div className="text-[10px] text-slate-500">Trạng thái: {p.trang_thai_po || '—'} • Chốt ĐS: {p.ngay_chot_ds || 'Chưa chốt'}</div>
                            </div>
                            <div className="text-right">
                              <div className="font-bold text-[#00B050]">ĐS: {fmt(p.dt_doi_soat_ky)} tr</div>
                              <div className="text-[10px] text-slate-500">CLO: {fmt(p.dt_clo_huong)} • NM: {fmt(p.dt_nhamay_huong)}</div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {selectedHD.nhom_vuong_mac && (
                    <div className="bg-red-50 border border-red-200 rounded-xl p-3 text-red-900">
                      <div className="font-bold mb-0.5">Cảnh báo / Vướng mắc:</div>
                      <div>{selectedHD.nhom_vuong_mac}</div>
                    </div>
                  )}

                  <div>
                    <label className="block font-bold text-[#003B7A] mb-1.5">Ý kiến Chỉ đạo của Lãnh đạo (ghi về cột <code>chidao_lanhdao</code>):</label>
                    <textarea rows="3" value={chiDaoInput} onChange={e => setChiDaoInput(e.target.value)}
                      placeholder="Nhập chỉ đạo xử lý trễ tiến độ, cắt giảm chi phí thầu phụ hoặc chốt đối soát TTP..."
                      className="w-full border border-slate-300 rounded-lg p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#0094D9]"></textarea>
                  </div>
                </div>

                <div className="px-5 py-3 bg-slate-50 border-t border-slate-200 flex justify-end gap-2">
                  <button onClick={() => setSelectedHD(null)} className="px-4 py-2 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-200">Đóng</button>
                  <button onClick={handleSaveChiDao} disabled={savingChiDao}
                    className="px-4 py-2 rounded-lg text-xs font-bold bg-[#003B7A] hover:bg-[#002855] text-white flex items-center gap-1.5">
                    {savingChiDao && <i className="fa-solid fa-spinner fa-spin"></i>} Lưu chỉ đạo
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
