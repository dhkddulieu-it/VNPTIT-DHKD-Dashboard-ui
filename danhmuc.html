<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản trị Danh mục - VNPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Nunito', 'sans-serif'] },
          colors: { vnpt: '#0094D9', navy: '#003B7A', good: '#22c55e', risk: '#ef4444', hoverbg: '#004c9e' }
        }
      }
    }
  </script>
</head>

<body class="bg-gray-100 text-gray-800 min-h-screen flex font-sans overflow-hidden">
  <div id="root" class="w-full h-screen flex">
    <div class="m-auto text-center text-vnpt font-bold text-xl">Đang khởi tạo Danh mục...</div>
  </div>

  <script>
    window.onerror = function(message) {
      if (message.includes('ResizeObserver loop') || message.includes('Script error.')) return true;
      document.getElementById('root').innerHTML = '<div style="padding:40px;text-align:center;"><h2 style="color:#ef4444;font-size:24px;font-weight:bold;">HỆ THỐNG GẶP SỰ CỐ</h2><p style="color:#333;margin-top:10px;">Chi tiết lỗi: ' + message + '</p></div>';
      return false;
    };
  </script>

  <script type="text/babel">
    try {
      const API_URL = 'https://script.google.com/macros/s/AKfycby6E6r6KhZ54J6by2s1PF8MqtOSJu74GcyqO4GsFnSwWd-GmDScZFrS5Brq0IwXlO1N/exec';

      // Menu đồng bộ 100% với index.html: bấm phân hệ nào nhảy thẳng về index.html?tab=...
      const MENU_ITEMS = [
        { id: 'dashboard', label: 'DASHBOARD', href: 'index.html?tab=dashboard' },
        { id: 'dean', label: 'CÁC KHUNG PHÁP LÝ', href: 'index.html?tab=dean' },
        { id: 'cohoi', label: 'CƠ HỘI KINH DOANH', href: 'index.html?tab=cohoi' },
        { id: 'poc', label: 'DỰ ÁN POC', href: 'index.html?tab=poc' },
        { id: 'dauthau', label: 'ĐẤU THẦU', href: 'index.html?tab=dauthau' },
        { id: 'hopdong', label: 'HỢP ĐỒNG', href: 'index.html?tab=hopdong' },
        { id: 'khachhang', label: 'KHÁCH HÀNG', href: 'index.html?tab=khachhang' },
        {
          id: 'danhmuc', label: 'DANH MỤC',
          subItems: [
            { id: 'spdv', label: 'Danh mục SPDV', href: 'danhmuc.html?tab=spdv' },
            { id: 'plo', label: 'Danh mục PLO', href: 'danhmuc.html?tab=plo' }
          ]
        }
      ];

      // Đọc giá trị cột linh hoạt (không phân biệt hoa/thường & bí danh cột)
      const getField = (obj, keys, fallback = '') => {
        for (const k of keys) {
          if (obj && obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== '') {
            return String(obj[k]).trim();
          }
        }
        return fallback;
      };

      function App() {
        const [user, setUser] = React.useState(() => {
          try { return JSON.parse(localStorage.getItem('vnpt_user')); } catch { return null; }
        });
        const [email, setEmail] = React.useState('');
        const [loading, setLoading] = React.useState(false);
        const [error, setError] = React.useState('');

        // Đọc tab ban đầu từ URL (?tab=spdv hoặc ?tab=plo)
        const [activeSubTab, setActiveSubTab] = React.useState(() => {
          const t = (new URLSearchParams(window.location.search).get('tab') || 'spdv').toLowerCase();
          return t === 'plo' ? 'plo' : 'spdv';
        });
        const [expandedMenu, setExpandedMenu] = React.useState('danhmuc'); // Mở sẵn menu Danh mục

        // Dữ liệu từ API getDanhMuc
        const [spdvList, setSpdvList] = React.useState([]);
        const [ploList, setPloList] = React.useState([]);
        const [search, setSearch] = React.useState('');
        const [filterPlo, setFilterPlo] = React.useState('ALL');
        const [expandedPlo, setExpandedPlo] = React.useState({});

        React.useEffect(() => { if (user) fetchDanhMucData(); }, [user]);

        const handleLogin = async (e) => {
          e.preventDefault();
          setLoading(true);
          try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', email }) }).then(r => r.json());
            if (res.status === 'success') {
              localStorage.setItem('vnpt_user', JSON.stringify(res.user));
              setUser(res.user);
            } else { alert(res.message || 'Sai thông tin đăng nhập!'); }
          } catch (err) {
            alert('Mất kết nối API.');
          }
          setLoading(false);
        };

        const handleLogout = () => {
          setUser(null);
          localStorage.removeItem('vnpt_user');
          window.location.href = 'index.html';
        };

        const switchSubTab = (tab) => {
          setActiveSubTab(tab);
          setSearch('');
          const url = new URL(window.location);
          url.searchParams.set('tab', tab);
          window.history.replaceState({}, '', url);
        };

        const fetchDanhMucData = async () => {
          setLoading(true);
          setError('');
          try {
            const res = await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'getDanhMuc' })
            }).then(r => r.json());

            if (res.status !== 'success') throw new Error(res.message || 'Không tải được dữ liệu danh mục');

            const spdv = (res.data && res.data.spdv) || [];
            const plo = (res.data && res.data.plo) || [];
            setSpdvList(spdv);
            setPloList(plo);

            // Mặc định mở sẵn danh sách SPDV trực thuộc từng PLO
            const initExpand = {};
            plo.forEach(p => { initExpand[p.MA_PLO] = true; });
            setExpandedPlo(initExpand);
          } catch (err) {
            setError(err.message);
          }
          setLoading(false);
        };

        // Nếu chưa đăng nhập -> hiện form đăng nhập giống hệt index.html
        if (!user) {
          return (
            <div className="flex h-screen w-full items-center justify-center bg-gray-200">
              <form onSubmit={handleLogin} className="bg-white p-10 border-t-4 border-vnpt shadow-xl w-96 rounded">
                <h2 className="text-2xl font-bold text-navy mb-6 text-center">ĐĂNG NHẬP</h2>
                <input className="w-full mb-6 p-3 border rounded focus:outline-vnpt text-sm" placeholder="Email đăng nhập" value={email} onChange={e => setEmail(e.target.value)} required />
                <button disabled={loading} className="w-full bg-vnpt text-white py-3 font-bold rounded hover:bg-navy transition">
                  {loading ? 'ĐANG KẾT NỐI...' : 'VÀO HỆ THỐNG'}
                </button>
              </form>
            </div>
          );
        }

        // KPI tổng quan
        const totalSpdv = spdvList.length;
        const mappedSpdv = spdvList.filter(r => getField(r, ['MA_PLO', 'plo_code', 'ma_plo', 'sxkd_plo']) !== '').length;
        const unmappedSpdv = totalSpdv - mappedSpdv;

        // Lọc SPDV
        const q = search.toLowerCase();
        const filteredSpdv = spdvList.filter(row => {
          const maPlo = getField(row, ['MA_PLO', 'plo_code', 'ma_plo', 'sxkd_plo']).toUpperCase();
          const matchPlo = filterPlo === 'ALL' || (filterPlo === 'UNMAPPED' ? !maPlo : maPlo === filterPlo);
          const matchText = !q || Object.values(row).some(v => String(v).toLowerCase().includes(q));
          return matchPlo && matchText;
        });

        // Lọc PLO (tìm theo mã PLO, tên PLO hoặc SPDV trực thuộc)
        const filteredPlo = !q ? ploList : ploList.filter(p =>
          (p.MA_PLO || '').toLowerCase().includes(q) ||
          (p.TEN_PLO || '').toLowerCase().includes(q) ||
          (p.ds_spdv || []).some(s => Object.values(s).some(v => String(v).toLowerCase().includes(q)))
        );

        const toggleAllPlo = (open) => {
          const next = {};
          ploList.forEach(p => { next[p.MA_PLO] = open; });
          setExpandedPlo(next);
        };

        return (
          <div className="flex h-screen w-full">
            {/* SIDEBAR ĐIỀU HƯỚNG GIỐNG HỆT INDEX.HTML */}
            <aside className="w-[200px] bg-navy text-white flex flex-col shadow-2xl z-20 shrink-0">
              <div className="p-4 border-b border-white/20 flex flex-col items-center">
                <div className="text-2xl font-extrabold tracking-widest text-vnpt bg-white px-3 py-1 rounded shadow mb-2">VNPT</div>
                <div className="text-[10px] text-center font-semibold text-gray-300 tracking-wider">HỆ THỐNG ĐIỀU HÀNH</div>
              </div>
              <nav className="flex-1 py-3 px-3 space-y-1 overflow-y-auto">
                {MENU_ITEMS.map(item => (
                  <div key={item.id}>
                    <a
                      href={item.href || '#'}
                      onClick={(e) => {
                        if (item.subItems) { e.preventDefault(); setExpandedMenu(expandedMenu === item.id ? '' : item.id); }
                      }}
                      className={`w-full flex items-center justify-between px-3 py-3 rounded text-left transition font-semibold ${
                        item.id === 'danhmuc' ? 'bg-vnpt text-white shadow' : 'text-gray-300 hover:bg-hoverbg hover:text-white'
                      }`}>
                      <span className="text-sm font-bold tracking-wide">{item.label}</span>
                      {item.subItems && <span className="text-xs">{expandedMenu === item.id ? '▼' : '▶'}</span>}
                    </a>
                    {item.subItems && expandedMenu === item.id && (
                      <div className="ml-4 mt-1 space-y-1 border-l border-white/20 pl-2">
                        {item.subItems.map(sub => (
                          <a
                            key={sub.id}
                            href={sub.href}
                            onClick={(e) => { e.preventDefault(); switchSubTab(sub.id); }}
                            className={`block w-full text-left px-2 py-2 text-sm rounded transition ${
                              activeSubTab === sub.id
                                ? 'bg-white/20 text-white font-bold'
                                : 'text-gray-300 hover:text-white hover:bg-white/10'
                            }`}>
                            {sub.label}
                          </a>
                        ))}
                      </div>
                    )}
                  </div>
                ))}
              </nav>
            </aside>

            {/* KHUNG NỘI DUNG CHÍNH */}
            <main className="flex-1 flex flex-col overflow-hidden bg-gray-50">
              {/* HEADER GIỐNG HỆT INDEX.HTML */}
              <header className="bg-white px-6 py-4 flex justify-between items-center shrink-0 border-b">
                <h1 className="text-2xl font-bold uppercase tracking-wide text-navy">
                  {activeSubTab === 'spdv' ? 'DANH MỤC SPDV' : 'DANH MỤC PLO'}
                </h1>
                <div className="flex items-center gap-4 text-sm">
                  <span className="font-semibold text-gray-600">{user.email}</span>
                  <span className="bg-vnpt/10 text-vnpt border border-vnpt px-3 py-1.5 rounded-full font-bold">Quyền: {user.tenClo}</span>
                  <button onClick={handleLogout} className="bg-risk text-white px-3 py-1.5 rounded font-bold hover:bg-red-700 transition">Đăng xuất</button>
                </div>
              </header>

              {/* THANH BỘ LỌC NGANG */}
              <div className="bg-white px-6 py-3 flex flex-wrap gap-4 shrink-0 border-b shadow-sm items-end justify-between z-10">
                <div className="flex items-end gap-3 flex-1">
                  <div className="flex flex-col w-72">
                    <label className="text-xs font-bold text-navy mb-1">Tìm kiếm nhanh</label>
                    <input
                      type="text"
                      value={search}
                      onChange={e => setSearch(e.target.value)}
                      placeholder={activeSubTab === 'spdv' ? 'Mã SPDV, tên SPDV, mã PLO...' : 'Mã PLO, tên PLO, SPDV trực thuộc...'}
                      className="border border-gray-300 p-2 rounded text-sm w-full focus:outline-vnpt"
                    />
                  </div>

                  {activeSubTab === 'spdv' ? (
                    <div className="flex flex-col w-64">
                      <label className="text-xs font-bold text-navy mb-1">Lọc theo PLO</label>
                      <select
                        value={filterPlo}
                        onChange={e => setFilterPlo(e.target.value)}
                        className="border border-gray-300 p-2 rounded text-sm w-full focus:outline-vnpt bg-white">
                        <option value="ALL">Tất cả PLO</option>
                        <option value="UNMAPPED">⚠ Chưa gắn PLO</option>
                        {ploList.map(p => (
                          <option key={p.MA_PLO} value={p.MA_PLO}>{p.MA_PLO} - {p.TEN_PLO}</option>
                        ))}
                      </select>
                    </div>
                  ) : (
                    <div className="flex gap-2">
                      <button onClick={() => toggleAllPlo(true)} className="px-3 py-2 text-xs font-bold border border-gray-300 rounded hover:bg-gray-100 text-navy">Mở tất cả</button>
                      <button onClick={() => toggleAllPlo(false)} className="px-3 py-2 text-xs font-bold border border-gray-300 rounded hover:bg-gray-100 text-navy">Thu gọn</button>
                    </div>
                  )}
                </div>

                <button onClick={fetchDanhMucData} className="bg-vnpt text-white px-4 py-2 rounded text-xs font-bold hover:bg-navy transition">
                  Làm mới dữ liệu
                </button>
              </div>

              {loading && <div className="text-center text-vnpt text-sm py-1 font-bold animate-pulse bg-white">Đang đồng bộ dữ liệu...</div>}
              {error && <div className="mx-6 mt-4 p-3 bg-red-50 border border-risk text-risk rounded text-sm font-semibold">Lỗi: {error}</div>}

              {/* VÙNG NỘI DUNG CUỘN */}
              <div className="flex-1 overflow-auto px-6 py-5 space-y-5">
                {/* 4 THẺ KPI */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="bg-white border rounded p-4 shadow-sm">
                    <div className="text-xs font-bold text-navy uppercase">Tổng số PLO (DMPLO)</div>
                    <div className="text-3xl font-bold text-navy mt-1">{ploList.length}</div>
                  </div>
                  <div className="bg-white border rounded p-4 shadow-sm">
                    <div className="text-xs font-bold text-navy uppercase">Tổng số SPDV (DMSPDV)</div>
                    <div className="text-3xl font-bold text-vnpt mt-1">{totalSpdv}</div>
                  </div>
                  <div className="bg-white border rounded p-4 shadow-sm">
                    <div className="text-xs font-bold text-navy uppercase">SPDV đã gắn PLO</div>
                    <div className="text-3xl font-bold text-good mt-1">{mappedSpdv}</div>
                  </div>
                  <div className="bg-white border rounded p-4 shadow-sm">
                    <div className="text-xs font-bold text-navy uppercase">SPDV chưa gắn PLO</div>
                    <div className={`text-3xl font-bold mt-1 ${unmappedSpdv > 0 ? 'text-risk' : 'text-good'}`}>{unmappedSpdv}</div>
                  </div>
                </div>

                {/* TAB 1: DỮ LIỆU SHEET DMSPDV */}
                {activeSubTab === 'spdv' && (
                  <div className="bg-white border rounded shadow-sm overflow-hidden">
                    <div className="overflow-auto max-h-[540px]">
                      <table className="w-full text-left text-sm border-collapse">
                        <thead className="bg-navy text-white sticky top-0 z-10 shadow">
                          <tr>
                            <th className="p-3 w-12 text-center">STT</th>
                            <th className="p-3">Mã SPDV</th>
                            <th className="p-3">Tên SPDV</th>
                            <th className="p-3">Mã PLO</th>
                            <th className="p-3">Nhóm SPDV</th>
                            <th className="p-3">Luồng SPDV</th>
                            <th className="p-3">Trạng thái</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-100">
                          {filteredSpdv.map((row, idx) => {
                            const maSpdv = getField(row, ['MA_SPDV', 'ma_spdv', 'spdv_code'], '-');
                            const tenSpdv = getField(row, ['TEN_SPDV', 'ten_spdv', 'spdv_name'], '-');
                            const maPlo = getField(row, ['MA_PLO', 'plo_code', 'ma_plo', 'sxkd_plo']);
                            const nhomSpdv = getField(row, ['NHOM_SPDV', 'nhom_spdv', 'nhomspdv_code', 'sxkd_nhomspdv'], '-');
                            const luongSpdv = getField(row, ['LUONG_SPDV', 'luong_spdv'], '-');
                            const trangThai = getField(row, ['TRANG_THAI', 'trang_thai', 'status'], '-');
                            return (
                              <tr key={idx} className="hover:bg-blue-50 transition">
                                <td className="p-3 text-center text-gray-500">{idx + 1}</td>
                                <td className="p-3 font-bold text-navy">{maSpdv}</td>
                                <td className="p-3 font-semibold text-gray-800">{tenSpdv}</td>
                                <td className="p-3">
                                  {maPlo ? (
                                    <span className="px-2.5 py-0.5 rounded bg-blue-100 text-navy font-bold text-xs">{maPlo}</span>
                                  ) : (
                                    <span className="px-2.5 py-0.5 rounded bg-red-100 text-risk font-bold text-xs">Chưa gắn PLO</span>
                                  )}
                                </td>
                                <td className="p-3 text-gray-600">{nhomSpdv}</td>
                                <td className="p-3 text-gray-600">{luongSpdv}</td>
                                {(() => {
                                  const st = (trangThai || '').trim().toUpperCase();
                                  let badgeClass = 'bg-gray-100 text-gray-600'; // Mặc định: Grey
                                  if (st === 'ĐÃ GTM') badgeClass = 'bg-green-100 text-good'; // Đã GTM: Green
                                  else if (st === 'CHƯA GTM') badgeClass = 'bg-yellow-100 text-yellow-700'; // Chưa GTM: Yellow
                                
                                  return (
                                    <td className="p-3">
                                      <span className={`px-2.5 py-0.5 rounded-full font-bold text-xs whitespace-nowrap ${badgeClass}`}>
                                        {trangThai}
                                      </span>
                                    </td>
                                  );
                                })()}
                              </tr>
                            );
                          })}
                          {filteredSpdv.length === 0 && (
                            <tr><td colSpan="6" className="p-8 text-center text-gray-400">Không tìm thấy SPDV phù hợp.</td></tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* TAB 2: DỮ LIỆU SHEET DMPLO & SPDV TRỰC THUỘC */}
                {activeSubTab === 'plo' && (
                  <div className="space-y-3">
                    {filteredPlo.map(plo => {
                      const isOpen = !!expandedPlo[plo.MA_PLO];
                      const ds = plo.ds_spdv || [];
                      return (
                        <div key={plo.MA_PLO} className="bg-white border rounded shadow-sm overflow-hidden">
                          <div
                            onClick={() => setExpandedPlo(prev => ({ ...prev, [plo.MA_PLO]: !prev[plo.MA_PLO] }))}
                            className="px-4 py-3 flex items-center justify-between cursor-pointer hover:bg-blue-50/50 transition">
                            <div className="flex items-center gap-3">
                              <span className="px-2.5 py-1 rounded bg-navy text-white text-xs font-bold">{plo.MA_PLO}</span>
                              <h2 className="text-sm font-bold text-navy">{plo.TEN_PLO || '(Chưa có tên PLO)'}</h2>
                            </div>
                            <div className="flex items-center gap-3">
                              <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold ${ds.length > 0 ? 'bg-blue-100 text-vnpt' : 'bg-red-100 text-risk'}`}>
                                {ds.length} SPDV
                              </span>
                              <span className="text-gray-400 text-xs">{isOpen ? '▲' : '▼'}</span>
                            </div>
                          </div>

                          {isOpen && (
                            <div className="border-t bg-gray-50 px-4 py-3">
                              {ds.length === 0 ? (
                                <p className="text-xs text-gray-400 italic">Chưa có SPDV nào gắn mã {plo.MA_PLO} trong sheet DMSPDV.</p>
                              ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2.5">
                                  {ds.map((s, i) => (
                                    <div key={i} className="bg-white p-3 rounded border hover:border-vnpt transition">
                                      <div className="text-xs font-bold text-vnpt">{getField(s, ['MA_SPDV', 'ma_spdv', 'spdv_code'], '-')}</div>
                                      <div className="text-sm font-bold text-gray-800 mt-0.5">{getField(s, ['TEN_SPDV', 'ten_spdv', 'spdv_name'], '-')}</div>
                                      <div className="text-xs text-gray-500 mt-1">Nhóm SPDV: {getField(s, ['NHOM_SPDV', 'nhom_spdv', 'nhomspdv_code'])} | Luồng {getField(s, ['LUONG_SPDV', 'luong_spdv'])}</div>
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                    {filteredPlo.length === 0 && (
                      <div className="bg-white p-8 border rounded text-center text-gray-400 text-sm">Không tìm thấy PLO phù hợp.</div>
                    )}
                  </div>
                )}
              </div>
              
              {/* FOOTER LOGO VNPT-IT */}
              <footer className="bg-white border-t px-6 py-2.5 flex justify-between items-center shrink-0 text-xs text-gray-500">
                <div className="flex items-center gap-2.5">
                  <span className="text-vnpt bg-white font-extrabold px-2 py-0.5 rounded tracking-wider text-[11px]">VNPT-IT</span>
                  <span className="text-gray-400">|</span><span>Tổ Dữ liệu • Ban KDGP</span>
                </div>
              </footer>
            </main>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    } catch (err) {
      document.getElementById('root').innerHTML = `<div style="padding: 40px; text-align: center;"><h2 style="color: #ef4444; font-size: 24px; font-weight: bold;">LỖI BIÊN DỊCH REACT</h2><p style="color: #333; margin-top: 10px;">${err.message}</p></div>`;
    }
  </script>
</body>
</html>
