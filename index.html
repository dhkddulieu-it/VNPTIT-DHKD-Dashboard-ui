<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SXKD-CHKD_MVP | Executive Command Center</title>
    <style>
        :root {
            --navy: #003B7A;
            --blue: #0094D9;
            --green: #28a745;
            --red: #dc3545;
            --bg-light: #f4f7f6;
            --text-dark: #333;
        }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-light); color: var(--text-dark); }
        
        /* Layout 16:9 Aspect Ratio Container for Command Center */
        .dashboard-container { max-width: 1600px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        header { background-color: var(--navy); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .logo-title { font-size: 1.2rem; font-weight: bold; }
        .user-info { font-size: 0.9rem; }
        .user-info span { font-weight: bold; color: var(--blue); background: white; padding: 4px 10px; border-radius: 4px; margin-left: 10px; cursor: pointer; }
        
        /* Auth Screen (Simulation) */
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--navy); color: white; }
        .auth-box { background: white; color: var(--text-dark); padding: 40px; border-radius: 8px; text-align: center; width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        select, button { width: 100%; padding: 12px; margin-top: 20px; font-size: 1rem; border-radius: 4px; border: 1px solid #ccc; }
        button { background-color: var(--blue); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #0077b3; }

        /* Dashboard Content */
        #main-content { padding: 30px; flex-grow: 1; display: none; }
        .breadcrumb { font-size: 0.9rem; color: #666; margin-bottom: 20px; font-weight: bold; }
        .breadcrumb span { cursor: pointer; color: var(--blue); }
        .breadcrumb span:hover { text-decoration: underline; }

        /* KPI Cards */
        .kpi-row { display: flex; gap: 20px; margin-bottom: 30px; }
        .kpi-card { background: white; flex: 1; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-top: 4px solid var(--navy); }
        .kpi-card.warning { border-top-color: var(--red); }
        .kpi-title { font-size: 0.9rem; color: #666; text-transform: uppercase; margin-bottom: 10px; }
        .kpi-value { font-size: 2rem; font-weight: bold; color: var(--navy); }
        
        /* Data Tables */
        .data-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .data-section h3 { margin-top: 0; color: var(--navy); border-bottom: 2px solid var(--blue); padding-bottom: 10px; display: inline-block; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: var(--navy); font-size: 0.9rem; }
        .status-green { color: var(--green); font-weight: bold; }
        .status-red { color: var(--red); font-weight: bold; }
        .action-btn { background: var(--blue); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .action-btn:hover { background: var(--navy); }
    </style>
</head>
<body>

    <!-- Mock Authentication Screen -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2 style="color: #003B7A;">Hệ thống Quản trị Dữ liệu</h2>
            <p>Mô phỏng cơ chế cấp quyền Role-based</p>
            <select id="role-selector">
                <option value="ceo">Ban Tổng Giám đốc (Toàn cảnh)</option>
                <option value="clo_vung_nam">CLO Cấp 1 - Vùng Nam (Chỉ thấy Vùng Nam)</option>
                <option value="clo_ca_mau">CLO Cấp 2 - TTP Cà Mau (Chỉ thấy Cà Mau)</option>
            </select>
            <button onclick="login()">Đăng nhập hệ thống</button>
        </div>
    </div>

    <!-- Main Dashboard Application -->
    <div id="dashboard-container" class="dashboard-container" style="display: none;">
        <header>
            <div class="logo-title">VNPT-IT | COMMAND CENTER: SXKD-CHKD_MVP</div>
            <div class="user-info">
                Đang truy cập: <span id="current-user-role"></span>
                <span onclick="logout()" style="background: var(--red); color: white;">Thoát</span>
            </div>
        </header>

        <div id="main-content">
            <div class="breadcrumb" id="breadcrumb"></div>
            
            <div class="kpi-row" id="kpi-container">
                <!-- KPI Cards injected here -->
            </div>

            <div class="data-section">
                <h3 id="table-title">Chi tiết nghiệp vụ</h3>
                <table id="data-table">
                    <thead id="table-head"></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 1. Phân mảnh dữ liệu tại nguồn (Mô phỏng các file JSON tĩnh trên GitHub Repo)
        const mockDatabase = {
            "ceo_dashboard": {
                level: 0,
                title: "Toàn cảnh 3 CLO Cấp 1",
                kpis: [
                    { title: "Tổng Doanh Thu Cơ Hội", value: "3,450 Tỷ" },
                    { title: "Tổng Số POC Đang Chạy", value: "142" },
                    { title: "Cảnh Báo Sớm (e-GP quá hạn)", value: "5", warning: true }
                ],
                tableColumns: ["Khu vực", "Giám đốc phụ trách", "Tỷ lệ hoàn thành", "Thao tác"],
                tableData: [
                    { name: "CLO Vùng Nam", pic: "Nguyễn Văn A", progress: "85%", status: "status-green", id: "vung_nam" },
                    { name: "CLO Vùng Bắc", pic: "Trần Thị B", progress: "92%", status: "status-green", id: "vung_bac" },
                    { name: "CLO Trung Ương", pic: "Lê Văn C", progress: "60%", status: "status-red", id: "trung_uong" }
                ]
            },
            "vung_nam": {
                level: 1,
                title: "Chi tiết CLO Cấp 1: Vùng Nam",
                kpis: [
                    { title: "Doanh Thu Vùng Nam", value: "1,200 Tỷ" },
                    { title: "Số POC Đang Chạy", value: "45" },
                    { title: "TTP Cần Hỗ Trợ", value: "2", warning: true }
                ],
                tableColumns: ["TTP", "Dự án trọng điểm", "Doanh thu dự kiến", "Thao tác"],
                tableData: [
                    { name: "TTP Cà Mau", project: "CĐS Nông nghiệp", revenue: "50 Tỷ", status: "status-green", id: "ttp_ca_mau" },
                    { name: "TTP TP.HCM", project: "TT Hành chính công", revenue: "800 Tỷ", status: "status-green", id: "ttp_hcm" },
                    { name: "TTP Bạc Liêu", project: "Giám sát thông minh", revenue: "30 Tỷ", status: "status-red", id: "ttp_bac_lieu" }
                ]
            },
            "ttp_ca_mau": {
                level: 2,
                title: "Chi tiết CLO Cấp 2: TTP Cà Mau",
                kpis: [
                    { title: "Doanh Thu Mục Tiêu", value: "50 Tỷ" },
                    { title: "Gói thầu e-GP_TBMT", value: "12" },
                    { title: "Hồ sơ cần thẩm định", value: "1", warning: true }
                ],
                tableColumns: ["Mã Dự án / Gói thầu", "Khách hàng", "Giai đoạn", "Trạng thái"],
                tableData: [
                    { id: "POC-26-001", client: "HTX Tân Hưng", phase: "Triển khai POC", status: "Đang xử lý (status-green)" },
                    { id: "eGP-26-045", client: "Sở KHCN Cà Mau", phase: "Thẩm định YCBG", status: "Chờ duyệt (status-red)" },
                    { id: "eGP-26-089", client: "UBND Tỉnh Cà Mau", phase: "Phê duyệt KHLCNT", status: "Hoàn thành (status-green)" }
                ]
            }
        };

        let currentRole = "";

        // 2. Logic Xác thực & Phân quyền
        function login() {
            currentRole = document.getElementById('role-selector').value;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('dashboard-container').style.display = 'flex';
            document.getElementById('main-content').style.display = 'block';
            
            const roleText = document.getElementById('role-selector').options[document.getElementById('role-selector').selectedIndex].text;
            document.getElementById('current-user-role').innerText = roleText;

            // Load data based on Role
            if (currentRole === 'ceo') {
                loadView('ceo_dashboard');
            } else if (currentRole === 'clo_vung_nam') {
                loadView('vung_nam');
            } else if (currentRole === 'clo_ca_mau') {
                loadView('ttp_ca_mau');
            }
        }

        function logout() {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('dashboard-container').style.display = 'none';
            currentRole = "";
        }

        // 3. Logic Render & Drill-down
        function loadView(dataId) {
            // Giả lập Fetch API lấy cục JSON tương ứng
            const data = mockDatabase[dataId];
            if (!data) return;

            // Render Breadcrumbs
            let breadcrumbHtml = "";
            if (data.level === 0) {
                breadcrumbHtml = `Tổng quan toàn quốc`;
            } else if (data.level === 1) {
                if (currentRole === 'ceo') {
                    breadcrumbHtml = `<span onclick="loadView('ceo_dashboard')">Tổng quan toàn quốc</span> > Vùng Nam`;
                } else {
                    breadcrumbHtml = `Vùng Nam`;
                }
            } else if (data.level === 2) {
                if (currentRole === 'ceo') {
                    breadcrumbHtml = `<span onclick="loadView('ceo_dashboard')">Tổng quan toàn quốc</span> > <span onclick="loadView('vung_nam')">Vùng Nam</span> > Cà Mau`;
                } else if (currentRole === 'clo_vung_nam') {
                    breadcrumbHtml = `<span onclick="loadView('vung_nam')">Vùng Nam</span> > Cà Mau`;
                } else {
                    breadcrumbHtml = `TTP Cà Mau`;
                }
            }
            document.getElementById('breadcrumb').innerHTML = breadcrumbHtml;

            // Render KPIs
            const kpiContainer = document.getElementById('kpi-container');
            kpiContainer.innerHTML = "";
            data.kpis.forEach(kpi => {
                kpiContainer.innerHTML += `
                    <div class="kpi-card ${kpi.warning ? 'warning' : ''}">
                        <div class="kpi-title">${kpi.title}</div>
                        <div class="kpi-value ${kpi.warning ? 'status-red' : ''}">${kpi.value}</div>
                    </div>
                `;
            });

            // Render Table
            document.getElementById('table-title').innerText = data.title;
            const thead = document.getElementById('table-head');
            thead.innerHTML = "<tr>" + data.tableColumns.map(col => `<th>${col}</th>`).join('') + "</tr>";

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = "";
            data.tableData.forEach(row => {
                let tr = "<tr>";
                if (data.level === 0) {
                    tr += `<td>${row.name}</td><td>${row.pic}</td><td class="${row.status}">${row.progress}</td>`;
                    tr += `<td><button class="action-btn" onclick="loadView('${row.id}')">Xem chi tiết Vùng</button></td>`;
                } else if (data.level === 1) {
                    tr += `<td>${row.name}</td><td>${row.project}</td><td class="${row.status}">${row.revenue}</td>`;
                    if (row.id === 'ttp_ca_mau') {
                         tr += `<td><button class="action-btn" onclick="loadView('${row.id}')">Drill-down TTP</button></td>`;
                    } else {
                         tr += `<td><button class="action-btn" style="background:#ccc; cursor:not-allowed">Chưa có data</button></td>`;
                    }
                } else if (data.level === 2) {
                    let statusClass = row.status.includes('green') ? 'status-green' : 'status-red';
                    let statusText = row.status.split(' ')[0] + (row.status.split(' ')[1] ? ' ' + row.status.split(' ')[1] : '');
                    tr += `<td><strong>${row.id}</strong></td><td>${row.client}</td><td>${row.phase}</td><td class="${statusClass}">${statusText}</td>`;
                }
                tr += "</tr>";
                tbody.innerHTML += tr;
            });
        }
    </script>
</body>
</html>
