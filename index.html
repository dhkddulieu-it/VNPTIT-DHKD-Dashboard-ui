<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Executive Dashboard - VNPT</title>
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: { colors: { vnpt: '#0094D9', navy: '#003B7A', good: '#22c55e', risk: '#ef4444' } }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center font-sans">
  <div id="root" class="w-full h-full max-w-[1920px] aspect-video bg-white shadow-2xl overflow-hidden flex flex-col"></div>

  <script type="text/babel">
    const API_URL = 'https://script.google.com/macros/s/AKfycby6E6r6KhZ54J6by2s1PF8MqtOSJu74GcyqO4GsFnSwWd-GmDScZFrS5Brq0IwXlO1N/exec';

    function App() {
      const [user, setUser] = React.useState(JSON.parse(localStorage.getItem('vnpt_user')));
      const [email, setEmail] = React.useState('');
      const [loading, setLoading] = React.useState(false);
      
      const [rawData, setRawData] = React.useState([]);
      const [ploList, setPloList] = React.useState([]);
      
      // Filter States
      const [filters, setFilters] = React.useState({
        thoiGian: '', maTinh: 'ALL', luongSPDV: 'ALL', nhomSPDV: 'ALL', plo: 'ALL'
      });

      React.useEffect(() => {
        if (user) fetchDashboardData();
      }, [user]);

      const handleLogin = async (e) => {
        e.preventDefault();
        setLoading(true);
        const res = await fetch(API_URL, {
          method: 'POST', body: JSON.stringify({ action: 'login', email })
        }).then(r => r.json());

        if (res.status === 'success') {
          localStorage.setItem('vnpt_user', JSON.stringify(res.user));
          setUser(res.user);
        } else {
          alert('Không có quyền truy cập hoặc sai email!');
        }
        setLoading(false);
      };

      const fetchDashboardData = async () => {
        setLoading(true);
        const res = await fetch(API_URL, {
          method: 'POST', body: JSON.stringify({ action: 'getData', provinces: user.provinces })
        }).then(r => r.json());

        if (res.status === 'success') {
          setRawData(res.data);
          setPloList(res.ploData);
          if(res.data.length > 0) setFilters(f => ({ ...f, thoiGian: res.data[0]['thang'] || '' }));
        }
        setLoading(false);
      };

      // Helper: Format số liệu
      const fmtNum = (num) => new Intl.NumberFormat('vi-VN').format(num || 0);
      const fmtPct = (num) => `${(num * 100).toFixed(1)}%`;

      if (!user) {
        return (
          <div className="flex flex-col items-center justify-center h-full bg-gray-200 w-full">
            <form onSubmit={handleLogin} className="bg-white p-10 border-t-4 border-vnpt shadow-xl w-96 rounded">
              <h2 className="text-2xl font-bold text-navy mb-2 text-center">BI EXECUTIVE LOGIN</h2>
              <p className="text-sm text-center text-gray-500 mb-6">Đăng nhập bằng Email Hệ thống</p>
              <input className="w-full mb-6 p-3 border rounded focus:outline-vnpt" 
                     placeholder="Ví dụ: tiamovnn@gmail.com" 
                     value={email} onChange={e => setEmail(e.target.value)} required />
              <button disabled={loading} className="w-full bg-vnpt text-white py-3 font-bold rounded hover:bg-navy transition">
                {loading ? 'ĐANG XÁC THỰC...' : 'VÀO HỆ THỐNG'}
              </button>
            </form>
          </div>
        );
      }

      // Logic Lọc Dữ liệu
      let filteredData = rawData.filter(d => 
        (filters.thoiGian === '' || d['thang'] === filters.thoiGian) &&
        (filters.maTinh === 'ALL' || d['ma_tinh'] === filters.maTinh) &&
        (filters.luongSPDV === 'ALL' || d['luong_spdv'] === filters.luongSPDV) &&
        (filters.nhomSPDV === 'ALL' || d['nhomspdv_code'] === filters.nhomSPDV) &&
        (filters.plo === 'ALL' || d['plo_code'] === filters.plo)
      );

      // Core Aggregation Engine (Tính toán 8 KPIs)
      const kpi = filteredData.reduce((acc, curr) => {
        acc.doanhThuThucHien += Number(curr['dt_thuc_hien'] || 0);
        acc.doanhThuKeHoach += Number(curr['dt_ke_hoach'] || 0);
        acc.doanhThuThangTruoc += Number(curr['dt_thang_truoc'] || 0);
        acc.pipeTongGt += Number(curr['pipe_tong_gt'] || 0);
        acc.pipeTongSl += Number(curr['pipe_tong_sl'] || 0);
        acc.pipeMoGt += Number(curr['pipe_mo_gt'] || 0);
        acc.pipeMoSl += Number(curr['pipe_mo_sl'] || 0);
        acc.pipeDongGt += Number(curr['pipe_dong_gt'] || 0);
        acc.pipeDongSl += Number(curr['pipe_dong_sl'] || 0);
        acc.duBaoDt += Number(curr['du_bao_dt'] || 0);
        return acc;
      }, {
        doanhThuThucHien: 0, doanhThuKeHoach: 0, doanhThuThangTruoc: 0,
        pipeTongGt: 0, pipeTongSl: 0, pipeMoGt: 0, pipeMoSl: 0, pipeDongGt: 0, pipeDongSl: 0, duBaoDt: 0
      });

      // Các tỷ lệ phái sinh
      const tyLeHT = kpi.doanhThuKeHoach ? kpi.doanhThuThucHien / kpi.doanhThuKeHoach : 0;
      const tangGiamMoM = kpi.doanhThuThangTruoc ? (kpi.doanhThuThucHien - kpi.doanhThuThangTruoc) / kpi.doanhThuThangTruoc : 0;
      const tyLeUocHT = kpi.doanhThuKeHoach ? kpi.duBaoDt / kpi.doanhThuKeHoach : 0;
      const thieuHut = kpi.doanhThuKeHoach - kpi.doanhThuThucHien > 0 ? kpi.doanhThuKeHoach - kpi.doanhThuThucHien : 0;
      const tyLeThieu = kpi.doanhThuKeHoach ? thieuHut / kpi.doanhThuKeHoach : 0;

      // Card Component
      const KpiCard = ({ title, val1, lbl1, val2, lbl2, status }) => (
        <div className="bg-white border border-gray-200 rounded-lg p-4 shadow-sm flex flex-col justify-between">
          <h3 className="text-gray-500 font-semibold text-sm mb-2">{title}</h3>
          <div>
            <div className={`text-2xl font-bold ${status === 'good' ? 'text-good' : status === 'risk' ? 'text-risk' : 'text-navy'}`}>{val1}</div>
            <div className="text-xs text-gray-400 mb-2">{lbl1}</div>
            <div className="text-lg font-bold text-gray-700 border-t pt-2">{val2}</div>
            <div className="text-xs text-gray-400">{lbl2}</div>
          </div>
        </div>
      );

      return (
        <React.Fragment>
          {/* Header */}
          <header className="bg-navy text-white px-6 py-3 flex justify-between items-center shrink-0">
            <h1 className="text-xl font-bold tracking-wide">EXECUTIVE DASHBOARD: SXKD - CHKD</h1>
            <div className="flex items-center gap-4 text-sm">
              <span className="bg-vnpt px-3 py-1 rounded-full">{user.tenClo}</span>
              <span>{user.email}</span>
              <button onClick={() => { setUser(null); localStorage.clear(); }} className="hover:text-risk font-bold ml-4">Đăng xuất</button>
            </div>
          </header>

          {/* Filter Bar */}
          <div className="bg-gray-100 px-6 py-3 flex gap-4 shrink-0 border-b">
            <select className="border p-2 rounded text-sm w-40" value={filters.thoiGian} onChange={e => setFilters({...filters, thoiGian: e.target.value})}>
              <option value="">-- Thời gian --</option>
              {[...new Set(rawData.map(d => d['thang']))].map(t => <option key={t} value={t}>{t}</option>)}
            </select>
            <select className="border p-2 rounded text-sm w-40" value={filters.maTinh} onChange={e => setFilters({...filters, maTinh: e.target.value})}>
              <option value="ALL">Toàn địa bàn ({user.provinces.length})</option>
              {user.provinces.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
            <select className="border p-2 rounded text-sm w-40" value={filters.luongSPDV} onChange={e => setFilters({...filters, luongSPDV: e.target.value})}>
              <option value="ALL">Tất cả Luồng SPDV</option>
              <option value="Nhóm A">Nhóm A</option>
              <option value="Nhóm B-C">Nhóm B-C</option>
            </select>
            <select className="border p-2 rounded text-sm w-48" value={filters.nhomSPDV} onChange={e => setFilters({...filters, nhomSPDV: e.target.value})}>
              <option value="ALL">Tất cả Nhóm SPDV</option>
              {[...new Set(ploList.map(p => p['nhomspdv_code']))].map(n => n && <option key={n} value={n}>{n}</option>)}
            </select>
            <select className="border p-2 rounded text-sm flex-1" value={filters.plo} onChange={e => setFilters({...filters, plo: e.target.value})}>
              <option value="ALL">Tất cả PLO</option>
              {[...new Set(ploList.filter(p => filters.nhomSPDV === 'ALL' || p['nhomspdv_code'] === filters.nhomSPDV).map(p => p['plo_code']))].map(n => n && <option key={n} value={n}>{n}</option>)}
            </select>
          </div>

          {/* KPIs Grid */}
          <main className="flex-1 p-6 bg-gray-50 overflow-auto">
            {loading && <div className="text-center text-vnpt font-bold mb-4">Đang đồng bộ dữ liệu...</div>}
            <div className="grid grid-cols-4 gap-6 h-full">
              
              <KpiCard title="1. DOANH THU (THỰC HIỆN / KH)" 
                val1={fmtNum(kpi.doanhThuThucHien)} lbl1="Thực hiện (VNĐ)" 
                val2={fmtNum(kpi.doanhThuKeHoach)} lbl2="Kế hoạch (VNĐ)" status="neutral" />
              
              <KpiCard title="2. TỶ LỆ HOÀN THÀNH & TĂNG TRƯỞNG" 
                val1={fmtPct(tyLeHT)} lbl1="Tỷ lệ HT Kế hoạch" 
                val2={fmtPct(tangGiamMoM)} lbl2="Tăng/Giảm so với tháng trước" status={tyLeHT >= 1 ? 'good' : 'risk'} />
              
              <KpiCard title="3. PIPELINE (TỔNG KHỐI LƯỢNG)" 
                val1={fmtNum(kpi.pipeTongGt)} lbl1="Tổng giá trị (VNĐ)" 
                val2={fmtNum(kpi.pipeTongSl)} lbl2="Số lượng cơ hội" status="neutral" />
              
              <KpiCard title="4. PIPELINE MỞ (ĐANG XỬ LÝ)" 
                val1={fmtNum(kpi.pipeMoGt)} lbl1="Giá trị đang mở (VNĐ)" 
                val2={fmtNum(kpi.pipeMoSl)} lbl2="Số lượng" status="neutral" />
              
              <KpiCard title="5. PIPELINE ĐÓNG (THÀNH CÔNG)" 
                val1={fmtNum(kpi.pipeDongGt)} lbl1="Giá trị chốt deal (VNĐ)" 
                val2={fmtNum(kpi.pipeDongSl)} lbl2="Số lượng hợp đồng" status="good" />
              
              <KpiCard title="6. FORECAST (DỰ BÁO DOANH THU)" 
                val1={fmtNum(kpi.duBaoDt)} lbl1="Dự báo cuối kỳ (VNĐ)" 
                val2={fmtPct(tyLeUocHT)} lbl2="Tỷ lệ Ước hoàn thành" status={tyLeUocHT >= 1 ? 'good' : 'risk'} />
              
              <KpiCard title="7. GAP (KHOẢNG TRỐNG KẾ HOẠCH)" 
                val1={fmtNum(thieuHut)} lbl1="Thiếu hụt cần bù đắp (VNĐ)" 
                val2={fmtPct(tyLeThieu)} lbl2="Tỷ lệ thiếu" status={thieuHut > 0 ? 'risk' : 'good'} />

            </div>
          </main>
        </React.Fragment>
      );
    }
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
