<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Executive Dashboard - VNPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Nunito', 'sans-serif'] },
          colors: { vnpt: '#0094D9', navy: '#003B7A', good: '#22c55e', risk: '#ef4444', hoverbg: '#004c9e' }
        }
      }
    }
  </script>
</head>

<body class="bg-gray-100 text-gray-800 min-h-screen flex font-sans overflow-hidden">
  <div id="root" class="w-full h-screen flex">
    <div class="m-auto text-center text-risk font-bold text-xl">Đang khởi tạo hệ thống...</div>
  </div>

  <!-- BẮT LỖI TOÀN CỤC -->
  <script>
    window.onerror = function(message) {
      if (message.includes('ResizeObserver loop') || message.includes('Script error.')) return true;
      document.getElementById('root').innerHTML = '<div style="padding:40px;text-align:center;"><h2 style="color:#ef4444;font-size:24px;font-weight:bold;">HỆ THỐNG GẶP SỰ CỐ</h2><p style="color:#333;margin-top:10px;">Chi tiết lỗi: ' + message + '</p></div>';
      return false;
    };
  </script>

  <script type="text/babel">
    // =========================================================================
    // [PHẦN 0] CẤU HÌNH, HÀM TIỆN ÍCH (HELPERS) & COMPONENT DÙNG CHUNG
    // =========================================================================
    const parseNum = (val) => {
      if (val === null || val === undefined || val === '') return 0;
      if (typeof val === 'number') return val;
      return parseFloat(val.toString().replace(/,/g, '')) || 0;
    };

    // Quy đổi các cột đơn vị VND (COGS/Thực chi) sang trĐ để đồng nhất
    const vndToTr = (val) => {
      const n = parseNum(val);
      return Math.abs(n) >= 1000000 ? n / 1000000 : n;
    };

    // Đọc Dual-Key: ưu tiên mã trường dòng 5, fallback tên cột tiếng Việt
    const getField = (obj, keys, fallback = '') => {
      for (const k of keys) {
        if (obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
      }
      return fallback;
    };

    // Parse ngày chuẩn VN (dd/MM/yyyy) hoặc ISO (yyyy-MM-dd)
    const parseDateVN = (val) => {
      if (!val) return null;
      if (val instanceof Date && !isNaN(val)) return val;
      const s = val.toString().trim();
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) return new Date(s);
      const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (m) return new Date(parseInt(m[3], 10), parseInt(m[2], 10) - 1, parseInt(m[1], 10));
      const d = new Date(s);
      return isNaN(d) ? null : d;
    };

    const normalizeThang = (val) => {
      if (!val) return '';
      const str = val.toString().trim();
      if (str.match(/^\d{4}-\d{2}-\d{2}/)) {
        const parts = str.split('T')[0].split('-');
        return `${parseInt(parts[1], 10)}/${parts[0]}`;
      }
      if (str.includes('/')) {
        const parts = str.split('/');
        return `${parseInt(parts[0], 10)}/${parts[1]}`;
      }
      return str;
    };

    const getMonthVal = (mStr) => {
      if (!mStr) return null;
      const parts = mStr.toString().trim().split('/');
      if (parts.length === 2) return parseInt(parts[1], 10) * 100 + parseInt(parts[0], 10);
      return 0;
    };

    const fmtNum = (num) => new Intl.NumberFormat('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num || 0);
    const fmtInt = (num) => new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 0 }).format(num || 0);
    const fmtPct = (num) => `${(num * 100).toFixed(1)}%`;

    function KpiCard({ title, v1, l1, v2, l2, st }) {
      return (
        <div className="bg-white border rounded flex-1 p-4 shadow-sm flex flex-col justify-between hover:border-vnpt transition min-w-[160px]">
          <h3 className="text-navy font-bold text-xs mb-3 uppercase truncate">{title}</h3>
          <div>
            <div className={`text-3xl font-bold mb-1 ${st === 'good' ? 'text-good' : st === 'risk' ? 'text-risk' : 'text-vnpt'}`}>{v1}</div>
            <div className="text-xs text-gray-500 mb-3 truncate">{l1}</div>
            <div className="text-base font-bold text-gray-700 border-t pt-2">{v2}</div>
            <div className="text-xs text-gray-500 truncate">{l2}</div>
          </div>
        </div>
      );
    }

    try {
      const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, LabelList, Cell } = window.Recharts || {};
      const API_URL = 'https://script.google.com/macros/s/AKfycby6E6r6KhZ54J6by2s1PF8MqtOSJu74GcyqO4GsFnSwWd-GmDScZFrS5Brq0IwXlO1N/exec';
      const currentYear = new Date().getFullYear();
      const monthOptions = Array.from({ length: 12 }, (_, i) => `${i + 1}/${currentYear}`);

      const MENU_ITEMS = [
        { id: 'dashboard', label: 'DASHBOARD', href: '#' },
        { id: 'dean', label: 'CÁC KHUNG PHÁP LÝ', href: '#' },
        { id: 'cohoi', label: 'CƠ HỘI KINH DOANH', href: '#' },
        { id: 'poc', label: 'DỰ ÁN POC', href: '#' },
        { id: 'dauthau', label: 'ĐẤU THẦU', href: '#' },
        { id: 'hopdong', label: 'HỢP ĐỒNG', href: '#' },
        { id: 'khachhang', label: 'KHÁCH HÀNG', href: '#' },
        {
          id: 'danhmuc', label: 'DANH MỤC',
          subItems: [
            { id: 'dm_spdv', label: 'Danh mục SPDV', href: 'dmspdv.html' },
            { id: 'dm_plo', label: 'Danh mục PLO', href: '#' }
          ]
        }
      ];

      function App() {
        // =====================================================================
        // [PHẦN 1] STATE, ĐĂNG NHẬP & ĐỒNG BỘ DỮ LIỆU API
        // =====================================================================
        const [user, setUser] = React.useState(() => {
          try { return JSON.parse(localStorage.getItem('vnpt_user')); } catch { return null; }
        });
        const [email, setEmail] = React.useState('');
        const [loading, setLoading] = React.useState(false);

        // Dữ liệu thô từ Backend
        const [rawData, setRawData] = React.useState([]);
        const [pipelineRaw, setPipelineRaw] = React.useState([]);
        const [deanRaw, setDeanRaw] = React.useState([]);
        const [hopDongRaw, setHopDongRaw] = React.useState([]);
        const [ploList, setPloList] = React.useState([]);

        // Điều hướng & Bộ lọc
        const [activeTab, setActiveTab] = React.useState(() => {
          const params = new URLSearchParams(window.location.search);
          return params.get("tab") || "dashboard";
        });
        const [expandedMenu, setExpandedMenu] = React.useState('');
        const [filters, setFilters] = React.useState({ thoiGian: '', maTinh: 'ALL', luongSPDV: 'ALL', nhomSPDV: 'ALL', plo: 'ALL' });
        const [hdQuickFilter, setHdQuickFilter] = React.useState('ALL'); // Lọc nhanh tab Hợp đồng
        const [chkdQuickFilter, setChkdQuickFilter] = React.useState('ALL'); // Lọc nhanh 6 KPI phái sinh CHKD

        React.useEffect(() => { if (user) fetchDashboardData(); }, [user]);

        const handleLogin = async (e) => {
          e.preventDefault();
          setLoading(true);
          try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', email }) }).then(r => r.json());
            if (res.status === 'success') {
              localStorage.setItem('vnpt_user', JSON.stringify(res.user));
              setUser(res.user);
            } else { alert(res.message || 'Sai thông tin đăng nhập!'); }
          } catch (err) {
            alert('Mất kết nối API. Chạy giả lập UI.');
            setUser({ email, level: 'CLO_L1', tenClo: 'MienBac', provinces: ['HNI', 'HPG', 'QNH'] });
          }
          setLoading(false);
        };

        const handleSwitchTab = (tabName) => {
          setActiveTab(tabName);
          const url = new URL(window.location);
          url.searchParams.set("tab", tabName);
          window.history.replaceState({}, "", url); // Cập nhật URL mượt mà
        };
        
        const fetchDashboardData = async () => {
          setLoading(true);
          try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getData', provinces: user.provinces }) }).then(r => r.json());
            if (res.status === 'success') {
              setRawData((res.data || []).map(d => ({ ...d, thang: normalizeThang(d['thang'] || '') })));
              setPipelineRaw((res.pipelineData || []).map(d => ({ ...d, thang: normalizeThang(d['thang'] || '') })));
              setDeanRaw(res.deanData || []);
              setHopDongRaw(res.hopDongData || res.hopdongData || []); // Khớp chính xác key hopDongData từ Backend
              setPloList(res.ploData || []);
            }
          } catch (err) { console.warn("Lỗi đồng bộ dữ liệu API"); }
          setLoading(false);
        };

        const handleLogout = () => {
          setUser(null);
          localStorage.removeItem('vnpt_user');
          setRawData([]);
        };

        if (!user) {
          return (
            <div className="flex h-screen w-full items-center justify-center bg-gray-200">
              <form onSubmit={handleLogin} className="bg-white p-10 border-t-4 border-vnpt shadow-xl w-96 rounded">
                <h2 className="text-2xl font-bold text-navy mb-6 text-center">ĐĂNG NHẬP</h2>
                <input className="w-full mb-6 p-3 border rounded focus:outline-vnpt text-sm" placeholder="Email đăng nhập" value={email} onChange={e => setEmail(e.target.value)} required />
                <button disabled={loading} className="w-full bg-vnpt text-white py-3 font-bold rounded hover:bg-navy transition">
                  {loading ? 'ĐANG KẾT NỐI...' : 'VÀO HỆ THỐNG'}
                </button>
              </form>
            </div>
          );
        }

        const isAllTime = !filters.thoiGian || filters.thoiGian === 'ALL' || filters.thoiGian === '';
        const filterMonthVal = isAllTime ? 999912 : getMonthVal(filters.thoiGian);

        // =====================================================================
        // [PHẦN 2.1 - ENGINE] DASHBOARD TỔNG QUAN DOANH THU
        // =====================================================================
        const kpi = { dtThucHien: 0, dtKeHoach: 0, pipeTongGt: 0, pipeTongSl: 0, pipeMoGt: 0, pipeMoSl: 0, pipeDongGt: 0, pipeDongSl: 0, duBaoDt: 0 };
        const baseData = (rawData || []).filter(d =>
          (filters.maTinh === 'ALL' || d['ma_tinh'] == filters.maTinh) &&
          (filters.luongSPDV === 'ALL' || d['luong_spdv'] == filters.luongSPDV) &&
          (filters.nhomSPDV === 'ALL' || d['nhomspdv_code'] == filters.nhomSPDV) &&
          (filters.plo === 'ALL' || d['plo_code'] == filters.plo)
        );

        baseData.forEach(curr => {
          const mVal = getMonthVal(curr['thang']);
          if (mVal !== null && mVal > 0 && mVal <= filterMonthVal) {
            kpi.dtThucHien += parseNum(curr['dt_th_thang']);
            kpi.dtKeHoach += parseNum(curr['dt_kh_thang']);
          }
        });

        const basePipeline = (pipelineRaw || []).filter(d =>
          (filters.maTinh === 'ALL' || d['ma_tinh'] == filters.maTinh) &&
          (filters.nhomSPDV === 'ALL' || d['nhomspdv_code'] == filters.nhomSPDV) &&
          (filters.plo === 'ALL' || d['plo_code'] == filters.plo)
        );

        basePipeline.forEach(curr => {
          const mVal = getMonthVal(curr['thang']);
          if (isAllTime || mVal === filterMonthVal) {
            const nganSach = parseNum(curr['ngansach_duan']);
            const dtDuBao = parseNum(curr['doanhthu_dubao']);
            const statusStr = (curr['trang_thai'] || '').toString().trim().toUpperCase();
            kpi.pipeTongSl += 1;
            kpi.pipeTongGt += nganSach;
            if (statusStr === 'CLOSED' || statusStr.includes('THẮNG') || statusStr.includes('ĐÓNG') || statusStr.includes('THÀNH CÔNG')) {
              kpi.pipeDongSl += 1; kpi.pipeDongGt += nganSach; kpi.duBaoDt += dtDuBao;
            } else if (statusStr === 'OPEN' || statusStr.includes('MỞ') || statusStr.includes('ĐANG')) {
              kpi.pipeMoSl += 1; kpi.pipeMoGt += nganSach; kpi.duBaoDt += dtDuBao;
            }
          }
        });

        const tyLeHT = kpi.dtKeHoach ? kpi.dtThucHien / kpi.dtKeHoach : 0;
        const winRate = kpi.pipeTongSl ? kpi.pipeDongSl / kpi.pipeTongSl : 0;
        const thieuHut = Math.max(kpi.dtKeHoach - kpi.dtThucHien - kpi.duBaoDt, 0);

        const chartGroup = {};
        monthOptions.forEach(m => chartGroup[m] = { thang: m, thucHien: null, keHoach: 0 });
        baseData.forEach(curr => {
          const t = curr['thang'];
          if (chartGroup[t]) {
            chartGroup[t].keHoach += parseNum(curr['dt_kh_thang']);
            const rawTH = curr['dt_th_thang'];
            if (rawTH !== '' && rawTH != null) {
              const valTH = parseNum(rawTH);
              chartGroup[t].thucHien = (chartGroup[t].thucHien === null) ? valTH : chartGroup[t].thucHien + valTH;
            }
          }
        });
        const finalChartData = monthOptions.map(m => chartGroup[m]);

        const provStats = {};
        const initProv = (p) => {
          if (!provStats[p]) provStats[p] = { maTinh: p, dtThucHien: 0, dtKeHoach: 0, pipeTongGt: 0, pipeTongSl: 0, pipeMoGt: 0, pipeDongGt: 0, pipeDongSl: 0, duBaoDt: 0 };
        };
        baseData.forEach(curr => {
          const p = curr['ma_tinh'] || 'N/A'; initProv(p);
          const mVal = getMonthVal(curr['thang']);
          if (mVal !== null && mVal > 0 && mVal <= filterMonthVal) {
            provStats[p].dtThucHien += parseNum(curr['dt_th_thang']);
            provStats[p].dtKeHoach += parseNum(curr['dt_kh_thang']);
          }
        });
        basePipeline.forEach(curr => {
          const p = curr['ma_tinh'] || 'N/A'; initProv(p);
          const mVal = getMonthVal(curr['thang']);
          if (isAllTime || mVal === filterMonthVal) {
            const nganSach = parseNum(curr['ngansach_duan']);
            const dtDuBao = parseNum(curr['doanhthu_dubao']);
            const statusStr = (curr['trang_thai'] || '').toString().trim().toUpperCase();
            provStats[p].pipeTongSl += 1; provStats[p].pipeTongGt += nganSach;
            if (statusStr === 'CLOSED' || statusStr.includes('ĐÓNG') || statusStr.includes('THÀNH CÔNG')) {
              provStats[p].pipeDongSl += 1; provStats[p].pipeDongGt += nganSach; provStats[p].duBaoDt += dtDuBao;
            } else if (statusStr === 'OPEN' || statusStr.includes('MỞ')) {
              provStats[p].pipeMoGt += nganSach; provStats[p].duBaoDt += dtDuBao;
            }
          }
        });
        const provStatsArray = Object.values(provStats).map(p => ({
          ...p,
          tyLeHT: p.dtKeHoach ? p.dtThucHien / p.dtKeHoach : 0,
          winRate: p.pipeTongSl ? p.pipeDongSl / p.pipeTongSl : 0,
          thieuHut: Math.max(p.dtKeHoach - p.dtThucHien - p.duBaoDt, 0)
        })).sort((a, b) => b.dtThucHien - a.dtThucHien);

        const ploStats = {};
        const initPlo = (p) => {
          const finalKey = (p ? p.toString().trim() : '') || 'Chưa gán PLO';
          if (!ploStats[finalKey]) ploStats[finalKey] = { ploCode: finalKey, dtThucHien: 0, dtKeHoach: 0, pipeTongGt: 0, pipeTongSl: 0, pipeMoGt: 0, pipeDongGt: 0, pipeDongSl: 0, duBaoDt: 0 };
          return finalKey;
        };
        baseData.forEach(curr => {
          const key = initPlo(curr['plo_code']);
          const mVal = getMonthVal(curr['thang']);
          if (mVal !== null && mVal > 0 && mVal <= filterMonthVal) {
            ploStats[key].dtThucHien += parseNum(curr['dt_th_thang']);
            ploStats[key].dtKeHoach += parseNum(curr['dt_kh_thang']);
          }
        });
        basePipeline.forEach(curr => {
          const key = initPlo(curr['plo_code']);
          const mVal = getMonthVal(curr['thang']);
          if (isAllTime || mVal === filterMonthVal) {
            const nganSach = parseNum(curr['ngansach_duan']);
            const dtDuBao = parseNum(curr['doanhthu_dubao']);
            const statusStr = (curr['trang_thai'] || '').toString().trim().toUpperCase();
            ploStats[key].pipeTongSl += 1; ploStats[key].pipeTongGt += nganSach;
            if (statusStr === 'CLOSED' || statusStr.includes('THẮNG') || statusStr.includes('ĐÓNG') || statusStr.includes('THÀNH CÔNG')) {
              ploStats[key].pipeDongSl += 1; ploStats[key].pipeDongGt += nganSach; ploStats[key].duBaoDt += dtDuBao;
            } else if (statusStr === 'OPEN' || statusStr.includes('MỞ') || statusStr.includes('ĐANG')) {
              ploStats[key].pipeMoGt += nganSach; ploStats[key].duBaoDt += dtDuBao;
            }
          }
        });
        const ploStatsArray = Object.values(ploStats).map(p => ({
          ...p,
          tyLeHT: p.dtKeHoach ? p.dtThucHien / p.dtKeHoach : 0,
          thieuHut: Math.max(p.dtKeHoach - p.dtThucHien - p.duBaoDt, 0)
        })).sort((a, b) => b.dtThucHien - a.dtThucHien);

        // =====================================================================
        // [PHẦN 2.2 - ENGINE] ĐỀ ÁN & KẾ HOẠCH (CÁC KHUNG PHÁP LÝ)
        // =====================================================================
        const baseDean = (deanRaw || []).filter(d => filters.maTinh === 'ALL' || d['ma_tinh'] == filters.maTinh);
        const deanKpi = { tongSl: 0, tongNs: 0, daTrienKhaiSl: 0, daTrienKhaiNs: 0, vnptSl: 0, vnptNs: 0, trangSl: 0, trangNs: 0, doiThuSl: 0, doiThuNs: 0, chuyenHoaSl: 0, chuyenHoaNs: 0 };
        const deanByTinhMap = {};

        baseDean.forEach(d => {
          const maTinh = (d['ma_tinh'] || 'CHƯA RÕ').toString().trim().toUpperCase();
          const ns = parseNum(d['ngansach']);
          const trangThai = (d['trangthai_trienkhai'] || '').toString().trim().toUpperCase();
          const donVi = (d['donvi_donghanh'] || '').toString().trim().toUpperCase();
          const maChkd = (d['ma_CHKD'] || d['chkd_id'] || '').toString().trim();

          if (!deanByTinhMap[maTinh]) {
            deanByTinhMap[maTinh] = { maTinh, tongSl: 0, tongNs: 0, daTrienKhaiSl: 0, daTrienKhaiNs: 0, vnptSl: 0, vnptNs: 0, chuyenHoaSl: 0, chuyenHoaNs: 0, trangSl: 0, trangNs: 0 };
          }
          const t = deanByTinhMap[maTinh];

          deanKpi.tongSl += 1; deanKpi.tongNs += ns; t.tongSl += 1; t.tongNs += ns;
          if (maChkd !== '') { deanKpi.chuyenHoaSl += 1; deanKpi.chuyenHoaNs += ns; t.chuyenHoaSl += 1; t.chuyenHoaNs += ns; }
          if (trangThai === 'ĐÃ TRIỂN KHAI') {
            deanKpi.daTrienKhaiSl += 1; deanKpi.daTrienKhaiNs += ns; t.daTrienKhaiSl += 1; t.daTrienKhaiNs += ns;
          } else {
            if (donVi === 'VNPT') { deanKpi.vnptSl += 1; deanKpi.vnptNs += ns; t.vnptSl += 1; t.vnptNs += ns; }
            else if (donVi === 'ĐỐI THỦ') { deanKpi.doiThuSl += 1; deanKpi.doiThuNs += ns; }
            else { deanKpi.trangSl += 1; deanKpi.trangNs += ns; t.trangSl += 1; t.trangNs += ns; }
          }
        });
        const deanByTinhList = Object.values(deanByTinhMap).sort((a, b) => b.tongNs - a.tongNs);

        // =====================================================================
        // [PHẦN 2.3 - ENGINE] CƠ HỘI KINH DOANH (PIPELINE)
        // =====================================================================
        const kpiCHKD = {
          tongSl: 0, tongGt: 0, moSl: 0, moGt: 0, chotSl: 0, chotGt: 0, thuaSl: 0, thuaGt: 0,
          thieuTiemNang: 0, quaHanKy: 0, lauKhongCapNhat: 0, thieuGiaTri: 0, thieuHinhThuc: 0, thieuPLO: 0
        };
        const now = new Date();
        const ninetyDaysAgo = new Date(now.getTime() - (90 * 24 * 60 * 60 * 1000));
        const openPipelineList = []; // Lưu danh sách Deal mở kèm cờ phái sinh để lọc nhanh
        
        basePipeline.forEach(d => {
          const gtTrieu = parseNum(d['ngansach_duan']);
          const status = (d['trang_thai'] || 'OPEN').toString().trim().toUpperCase();
          kpiCHKD.tongSl += 1; kpiCHKD.tongGt += gtTrieu;
        
          if (status === 'WON' || status === 'CLOSED' || status.includes('THẮNG')) {
            kpiCHKD.chotSl += 1; kpiCHKD.chotGt += gtTrieu;
          } else if (status === 'LOST' || status.includes('THUA') || status.includes('THẤT BẠI')) {
            kpiCHKD.thuaSl += 1; kpiCHKD.thuaGt += gtTrieu;
          } else {
            kpiCHKD.moSl += 1; kpiCHKD.moGt += gtTrieu;
        
            // Tính cờ phái sinh dùng chung cho cả KPI và Bảng lọc
            const ngayKy = parseDateVN(d['ngay_dukienchot']);
            const ngayCapNhat = parseDateVN(d['ngay_cap_nhat_cuoi']);
            const flags = {
              NO_POTENTIAL: !d['mucdo_tiemnang'] || d['mucdo_tiemnang'].toString().trim() === '',
              NO_VALUE: gtTrieu <= 0,
              NO_TYPE: !d['hinhthuc_cungcap'] || d['hinhthuc_cungcap'].toString().trim() === '',
              NO_PLO: !d['plo_code'] || d['plo_code'].toString().trim() === '',
              OVERDUE_SIGN: Boolean(ngayKy && ngayKy < now),
              STALE_90: Boolean(ngayCapNhat && ngayCapNhat < ninetyDaysAgo)
            };
        
            if (flags.NO_POTENTIAL) kpiCHKD.thieuTiemNang += 1;
            if (flags.NO_VALUE) kpiCHKD.thieuGiaTri += 1;
            if (flags.NO_TYPE) kpiCHKD.thieuHinhThuc += 1;
            if (flags.NO_PLO) kpiCHKD.thieuPLO += 1;
            if (flags.OVERDUE_SIGN) kpiCHKD.quaHanKy += 1;
            if (flags.STALE_90) kpiCHKD.lauKhongCapNhat += 1;
        
            openPipelineList.push({ ...d, _flags: flags, _gt: gtTrieu });
          }
        });
        
        // Nhãn tiêu đề & danh sách bảng sau khi bấm thẻ KPI phái sinh
        const CHKD_FILTER_LABELS = {
          ALL: 'Tất cả Deal đang mở',
          NO_POTENTIAL: 'Chưa đánh giá tiềm năng',
          NO_VALUE: 'Thiếu giá trị ngân sách',
          NO_TYPE: 'Thiếu hình thức cung cấp',
          NO_PLO: 'Chưa gán PLO',
          OVERDUE_SIGN: 'Quá ngày dự kiến ký HĐ',
          STALE_90: '> 90 ngày chưa cập nhật'
        };
        
        const filteredChkdTable = openPipelineList
          .filter(d => chkdQuickFilter === 'ALL' || d._flags[chkdQuickFilter])
          .sort((a, b) => b._gt - a._gt);

        const tyLeMoGt = kpiCHKD.tongGt ? (kpiCHKD.moGt / kpiCHKD.tongGt) : 0;
        const closedTotalSl = kpiCHKD.chotSl + kpiCHKD.thuaSl;
        const closedTotalGt = kpiCHKD.chotGt + kpiCHKD.thuaGt;
        const winRateSl = closedTotalSl ? (kpiCHKD.chotSl / closedTotalSl) : 0;
        const winRateGt = closedTotalGt ? (kpiCHKD.chotGt / closedTotalGt) : 0;

        const funnelDataMap = {};
        basePipeline.forEach(d => {
          const status = (d['trang_thai'] || '').toString().trim().toUpperCase();
          if (status === 'LOST' || status.includes('THUA')) return;
          const stage = (d['trangthai_pipeline'] || 'Chưa xác định').toString().trim();
          const valTy = parseNum(d['ngansach_duan']);
          if (!funnelDataMap[stage]) funnelDataMap[stage] = { name: stage, value: 0, count: 0 };
          funnelDataMap[stage].value += valTy; funnelDataMap[stage].count += 1;
        });
        const funnelData = Object.values(funnelDataMap).sort((a, b) => {
          const numA = a.name.match(/^(\d+)\./) ? parseInt(a.name.match(/^(\d+)\./)[1], 10) : 99;
          const numB = b.name.match(/^(\d+)\./) ? parseInt(b.name.match(/^(\d+)\./)[1], 10) : 99;
          return numA - numB;
        });
        const FUNNEL_COLORS = ['#003B7A', '#004c9e', '#0062c3', '#007ad9', '#0094D9', '#33aae0', '#66bfe8'];

        const provPipelineMap = {};
        basePipeline.forEach(d => {
          const maTinh = (d['ma_tinh'] || 'Khác').toString().trim();
          const gtTy = parseNum(d['ngansach_duan']);
          const status = (d['trang_thai'] || '').toString().trim().toUpperCase();
          if (!provPipelineMap[maTinh]) provPipelineMap[maTinh] = { maTinh, dangMoGt: 0, daChotGt: 0, thatBaiGt: 0, tongGt: 0, tongSl: 0 };
          provPipelineMap[maTinh].tongGt += gtTy; provPipelineMap[maTinh].tongSl += 1;
          if (status === 'WON' || status === 'CLOSED' || status.includes('THẮNG') || status.includes('CHỐT')) provPipelineMap[maTinh].daChotGt += gtTy;
          else if (status === 'LOST' || status.includes('THUA') || status.includes('THẤT BẠI')) provPipelineMap[maTinh].thatBaiGt += gtTy;
          else provPipelineMap[maTinh].dangMoGt += gtTy;
        });
        const provPipelineChartData = Object.values(provPipelineMap).sort((a, b) => b.tongGt - a.tongGt);

        const CustomBarTooltip = ({ active, payload, label }) => {
          if (active && payload && payload.length) {
            const data = payload[0].payload;
            return (
              <div className="bg-[#1F2937] text-white p-3 rounded shadow-lg text-sm border border-gray-700 min-w-[160px]">
                <p className="font-bold border-b border-gray-600 pb-1 mb-2 uppercase">{label}</p>
                <div className="flex items-center gap-1.5 mb-1"><div className="w-2.5 h-2.5 bg-[#2563EB]"></div><span>Đang mở: {fmtNum(data.dangMoGt)} trĐ</span></div>
                <div className="flex items-center gap-1.5 mb-1"><div className="w-2.5 h-2.5 bg-[#10B981]"></div><span>Đã chốt: {fmtNum(data.daChotGt)} trĐ</span></div>
                <div className="flex items-center gap-1.5 mb-1"><div className="w-2.5 h-2.5 bg-[#EF4444]"></div><span>Thất bại: {fmtNum(data.thatBaiGt)} trĐ</span></div>
                <p className="font-bold border-t border-gray-600 pt-1.5 text-xs">Tổng: {fmtNum(data.tongGt)} trĐ - {data.tongSl} CHKD</p>
              </div>
            );
          }
          return null;
        };

        // =====================================================================
        // [PHẦN 2.4 - ENGINE] QUẢN LÝ HỢP ĐỒNG (07_QUAN_LY_HOPDONG)
        // =====================================================================
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const next90Days = new Date(today.getTime() + (90 * 24 * 60 * 60 * 1000));

        // 1. Lọc dòng rác & Chuẩn hóa trường + Phái sinh
        const normalizedHopDong = (hopDongRaw || [])
          .filter(d => getField(d, ['ma_hopdong', 'ma_hd', 'Mã Hợp Đồng', 'so_hopdong', 'so_hd', 'Số hợp đồng']) !== '')
          .map(d => {
            const maHD = getField(d, ['ma_hopdong', 'ma_hd', 'Mã Hợp Đồng']).toString().trim();
            const maDeal = getField(d, ['ma_chkd', 'ma_deal', 'Mã Deal']).toString().trim();
            const maTinh = getField(d, ['ma_tinh', 'Mã tỉnh', 'Địa bàn'], maHD.includes('-') ? maHD.split('-')[1] : 'N/A').toString().trim().toUpperCase();
            const tenHD = getField(d, ['ten_hopdong', 'ten_hd', 'Tên Hợp đồng']);
            const tenSPDV = getField(d, ['ten_spdv', 'Tên SPDV']);
            const hinhThuc = getField(d, ['hinhthuc_cungcap', 'loai_hd', 'Hình thức cung cấp'], 'Chưa phân loại').toString().trim();
            const trangThai = getField(d, ['trangthai_thicong', 'trang_thai', 'Trạng Thái Thi Công'], 'Chưa cập nhật').toString().trim();
            const diemRoi = normalizeThang(getField(d, ['diem_roi_doanhthu', 'thang', 'ĐIỂM RƠI DOANH THU (MM/YYYY)']));
            const ploCode = getField(d, ['plo_code', 'PLO']);
            const nhomCode = getField(d, ['nhomspdv_code', 'Nhóm SPDV']);
            const luongSPDV = getField(d, ['luong_spdv', 'Luồng SPDV']);

            // Giá trị HĐ & Phái sinh VNPT hưởng (ĐVT: trĐ)
            const giaTriHD = parseNum(getField(d, ['giatri_hd', 'gia_tri_hd', 'Giá trị hợp đồng (trVND)'], 0));
            const giaTriLienDanh = parseNum(getField(d, ['giatri_liendanh', 'Giá trị Liên danh hưởng'], 0));
            const giaTriVNPT = Math.max(giaTriHD - giaTriLienDanh, 0);

            // Chi phí COGS & Thực chi (quy đổi VND -> trĐ)
            const duToanCogs = vndToTr(getField(d, ['dutoan_cogs', 'Dự Toán COGS Ban Đầu (VND)'], 0));
            const thucChiNoiBo = vndToTr(getField(d, ['thucchi_noibo', 'Thực Chi Nội Bộ (VND)'], 0));
            const thucChiThauPhu = vndToTr(getField(d, ['thucchi_thauphu', 'Thực Chi Thầu Phụ (VND)'], 0));
            const rawTongChi = vndToTr(getField(d, ['tong_thucchi', 'Tổng Thực Chi (VND)'], 0));
            const tongThucChi = rawTongChi > 0 ? rawTongChi : (thucChiNoiBo + thucChiThauPhu);

            // Phái sinh tài chính
            const chenhLechCogs = tongThucChi - duToanCogs;
            const vuotNganSach = chenhLechCogs > 0 ? chenhLechCogs : 0;
            const loiNhuanGop = giaTriVNPT - tongThucChi;

            // Phái sinh tiến độ & Hạn HĐ
            const ngayHetHan = parseDateVN(getField(d, ['ngay_hethan', 'Ngày hết hạn']));
            const deadline = parseDateVN(getField(d, ['ngay_bangiao_dukien', 'deadline', 'Ngày Bàn Giao Dự Kiến (Deadline)']));
            const banGiaoThucTe = parseDateVN(getField(d, ['ngay_bangiao_thucte', 'Ngày Bàn Giao Thực Tế']));

            const rawCham = getField(d, ['cham_tiendo', 'so_ngay_cham', 'Chậm Tiến Độ (Ngày)'], '');
            let chamTienDo = rawCham !== '' ? parseNum(rawCham) : 0;
            if (rawCham === '' && deadline) {
              const diffDays = Math.ceil(((banGiaoThucTe || today) - deadline) / (1000 * 60 * 60 * 24));
              chamTienDo = diffDays > 0 ? diffDays : 0;
            }

            const stUpper = trangThai.toUpperCase();
            const isHieuLuc = !stUpper.includes('THANH LÝ') && !stUpper.includes('HẾT HIỆU LỰC') && !stUpper.includes('HỦY');
            const isTreHan = chamTienDo > 0;
            const isVuotNS = vuotNganSach > 0;
            const isQuaHanHD = isHieuLuc && ngayHetHan && ngayHetHan < today;
            const isSapHetHan90 = isHieuLuc && ngayHetHan && ngayHetHan >= today && ngayHetHan <= next90Days;

            let canhBao = getField(d, ['canhbao_chidao', 'canh_bao', 'Cảnh Báo & Chỉ Đạo Lãnh Đạo'], '').toString().trim();
            if (!canhBao) {
              const alerts = [];
              if (isTreHan) alerts.push(`TRỄ HẠN ${chamTienDo} NGÀY`);
              if (isVuotNS) alerts.push(`VƯỢT NS ${fmtNum(vuotNganSach)} trĐ`);
              if (isQuaHanHD) alerts.push('QUÁ HẠN HĐ');
              else if (isSapHetHan90) alerts.push('SẮP HẾT HẠN ≤90N');
              canhBao = alerts.length ? alerts.join(' | ') : 'Bình thường';
            }

            return {
              maHD, maDeal, maTinh, tenHD, tenSPDV, hinhThuc, trangThai, diemRoi, ploCode, nhomCode, luongSPDV,
              giaTriHD, giaTriLienDanh, giaTriVNPT, duToanCogs, tongThucChi, vuotNganSach, loiNhuanGop,
              ngayHetHan, chamTienDo, isHieuLuc, isTreHan, isVuotNS, isQuaHanHD, isSapHetHan90, canhBao
            };
          });

        // 2. Áp dụng Bộ lọc chung
        const baseHopDong = normalizedHopDong.filter(d =>
          (isAllTime || d.diemRoi === filters.thoiGian) &&
          (filters.maTinh === 'ALL' || d.maTinh === filters.maTinh) &&
          (filters.luongSPDV === 'ALL' || !d.luongSPDV || d.luongSPDV === filters.luongSPDV) &&
          (filters.nhomSPDV === 'ALL' || !d.nhomCode || d.nhomCode === filters.nhomSPDV) &&
          (filters.plo === 'ALL' || !d.ploCode || d.ploCode === filters.plo)
        );

        // 3. Tổng hợp KPI & Phái sinh Hợp đồng
        const kpiHD = {
          tongSl: 0, tongGt: 0, lienDanhGt: 0, vnptGt: 0, trungVi: 0,
          hieuLucSl: 0, hieuLucGt: 0, thueDvSl: 0, thueDvGt: 0, dauTuSl: 0, dauTuGt: 0,
          tongCogs: 0, tongThucChi: 0, tongVuotNS: 0, tongLnGop: 0,
          treHanSl: 0, tongNgayCham: 0, vuotNsSl: 0, quaHanHdSl: 0, sapHetHan90Sl: 0, thieuGtSl: 0
        };
        const hdValues = [];

        baseHopDong.forEach(d => {
          kpiHD.tongSl += 1;
          kpiHD.tongGt += d.giaTriHD;
          kpiHD.lienDanhGt += d.giaTriLienDanh;
          kpiHD.vnptGt += d.giaTriVNPT;
          kpiHD.tongCogs += d.duToanCogs;
          kpiHD.tongThucChi += d.tongThucChi;
          kpiHD.tongVuotNS += d.vuotNganSach;
          kpiHD.tongLnGop += d.loiNhuanGop;
          hdValues.push(d.giaTriVNPT);

          if (d.giaTriHD <= 0) kpiHD.thieuGtSl += 1;
          if (d.isHieuLuc) { kpiHD.hieuLucSl += 1; kpiHD.hieuLucGt += d.giaTriVNPT; }
          if (d.hinhThuc.toUpperCase().includes('THUÊ')) { kpiHD.thueDvSl += 1; kpiHD.thueDvGt += d.giaTriVNPT; }
          else if (d.hinhThuc.toUpperCase().includes('ĐẦU TƯ') || d.hinhThuc.toUpperCase().includes('MUA SẮM')) { kpiHD.dauTuSl += 1; kpiHD.dauTuGt += d.giaTriVNPT; }

          if (d.isTreHan) { kpiHD.treHanSl += 1; kpiHD.tongNgayCham += d.chamTienDo; }
          if (d.isVuotNS) kpiHD.vuotNsSl += 1;
          if (d.isQuaHanHD) kpiHD.quaHanHdSl += 1;
          if (d.isSapHetHan90) kpiHD.sapHetHan90Sl += 1;
        });

        if (hdValues.length > 0) {
          hdValues.sort((a, b) => b - a);
          const mid = Math.floor(hdValues.length / 2);
          kpiHD.trungVi = hdValues.length % 2 !== 0 ? hdValues[mid] : (hdValues[mid - 1] + hdValues[mid]) / 2;
        }
        const hdTyLeTreHan = kpiHD.tongSl ? kpiHD.treHanSl / kpiHD.tongSl : 0;
        const hdAvgDelay = kpiHD.treHanSl ? (kpiHD.tongNgayCham / kpiHD.treHanSl).toFixed(1) : 0;
        const hdTySuatLN = kpiHD.vnptGt ? kpiHD.tongLnGop / kpiHD.vnptGt : 0;

        // 4. Dữ liệu Biểu đồ & Bảng chi tiết Hợp đồng
        const hdDiemRoiMap = {};
        const hdStatusMap = {};
        baseHopDong.forEach(d => {
          const mKey = d.diemRoi || 'Chưa XĐ';
          if (!hdDiemRoiMap[mKey]) hdDiemRoiMap[mKey] = { thang: mKey, vnptGt: 0, lienDanhGt: 0, count: 0 };
          hdDiemRoiMap[mKey].vnptGt += d.giaTriVNPT; hdDiemRoiMap[mKey].lienDanhGt += d.giaTriLienDanh; hdDiemRoiMap[mKey].count += 1;

          const stKey = d.trangThai || 'Chưa cập nhật';
          if (!hdStatusMap[stKey]) hdStatusMap[stKey] = { name: stKey, value: 0, count: 0 };
          hdStatusMap[stKey].value += d.giaTriVNPT; hdStatusMap[stKey].count += 1;
        });
        const hdDiemRoiChart = Object.values(hdDiemRoiMap).sort((a, b) => (getMonthVal(a.thang) || 999999) - (getMonthVal(b.thang) || 999999));
        const hdStatusChart = Object.values(hdStatusMap).sort((a, b) => b.value - a.value);

        const filteredHopDongTable = baseHopDong.filter(d => {
          if (hdQuickFilter === 'LATE') return d.isTreHan;
          if (hdQuickFilter === 'OVER_BUDGET') return d.isVuotNS;
          if (hdQuickFilter === 'EXPIRING') return d.isQuaHanHD || d.isSapHetHan90;
          return true;
        }).sort((a, b) => (b.isTreHan - a.isTreHan) || (b.vuotNganSach - a.vuotNganSach) || (b.giaTriVNPT - a.giaTriVNPT));

        // Biến dùng chung cho Header & Filter
        const activeMenuItem = MENU_ITEMS.find(m => m.id === activeTab);
        const headerTitle = activeMenuItem ? activeMenuItem.label : 'DASHBOARD';
        const dsDiaBanHienThi = (user.provinces && user.provinces.includes('ALL'))
          ? [...new Set([...rawData, ...hopDongRaw].map(d => d['ma_tinh']).filter(Boolean))].sort()
          : (user.provinces || []);

        // =====================================================================
        // [PHẦN 3 - UI] HIỂN THỊ GIAO DIỆN (LAYOUT CHUNG + TỪNG MODULE)
        // =====================================================================
        return (
          <div className="flex h-screen w-full">
            {/* [3.0] SIDEBAR ĐIỀU HƯỚNG */}
            <aside className="w-[200px] bg-navy text-white flex flex-col shadow-2xl z-20 shrink-0">
              <div className="p-4 border-b border-white/20 flex flex-col items-center">
                <div className="text-2xl font-extrabold tracking-widest text-vnpt bg-white px-3 py-1 rounded shadow mb-2">VNPT</div>
                <div className="text-[10px] text-center font-semibold text-gray-300 tracking-wider">HỆ THỐNG ĐIỀU HÀNH</div>
              </div>
              <nav className="flex-1 py-3 px-3 space-y-1 overflow-y-auto">
                {MENU_ITEMS.map(item => (
                  <div key={item.id}>
                    <a href={item.href || '#'} onClick={(e) => {
                      if (item.subItems) { e.preventDefault(); setExpandedMenu(expandedMenu === item.id ? '' : item.id); }
                      else { setActiveTab(item.id); }
                    }} className={`w-full flex items-center justify-between px-3 py-3 rounded text-left transition font-semibold ${activeTab === item.id ? 'bg-vnpt text-white shadow' : 'text-gray-300 hover:bg-hoverbg hover:text-white'}`}>
                      <span className="text-sm font-bold tracking-wide">{item.label}</span>
                      {item.subItems && <span className="text-xs">{expandedMenu === item.id ? '▼' : '▶'}</span>}
                    </a>
                    {item.subItems && expandedMenu === item.id && (
                      <div className="ml-4 mt-1 space-y-1 border-l border-white/20 pl-2">
                        {item.subItems.map(sub => (<a key={sub.id} href={sub.href} className="block w-full text-left px-2 py-2 text-sm rounded transition text-gray-400 hover:text-white hover:bg-white/10">{sub.label}</a>))}
                      </div>
                    )}
                  </div>
                ))}
              </nav>
            </aside>

            {/* KHUNG NỘI DUNG CHÍNH */}
            <main className="flex-1 flex flex-col overflow-hidden bg-gray-50">
              <header className="bg-white px-6 py-4 flex justify-between items-center shrink-0 border-b">
                <h1 className="text-2xl font-bold uppercase tracking-wide text-navy">{headerTitle}</h1>
                <div className="flex items-center gap-4 text-sm">
                  <span className="font-semibold text-gray-600">{user.email}</span>
                  <span className="bg-vnpt/10 text-vnpt border border-vnpt px-3 py-1.5 rounded-full font-bold">Quyền: {user.tenClo}</span>
                  <button onClick={handleLogout} className="bg-risk text-white px-3 py-1.5 rounded font-bold hover:bg-red-700 transition">Đăng xuất</button>
                </div>
              </header>

              {/* THANH BỘ LỌC CHUNG */}
              {['dashboard', 'dean', 'cohoi', 'hopdong'].includes(activeTab) && (
                <div className="bg-white px-6 py-3 flex gap-4 shrink-0 border-b shadow-sm items-end z-10">
                  <div className="flex flex-col flex-1"><label className="text-xs font-bold text-navy mb-1">Thời gian</label><select className="border border-gray-300 p-2 rounded text-sm w-full focus:outline-vnpt" value={filters.thoiGian} onChange={e => setFilters({...filters, thoiGian: e.target.value})}><option value="">-- Tất cả --</option>{monthOptions.map(t => <option key={t} value={t}>{t}</option>)}</select></div>
                  <div className="flex flex-col flex-1"><label className="text-xs font-bold text-navy mb-1">CLO Địa bàn</label><select className="border border-gray-300 p-2 rounded text-sm w-full focus:outline-vnpt" value={filters.maTinh} onChange={e => setFilters({...filters, maTinh: e.target.value})}><option value="ALL">Toàn bộ địa bàn</option>{dsDiaBanHienThi.map(p => <option key={p} value={p}>{p}</option>)}</select></div>
                  <div className="flex flex-col flex-1"><label className="text-xs font-bold text-navy mb-1">Luồng SPDV</label><select className="border border-gray-300 p-2 rounded text-sm w-full focus:outline-vnpt" value={filters.luongSPDV} onChange={e => setFilters({...filters, luongSPDV: e.target.value})}><option value="ALL">Tất cả</option>{[...new Set(rawData.map(d => d['luong_spdv']).filter(Boolean))].map(n => <option key={n} value={n}>{n}</option>)}</select></div>
                  <div className="flex flex-col flex-1"><label className="text-xs font-bold text-navy mb-1">Nhóm SPDV</label><select className="border border-gray-300 p-2 rounded text-sm w-full focus:outline-vnpt" value={filters.nhomSPDV} onChange={e => setFilters({...filters, nhomSPDV: e.target.value, plo: 'ALL'})}><option value="ALL">Tất cả</option>{[...new Set(ploList.map(p => p['nhomspdv_code']).filter(Boolean))].map(n => <option key={n} value={n}>{n}</option>)}</select></div>
                  <div className="flex flex-col flex-1"><label className="text-xs font-bold text-navy mb-1">PLO (Product Line Owner)</label><select className="border border-gray-300 p-2 rounded text-sm w-full focus:outline-vnpt" value={filters.plo} onChange={e => setFilters({...filters, plo: e.target.value})}><option value="ALL">Tất cả</option>{[...new Set(ploList.filter(p => filters.nhomSPDV === 'ALL' || p['nhomspdv_code'] === filters.nhomSPDV).map(p => p['plo_code']).filter(Boolean))].map(n => <option key={n} value={n}>{n}</option>)}</select></div>
                </div>
              )}
              {loading && <div className="text-center text-vnpt text-sm py-1 font-bold animate-pulse bg-white">Đang đồng bộ dữ liệu...</div>}

              <div className="flex-1 overflow-auto flex flex-col">
                {/* =========================================================== */}
                {/* [PHẦN 3.1 - UI] TAB DASHBOARD                               */}
                {/* =========================================================== */}
                {activeTab === 'dashboard' && (
                  <>
                    <div className="flex gap-4 px-6 py-6 shrink-0">
                      <KpiCard title="1.DOANH THU LŨY KẾ" v1={fmtNum(kpi.dtThucHien)} l1="Thực hiện YTD (trĐ)" v2={fmtNum(kpi.dtKeHoach)} l2="Kế hoạch YTD (trĐ)" st="neutral" />
                      <KpiCard title="2.HIỆU SUẤT NĂM" v1={fmtPct(tyLeHT)} l1="Tỷ lệ HT Kế hoạch YTD" v2="-" l2="Tăng/Giảm (MoM)" st={tyLeHT >= 1 ? 'good' : 'risk'} />

                    </div>

                    {/* HÀNG 4: BẢNG CHI TIẾT HỢP ĐỒNG & CẢNH BÁO CHỈ ĐẠO */}
                    <div className="px-6 pb-6 flex flex-col shrink-0 min-h-[380px]">
                      <div className="bg-white border border-gray-200 rounded shadow-sm flex-1 flex flex-col overflow-hidden">
                        <div className="px-5 py-3.5 border-b bg-gray-50 flex justify-between items-center shrink-0">
                          <h2 className="text-navy font-bold text-sm uppercase">
                            DANH SÁCH HỢP ĐỒNG & CẢNH BÁO ĐIỀU HÀNH ({filteredHopDongTable.length} HĐ)
                          </h2>
                          {hdQuickFilter !== 'ALL' && (
                            <button onClick={() => setHdQuickFilter('ALL')} className="text-xs font-bold text-vnpt hover:underline">✕ Bỏ lọc nhanh</button>
                          )}
                        </div>
                        <div className="overflow-auto flex-1">
                          <table className="w-full text-left text-xs border-collapse">
                            <thead className="bg-navy text-white sticky top-0 z-10">
                              <tr>
                                <th className="p-2.5">Mã HĐ / Tỉnh</th>
                                <th className="p-2.5">Tên Hợp đồng & SPDV</th>
                                <th className="p-2.5">Hình thức / Trạng thái</th>
                                <th className="p-2.5 text-right">GT HĐ (trĐ)</th>
                                <th className="p-2.5 text-right">VNPT hưởng</th>
                                <th className="p-2.5 text-right">Thực chi / COGS</th>
                                <th className="p-2.5 text-center">Điểm rơi DT</th>
                                <th className="p-2.5 text-center">Tiến độ</th>
                                <th className="p-2.5">Cảnh báo & Chỉ đạo Lãnh đạo</th>
                              </tr>
                            </thead>
                            <tbody>
                              {filteredHopDongTable.map((hd, i) => (
                                <tr key={i} className="border-b hover:bg-blue-50/50 transition">
                                  <td className="p-2.5 whitespace-nowrap">
                                    <div className="font-bold text-navy">{hd.maHD || '-'}</div>
                                    <div className="text-[11px] text-gray-500">{hd.maTinh} • {hd.maDeal || 'Chưa gắn Deal'}</div>
                                  </td>
                                  <td className="p-2.5 max-w-[260px]">
                                    <div className="font-semibold text-gray-800 line-clamp-2" title={hd.tenHD}>{hd.tenHD || '-'}</div>
                                    <div className="text-[11px] text-vnpt font-medium">{hd.tenSPDV || '-'}</div>
                                  </td>
                                  <td className="p-2.5 whitespace-nowrap">
                                    <div className="font-medium text-gray-700">{hd.hinhThuc}</div>
                                    <span className="inline-block mt-0.5 px-2 py-0.5 bg-gray-100 rounded text-[10px] font-semibold text-gray-600">{hd.trangThai}</span>
                                  </td>
                                  <td className="p-2.5 text-right font-medium text-gray-700 whitespace-nowrap">{fmtNum(hd.giaTriHD)}</td>
                                  <td className="p-2.5 text-right font-bold text-vnpt whitespace-nowrap">
                                    {fmtNum(hd.giaTriVNPT)}
                                    {hd.giaTriLienDanh > 0 && <div className="text-[10px] text-gray-400 font-normal">LD: {fmtNum(hd.giaTriLienDanh)}</div>}
                                  </td>
                                  <td className="p-2.5 text-right whitespace-nowrap">
                                    <div className={`font-bold ${hd.isVuotNS ? 'text-risk' : 'text-gray-700'}`}>{fmtNum(hd.tongThucChi)}</div>
                                    <div className="text-[10px] text-gray-400">COGS: {fmtNum(hd.duToanCogs)}</div>
                                  </td>
                                  <td className="p-2.5 text-center font-bold text-navy whitespace-nowrap">{hd.diemRoi || '-'}</td>
                                  <td className="p-2.5 text-center whitespace-nowrap">
                                    {hd.isTreHan ? (
                                      <span className="px-2 py-1 rounded-full bg-red-100 text-risk font-bold text-[10px]">Trễ {hd.chamTienDo} ngày</span>
                                    ) : (
                                      <span className="px-2 py-1 rounded-full bg-green-100 text-good font-bold text-[10px]">Đúng hạn</span>
                                    )}
                                  </td>
                                  <td className="p-2.5 max-w-[220px]">
                                    <span className={`font-semibold ${(hd.isTreHan || hd.isVuotNS || hd.isQuaHanHD) ? 'text-risk' : 'text-gray-600'}`}>{hd.canhBao}</span>
                                  </td>
                                </tr>
                              ))}
                              {filteredHopDongTable.length === 0 && (
                                <tr><td colSpan="9" className="p-6 text-center text-gray-400">Không có dữ liệu hợp đồng khớp bộ lọc.</td></tr>
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* =========================================================== */}
                {/* [PHẦN 3.5 - UI] CÁC TAB ĐANG PHÁT TRIỂN                     */}
                {/* =========================================================== */}
                {(activeTab === 'poc' || activeTab === 'dauthau' || activeTab === 'khachhang') && (
                  <div className="flex-1 flex flex-col items-center justify-center text-gray-400 bg-gray-50 h-full">
                    <div className="text-6xl mb-4 text-vnpt">⏳</div>
                    <h2 className="text-2xl font-bold text-navy mb-2">Đang cập nhật, chờ nhé!</h2>
                    <p>Module này đang xây dựng.</p>
                  </div>
                )}

                {!['dashboard', 'dean', 'cohoi', 'poc', 'dauthau', 'hopdong', 'khachhang'].includes(activeTab) && (
                  <div className="flex-1 flex flex-col items-center justify-center text-gray-400 bg-gray-50 h-full">
                    <div className="text-6xl mb-4">🚧</div>
                    <h2 className="text-2xl font-bold text-navy mb-2">Tính năng đang phát triển</h2>
                    <p>Module hiện tại chưa được thực hiện.</p>
                  </div>
                )}
              </div>
            </main>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    } catch (err) {
      document.getElementById('root').innerHTML = `<div style="padding: 40px; text-align: center;"><h2 style="color: #ef4444; font-size: 24px; font-weight: bold;">LỖI BIÊN DỊCH REACT</h2><p style="color: #333; margin-top: 10px;">${err.message}</p></div>`;
    }
  </script>
</body>
</html>
