<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Executive Dashboard - VNPT</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>

  <script>
    tailwind.config = { 
      theme: { 
        extend: { 
          fontFamily: { sans: ['Nunito', 'sans-serif'] },
          colors: { vnpt: '#0094D9', navy: '#003B7A', good: '#22c55e', risk: '#ef4444', hoverbg: '#004c9e' } 
        } 
      } 
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex font-sans overflow-hidden">
  
  <div id="root" class="w-full h-screen flex">
    <div class="m-auto text-center text-risk font-bold text-xl">Đang khởi tạo hệ thống...</div>
  </div>

  <!-- SCRIPT BẮT LỖI TOÀN CỤC CHỐNG KẸT MÀN HÌNH -->
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      // 1. Bỏ qua lỗi lành tính của Recharts (ResizeObserver)
      if (message.includes('ResizeObserver loop limit exceeded') || 
          message.includes('ResizeObserver loop completed with undelivered notifications')) {
        return true; 
      }
      
      // 2. Các lỗi nghiêm trọng khác -> Hiển thị cảnh báo
      document.getElementById('root').innerHTML = '<div style="padding: 40px; text-align: center;"><h2 style="color: #ef4444; font-size: 24px; font-weight: bold;">HỆ THỐNG GẶP SỰ CỐ</h2><p style="color: #333; margin-top: 10px;">Chi tiết lỗi: ' + message + '</p></div>';
      return false;
    };
  </script>

  <script type="text/babel">
    // --- HÀM TIỆN ÍCH DÙNG CHUNG ---
    const parseNum = (val) => {
      if (val === null || val === undefined || val === '') return 0;
      if (typeof val === 'number') return val;
      return parseFloat(val.toString().replace(/,/g, '')) || 0;
    };

    const normalizeThang = (val) => {
      if (!val) return '';
      const str = val.toString().trim();
      if (str.match(/^\d{4}-\d{2}-\d{2}/)) {
        const parts = str.split('T')[0].split('-');
        return `${parseInt(parts[1], 10)}/${parts[0]}`;
      }
      if (str.includes('/')) {
          const parts = str.split('/');
          return `${parseInt(parts[0], 10)}/${parts[1]}`;
      }
      return str; 
    };

    const fmtNum = (num) => new Intl.NumberFormat('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num || 0);
    const fmtPct = (num) => `${(num * 100).toFixed(1)}%`;

    // --- COMPONENT THẺ KPI ĐỘC LẬP ---
    function KpiCard({ title, v1, l1, v2, l2, st }) {
      return (
        <div className="bg-white border rounded flex-1 p-4 shadow-sm flex flex-col justify-between hover:border-vnpt transition min-w-[160px]">
          <h3 className="text-navy font-bold text-xs mb-3 uppercase truncate">{title}</h3>
          <div>
            <div className={`text-3xl font-bold mb-1 ${st === 'good' ? 'text-good' : st === 'risk' ? 'text-risk' : 'text-vnpt'}`}>{v1}</div>
            <div className="text-xs text-gray-500 mb-3 truncate">{l1}</div>
            <div className="text-base font-bold text-gray-700 border-t pt-2">{v2}</div>
            <div className="text-xs text-gray-500 truncate">{l2}</div>
          </div>
        </div>
      );
    }

    try {
      // Khai báo an toàn thư viện Recharts
      const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = window.Recharts || {};
      
      // ĐIỀN URL WEB APP GAS TẠI ĐÂY
      const API_URL = 'https://script.google.com/macros/s/AKfycby6E6r6KhZ54J6by2s1PF8MqtOSJu74GcyqO4GsFnSwWd-GmDScZFrS5Brq0IwXlO1N/exec'; 

      const currentYear = new Date().getFullYear();
      const monthOptions = Array.from({length: 12}, (_, i) => `${i + 1}/${currentYear}`);
      
      const MENU_ITEMS = [
        { id: 'dashboard', label: 'DASHBOARD', href: '#' },
        { id: 'dean', label: 'ĐỀ ÁN, KẾ HOẠCH', href: '#' },
        { id: 'cohoi', label: 'CƠ HỘI KINH DOANH', href: '#' },
        { id: 'hopdong', label: 'HỢP ĐỒNG', href: '#' },
        { id: 'khachhang', label: 'KHÁCH HÀNG', href: '#' },
        { 
          id: 'danhmuc', label: 'DANH MỤC',
          subItems: [
            { id: 'dm_spdv', label: 'Danh mục SPDV', href: 'dmspdv.html' },
            { id: 'dm_plo', label: 'Danh mục PLO', href: '#' }
          ]
        }
      ];

      function App() {
        // --- HOOKS ---
        const [user, setUser] = React.useState(() => {
          try { return JSON.parse(localStorage.getItem('vnpt_user')); } catch { return null; }
        });
        
        const [email, setEmail] = React.useState('');
        const [loading, setLoading] = React.useState(false);
        const [rawData, setRawData] = React.useState([]);
        const [pipelineRaw, setPipelineRaw] = React.useState([]);
        const [ploList, setPloList] = React.useState([]);
        const [activeTab, setActiveTab] = React.useState('dashboard');
        const [expandedMenu, setExpandedMenu] = React.useState(''); 
        const [filters, setFilters] = React.useState({ thoiGian: '', maTinh: 'ALL', luongSPDV: 'ALL', nhomSPDV: 'ALL', plo: 'ALL' });

        React.useEffect(() => { if (user) fetchDashboardData(); }, [user]);

        // --- FETCH DATA ---
        const handleLogin = async (e) => {
          e.preventDefault();
          setLoading(true);
          try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', email }) }).then(r => r.json());
            if (res.status === 'success') {
              localStorage.setItem('vnpt_user', JSON.stringify(res.user));
              setUser(res.user);
            } else { alert('Sai thông tin đăng nhập!'); }
          } catch (err) {
            alert('Mất kết nối API. Chạy giả lập UI.');
            setUser({ email, level: 1, tenClo: 'CLO_L1_MB', provinces: ['HN', 'HP', 'QN'] });
          }
          setLoading(false);
        };

        const fetchDashboardData = async () => {
          setLoading(true);
          try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getData', provinces: user.provinces }) }).then(r => r.json());
            if (res.status === 'success') {
              const normalizedData = (res.data || []).map(d => ({ ...d, thang: normalizeThang(d['thang'] || '') }));
              setRawData(normalizedData);
              const normalizedPipeline = (res.pipelineData || []).map(d => ({ ...d, thang: normalizeThang(d['thang'] || '') }));
              setPipelineRaw(normalizedPipeline);
              setPloList(res.ploData || []);
            }
          } catch (err) { console.warn("Lỗi đồng bộ dữ liệu API"); }
          setLoading(false);
        };

        const handleLogout = () => {
          setUser(null);
          localStorage.removeItem('vnpt_user');
          setRawData([]);
        };

        if (!user) {
          return (
            <div className="flex h-screen w-full items-center justify-center bg-gray-200">
              <form onSubmit={handleLogin} className="bg-white p-10 border-t-4 border-vnpt shadow-xl w-96 rounded">
                <h2 className="text-2xl font-bold text-navy mb-6 text-center">BI EXECUTIVE LOGIN</h2>
                <input className="w-full mb-6 p-3 border rounded focus:outline-vnpt text-sm" placeholder="Email đăng nhập" value={email} onChange={e => setEmail(e.target.value)} required />
                <button disabled={loading} className="w-full bg-vnpt text-white py-3 font-bold rounded hover:bg-navy transition">
                  {loading ? 'ĐANG KẾT NỐI...' : 'VÀO HỆ THỐNG'}
                </button>
              </form>
            </div>
          );
        }

        // ==========================================
        // ENGINE DATA CORE
        // ==========================================
        const getMonthVal = (mStr) => {
          if (!mStr) return null;
          const parts = mStr.toString().trim().split('/');
          if (parts.length === 2) return parseInt(parts[1]) * 100 + parseInt(parts[0]);
          return 0;
        };

        const isAllTime = !filters.thoiGian || filters.thoiGian === 'ALL' || filters.thoiGian === '';
        const filterMonthVal = isAllTime ? 999912 : getMonthVal(filters.thoiGian);

        const kpi = { dtThucHien: 0, dtKeHoach: 0, pipeTongGt: 0, pipeTongSl: 0, pipeMoGt: 0, pipeMoSl: 0, pipeDongGt: 0, pipeDongSl: 0, duBaoDt: 0 };

        const baseData = (rawData || []).filter(d => 
          (filters.maTinh === 'ALL' || d['ma_tinh'] == filters.maTinh) &&
          (filters.luongSPDV === 'ALL' || d['luong_spdv'] == filters.luongSPDV) &&
          (filters.nhomSPDV === 'ALL' || d['nhomspdv_code'] == filters.nhomSPDV) &&
          (filters.plo === 'ALL' || d['plo_code'] == filters.plo)
        );

        baseData.forEach(curr => {
           const mVal = getMonthVal(curr['thang']);
           if (mVal !== null && mVal > 0 && mVal <= filterMonthVal) {
               kpi.dtThucHien += parseNum(curr['dt_th_thang']);
               kpi.dtKeHoach += parseNum(curr['dt_kh_thang']);
           }
        });

        const basePipeline = (pipelineRaw || []).filter(d => 
          (filters.maTinh === 'ALL' || d['ma_tinh'] == filters.maTinh) &&
          (filters.nhomSPDV === 'ALL' || d['nhomspdv_code'] == filters.nhomSPDV) &&
          (filters.plo === 'ALL' || d['plo_code'] == filters.plo)
        );

        basePipeline.forEach(curr => {
           const mVal = getMonthVal(curr['thang']);
           const isMatchTime = isAllTime ? true : (mVal === filterMonthVal);

           if (isMatchTime) {
              const nganSach = parseNum(curr['ngansach_duan']);
              const dtDuBao = parseNum(curr['doanhthu_dubao']); 
              const statusStr = (curr['trang_thai'] || '').toString().trim().toUpperCase(); // Xử lý lỗi TypeError an toàn

              kpi.pipeTongSl += 1;
              kpi.pipeTongGt += nganSach;

              if (statusStr === 'CLOSED' || statusStr.includes('THẮNG') || statusStr.includes('ĐÓNG') || statusStr.includes('THÀNH CÔNG')) {
                  kpi.pipeDongSl += 1;
                  kpi.pipeDongGt += nganSach;
                  kpi.duBaoDt += dtDuBao; 
              } else if (statusStr === 'OPEN' || statusStr.includes('MỞ') || statusStr.includes('ĐANG')) {
                  kpi.pipeMoSl += 1;
                  kpi.pipeMoGt += nganSach;
                  kpi.duBaoDt += dtDuBao; 
              }
           }
        });

        const tyLeHT = kpi.dtKeHoach ? kpi.dtThucHien / kpi.dtKeHoach : 0;
        const winRate = kpi.pipeTongSl ? kpi.pipeDongSl / kpi.pipeTongSl : 0;
        const thieuHut = Math.max(kpi.dtKeHoach - kpi.dtThucHien - kpi.duBaoDt, 0); 

        const chartGroup = {};
        monthOptions.forEach(m => chartGroup[m] = { thang: m, thucHien: null, keHoach: 0 });
        baseData.forEach(curr => {
          const t = curr['thang'];
          if (chartGroup[t]) {
            chartGroup[t].keHoach += parseNum(curr['dt_kh_thang']);
            const rawTH = curr['dt_th_thang'];
            if (rawTH !== '' && rawTH != null) {
               const valTH = parseNum(rawTH);
               chartGroup[t].thucHien = (chartGroup[t].thucHien === null) ? valTH : chartGroup[t].thucHien + valTH;
            }
          }
        });
        const finalChartData = monthOptions.map(m => chartGroup[m]);
        
        // 5. TỔNG HỢP KPI CHI TIẾT THEO ĐỊA BÀN
        const provStats = {};
        const initProv = (p) => {
          if (!provStats[p]) provStats[p] = { maTinh: p, dtThucHien: 0, dtKeHoach: 0, pipeTongGt: 0, pipeTongSl: 0, pipeMoGt: 0, pipeDongGt: 0, pipeDongSl: 0, duBaoDt: 0 };
        };

        baseData.forEach(curr => {
          const p = curr['ma_tinh'] || 'N/A';
          initProv(p);
          const mVal = getMonthVal(curr['thang']);
          if (mVal !== null && mVal > 0 && mVal <= filterMonthVal) {
              provStats[p].dtThucHien += parseNum(curr['dt_th_thang']);
              provStats[p].dtKeHoach += parseNum(curr['dt_kh_thang']);
          }
        });

        basePipeline.forEach(curr => {
          const p = curr['ma_tinh'] || 'N/A';
          initProv(p);
          const mVal = getMonthVal(curr['thang']);
          if (isAllTime || mVal === filterMonthVal) {
              const nganSach = parseNum(curr['ngansach_duan']);
              const dtDuBao = parseNum(curr['doanhthu_dubao']); 
              const statusStr = (curr['trang_thai'] || '').toString().trim().toUpperCase();

              provStats[p].pipeTongSl += 1;
              provStats[p].pipeTongGt += nganSach;

              if (statusStr === 'CLOSED' || statusStr.includes('THẮNG') || statusStr.includes('ĐÓNG') || statusStr.includes('THÀNH CÔNG')) {
                  provStats[p].pipeDongSl += 1;
                  provStats[p].pipeDongGt += nganSach;
                  provStats[p].duBaoDt += dtDuBao; 
              } else if (statusStr === 'OPEN' || statusStr.includes('MỞ') || statusStr.includes('ĐANG')) {
                  provStats[p].pipeMoGt += nganSach;
                  provStats[p].duBaoDt += dtDuBao; 
              }
          }
        });

        // Ánh xạ thành Array & Tính các chỉ số phái sinh, Xếp hạng Thực hiện YTD giảm dần
        const provStatsArray = Object.values(provStats).map(p => ({
           ...p,
           tyLeHT: p.dtKeHoach ? p.dtThucHien / p.dtKeHoach : 0,
           winRate: p.pipeTongSl ? p.pipeDongSl / p.pipeTongSl : 0,
           thieuHut: Math.max(p.dtKeHoach - p.dtThucHien - p.duBaoDt, 0)
        })).sort((a, b) => b.dtThucHien - a.dtThucHien);
        
        // Trích xuất tiêu đề an toàn
        const activeMenuItem = MENU_ITEMS.find(m => m.id === activeTab);
        const headerTitle = activeMenuItem ? activeMenuItem.label : 'DASHBOARD';

        // ==========================================
        // RENDER UI
        // ==========================================
        return (
          <div className="flex h-screen w-full">
            <aside className="w-[200px] bg-navy text-white flex flex-col shadow-2xl z-20 shrink-0">
              <div className="p-5 border-b border-white/20 flex flex-col items-center">
                <div className="text-2xl font-extrabold tracking-widest text-vnpt bg-white px-3 py-1 rounded shadow mb-2">VNPT</div>
                <div className="text-[10px] text-center font-semibold text-gray-300 tracking-wider">HỆ THỐNG ĐIỀU HÀNH</div>
              </div>
              <nav className="flex-1 py-4 px-3 space-y-1 overflow-y-auto">
                {MENU_ITEMS.map(item => (
                  <div key={item.id}>
                    <a 
                      href={item.href || '#'}
                      onClick={(e) => {
                        if (item.subItems) { e.preventDefault(); setExpandedMenu(expandedMenu === item.id ? '' : item.id); }
                        else { setActiveTab(item.id); }
                      }} 
                      className={`w-full flex items-center justify-between px-3 py-3 rounded text-left transition font-semibold ${activeTab === item.id ? 'bg-vnpt text-white shadow' : 'text-gray-300 hover:bg-hoverbg hover:text-white'}`}
                    >
                      <span className="text-sm font-bold tracking-wide">{item.label}</span>
                      {item.subItems && <span className="text-xs">{expandedMenu === item.id ? '▼' : '▶'}</span>}
                    </a>
                    
                    {item.subItems && expandedMenu === item.id && (
                      <div className="ml-4 mt-1 space-y-1 border-l border-white/20 pl-2">
                        {item.subItems.map(sub => (
                          <a
                            key={sub.id}
                            href={sub.href}
                            className="block w-full text-left px-3 py-2 text-sm rounded transition text-gray-400 hover:text-white hover:bg-white/10"
                          >
                            {sub.label}
                          </a>
                        ))}
                      </div>
                    )}
                  </div>
                ))}
              </nav>
            </aside>

            <main className="flex-1 flex flex-col overflow-hidden bg-gray-50">
              <header className="bg-white px-8 py-4 flex justify-between items-center shrink-0 border-b">
                <h1 className="text-2xl font-bold uppercase tracking-wide text-navy">{headerTitle}</h1>
                <div className="flex items-center gap-4 text-sm">
                  <span className="font-semibold text-gray-600">{user.email}</span>
                  <span className="bg-vnpt/10 text-vnpt border border-vnpt px-4 py-1.5 rounded-full font-bold">Quyền: {user.tenClo}</span>
                  <button onClick={handleLogout} className="bg-risk text-white px-4 py-1.5 rounded font-bold hover:bg-red-700 transition">Đăng xuất</button>
                </div>
              </header>

              {activeTab === 'dashboard' ? (
                <div className="flex-1 flex flex-col overflow-hidden">
                  <div className="bg-white px-8 py-4 flex gap-4 shrink-0 border-b shadow-sm items-end z-10">
                    <div className="flex flex-col flex-1"><label className="text-xs font-bold text-navy mb-1">Thời gian</label><select className="border border-gray-300 p-2 rounded text-sm w-full focus:outline-vnpt" value={filters.thoiGian} onChange={e => setFilters({...filters, thoiGian: e.target.value})}><option value="">-- Tất cả --</option>{monthOptions.map(t => <option key={t} value={t}>{t}</option>)}</select></div>
                    <div className="flex flex-col flex-1"><label className="text-xs font-bold text-navy mb-1">CLO Địa bàn</label><select className="border border-gray-300 p-2 rounded text-sm w-full focus:outline-vnpt" value={filters.maTinh} onChange={e => setFilters({...filters, maTinh: e.target.value})}><option value="ALL">Toàn địa bàn</option>{user.provinces && user.provinces.map(p => <option key={p} value={p}>{p}</option>)}</select></div>
                    <div className="flex flex-col flex-1"><label className="text-xs font-bold text-navy mb-1">Luồng SPDV</label><select className="border border-gray-300 p-2 rounded text-sm w-full focus:outline-vnpt" value={filters.luongSPDV} onChange={e => setFilters({...filters, luongSPDV: e.target.value})}><option value="ALL">Tất cả</option>{[...new Set(rawData.map(d => d['luong_spdv']).filter(Boolean))].map(n => <option key={n} value={n}>{n}</option>)}</select></div>
                    <div className="flex flex-col flex-1"><label className="text-xs font-bold text-navy mb-1">Nhóm SPDV</label><select className="border border-gray-300 p-2 rounded text-sm w-full focus:outline-vnpt" value={filters.nhomSPDV} onChange={e => setFilters({...filters, nhomSPDV: e.target.value, plo: 'ALL'})}><option value="ALL">Tất cả</option>{[...new Set(ploList.map(p => p['nhomspdv_code']).filter(Boolean))].map(n => <option key={n} value={n}>{n}</option>)}</select></div>
                    <div className="flex flex-col flex-1"><label className="text-xs font-bold text-navy mb-1">Dịch vụ (PLO)</label><select className="border border-gray-300 p-2 rounded text-sm w-full focus:outline-vnpt" value={filters.plo} onChange={e => setFilters({...filters, plo: e.target.value})}><option value="ALL">Tất cả</option>{[...new Set(ploList.filter(p => filters.nhomSPDV === 'ALL' || p['nhomspdv_code'] === filters.nhomSPDV).map(p => p['plo_code']).filter(Boolean))].map(n => <option key={n} value={n}>{n}</option>)}</select></div>
                  </div>

                  {loading && <div className="text-center text-vnpt text-sm py-1 font-bold animate-pulse bg-white">Đang đồng bộ dữ liệu...</div>}

                  <div className="flex-1 overflow-auto flex flex-col">
                    <div className="flex gap-4 px-8 py-6 shrink-0">
                      <KpiCard title="1. DOANH THU LŨY KẾ" v1={fmtNum(kpi.dtThucHien)} l1="Thực hiện YTD (trĐ)" v2={fmtNum(kpi.dtKeHoach)} l2="Kế hoạch YTD (trĐ)" st="neutral" />
                      <KpiCard title="2. HIỆU SUẤT NĂM" v1={fmtPct(tyLeHT)} l1="Tỷ lệ HT Kế hoạch YTD" v2="-" l2="Tăng/Giảm (MoM)" st={tyLeHT >= 1 ? 'good' : 'risk'} />
                      <KpiCard title="3. PIPELINE TỔNG" v1={fmtNum(kpi.pipeTongGt)} l1="Ngân sách (trĐ)" v2={fmtNum(kpi.pipeTongSl)} l2="Số lượng Cơ hội" st="neutral" />
                      <KpiCard title="4. PIPELINE MỞ" v1={fmtNum(kpi.pipeMoGt)} l1="Ngân sách (trĐ)" v2={fmtNum(kpi.pipeMoSl)} l2="Số lượng" st="neutral" />
                      <KpiCard title="5. DEAL THÀNH CÔNG" v1={fmtNum(kpi.pipeDongGt)} l1="Ngân sách chốt (trĐ)" v2={fmtNum(kpi.pipeDongSl)} l2="Số lượng chốt" st="good" />
                      <KpiCard title="6. CHUYỂN ĐỔI" v1={fmtPct(winRate)} l1="Winrate (Tỉ lệ)" v2={fmtNum(kpi.pipeDongSl)} l2="Deal thành công" st={winRate >= 0.3 ? 'good' : 'risk'} />
                      <KpiCard title="7. DỰ BÁO" v1={fmtNum(kpi.duBaoDt)} l1="Doanh thu kỳ vọng" v2={fmtPct(kpi.dtKeHoach ? kpi.duBaoDt/kpi.dtKeHoach : 0)} l2="Tỷ lệ/Kế hoạch" st={(kpi.dtKeHoach ? kpi.duBaoDt/kpi.dtKeHoach : 0) >= 1 ? 'good' : 'risk'} />
                      <KpiCard title="8. KHOẢNG TRỐNG CẦN BÙ" v1={fmtNum(thieuHut)} l1="Thiếu hụt sau Dự báo (trĐ)" v2={fmtPct(kpi.dtKeHoach ? thieuHut/kpi.dtKeHoach : 0)} l2="Tỷ lệ thiếu hụt" st={thieuHut > 0 ? 'risk' : 'good'} />
                    </div>

                    <div className="px-8 pb-8 flex gap-8 shrink-0 min-h-[350px]">
                      <div className="flex-[2] bg-white border rounded shadow-sm p-6 flex flex-col">
                        <h2 className="text-navy font-bold text-base mb-6 uppercase">Tiến độ Phát sinh Hàng tháng (ĐVT: trĐ)</h2>
                        <div className="flex-1 w-full min-h-[250px]">
                          {ResponsiveContainer && BarChart ? (
                            <ResponsiveContainer width="100%" height="100%">
                              <BarChart data={finalChartData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                                <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                <XAxis dataKey="thang" tick={{fontSize: 12}} />
                                <YAxis tick={{fontSize: 12}} />
                                <Tooltip cursor={{fill: '#f3f4f6'}} formatter={(value) => new Intl.NumberFormat('vi-VN', {minimumFractionDigits: 2}).format(value)} />
                                <Legend wrapperStyle={{fontSize: '12px', paddingTop: '10px'}}/>
                                <Bar dataKey="thucHien" name="Thực hiện Phát sinh" fill="#0094D9" radius={[4,4,0,0]} />
                                <Bar dataKey="keHoach" name="Kế hoạch Phát sinh" fill="#cbd5e1" radius={[4,4,0,0]} />
                              </BarChart>
                            </ResponsiveContainer>
                          ) : (
                            <div className="flex items-center justify-center h-full text-gray-400 text-sm">Đang tải thư viện biểu đồ...</div>
                          )}
                        </div>
                      </div>
                      <div className="flex-[1] bg-white border rounded shadow-sm p-6 flex flex-col overflow-hidden">
                        <h2 className="text-navy font-bold text-base mb-6 uppercase">Cơ hội Trọng điểm (Cần thúc đẩy)</h2>
                        <div className="overflow-auto flex-1 pr-2">
                          <table className="w-full text-left text-sm">
                            <thead className="bg-gray-100 text-navy sticky top-0">
                              <tr><th className="p-3">Mã Deal</th><th className="p-3 text-right">Dự báo</th><th className="p-3 text-center">Trạng thái</th></tr>
                            </thead>
                            <tbody>
                              {basePipeline.slice(0, 10).map((p, i) => {
                                const statusRaw = (p['trang_thai'] || 'OPEN').toString().toUpperCase();
                                const colorClass = (statusRaw === 'CLOSED' || statusRaw.includes('ĐÓNG')) 
                                  ? 'bg-green-100 text-good' : 'bg-yellow-100 text-yellow-700';
                                return (
                                  <tr key={i} className="border-b hover:bg-gray-50">
                                    <td className="p-3 font-medium text-gray-700 truncate max-w-[120px]" title={p['ten_duan'] || p['CHKD_ID']}>{p['CHKD_ID'] || `Deal-${i+1}`}</td>
                                    <td className="p-3 text-right font-bold text-vnpt">{fmtNum(parseNum(p['doanhthu_dubao']))}</td>
                                    <td className="p-3 text-center">
                                      <span className={`text-[10px] px-2 py-1 rounded-full font-bold ${colorClass}`}>{statusRaw}</span>
                                    </td>
                                  </tr>
                                );
                              })}
                              {basePipeline.length === 0 && <tr><td colSpan="3" className="p-4 text-center text-gray-400">Không có Pipeline</td></tr>}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                      {/* BẢNG ĐÁNH GIÁ KPI ĐỊA BÀN */}
                    <div className="px-8 pb-8 flex shrink-0">
                      <div className="w-full bg-white border rounded shadow-sm p-6 flex flex-col overflow-hidden">
                        <h2 className="text-navy font-bold text-base mb-4 uppercase">Bảng Đánh Giá KPI Chi Tiết Từng Địa Bàn</h2>
                        <div className="overflow-auto max-h-[500px]">
                          <table className="w-full text-left text-sm border-collapse">
                            <thead className="bg-navy text-white sticky top-0 z-10 shadow">
                              <tr>
                                <th className="p-3 border-b font-semibold text-center w-12">STT</th>
                                <th className="p-3 border-b font-semibold">Địa bàn</th>
                                <th className="p-3 border-b font-semibold text-right">Kế hoạch YTD</th>
                                <th className="p-3 border-b font-semibold text-right">Thực hiện YTD</th>
                                <th className="p-3 border-b font-semibold text-right w-24">Tỷ lệ HT</th>
                                <th className="p-3 border-b font-semibold text-right">Pipeline Tổng</th>
                                <th className="p-3 border-b font-semibold text-right">Pipeline Mở</th>
                                <th className="p-3 border-b font-semibold text-right">Dự báo DT</th>
                                <th className="p-3 border-b font-semibold text-right">Khoảng trống</th>
                              </tr>
                            </thead>
                            <tbody>
                              {provStatsArray.map((p, i) => (
                                <tr key={i} className="border-b hover:bg-blue-50 transition">
                                  <td className="p-3 text-center text-gray-500">{i + 1}</td>
                                  <td className="p-3 font-bold text-navy">{p.maTinh}</td>
                                  <td className="p-3 text-right text-gray-700 font-medium">{fmtNum(p.dtKeHoach)}</td>
                                  <td className="p-3 text-right text-vnpt font-bold">{fmtNum(p.dtThucHien)}</td>
                                  <td className={`p-3 text-right font-bold ${p.tyLeHT >= 1 ? 'text-good' : 'text-risk'}`}>
                                    <span className={`px-2 py-1 rounded-full text-xs ${p.tyLeHT >= 1 ? 'bg-green-100' : 'bg-red-100'}`}>{fmtPct(p.tyLeHT)}</span>
                                  </td>
                                  <td className="p-3 text-right text-gray-700">{fmtNum(p.pipeTongGt)}</td>
                                  <td className="p-3 text-right text-gray-700">{fmtNum(p.pipeMoGt)}</td>
                                  <td className="p-3 text-right text-vnpt font-semibold">{fmtNum(p.duBaoDt)}</td>
                                  <td className={`p-3 text-right font-bold ${p.thieuHut > 0 ? 'text-risk' : 'text-good'}`}>{fmtNum(p.thieuHut)}</td>
                                </tr>
                              ))}
                              {provStatsArray.length === 0 && (
                                <tr><td colSpan="9" className="p-6 text-center text-gray-400">Không có dữ liệu</td></tr>
                              )}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                
                  </div>
                </div>
              ) : (
                <div className="flex-1 flex flex-col items-center justify-center text-gray-400 bg-gray-50">
                  <div className="text-6xl mb-4">🚧</div>
                  <h2 className="text-2xl font-bold text-navy mb-2">Tính năng đang phát triển</h2>
                  <p>Module hiện tại chưa được tích hợp trên Dashboard.</p>
                </div>
              )}
            </main>
          </div>
        );
      }
      ReactDOM.render(<App />, document.getElementById('root'));
    } catch (err) {
      document.getElementById('root').innerHTML = `<div style="padding: 40px; text-align: center;"><h2 style="color: #ef4444; font-size: 24px; font-weight: bold;">LỖI BIÊN DỊCH REACT</h2><p style="color: #333; margin-top: 10px;">${err.message}</p></div>`;
    }
  </script>
</body>
</html>
