<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VNPT-IT | Ban KDGP - ĐHSXKD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --vnpt-navy: #003B7A; --vnpt-blue: #0094D9; --vnpt-green: #00B050; --vnpt-yellow: #FFC000; --vnpt-red: #D83A3A; }
    body, button, input, select, textarea {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F4F7FB;
      color: #1E293B;
    }
    .kpi-card { transition: transform .15s ease, box-shadow .15s ease; }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(0, 59, 122, .12); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 999px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    Chart.defaults.font.family = "'Nunito', sans-serif"; // Đồng bộ font cho toàn bộ biểu đồ

    // ================== CẤU HÌNH KẾT NỐI ==================
    // Dán URL Web App GAS (/exec) vào đây. Khi đã dán, web TUYỆT ĐỐI chỉ đọc dữ liệu thật.
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby6E6r6KhZ54J6by2s1PF8MqtOSJu74GcyqO4GsFnSwWd-GmDScZFrS5Brq0IwXlO1N/exec";
    const STORAGE_KEY_USER = "vnpt_dhkd_user_v1";

    function VnptLogo({ size = "sm" }) {
      const boxCls = size === "lg" ? "w-10 h-10 p-1.5" : "w-8 h-8 p-1";
      return (
        <div className={`${boxCls} rounded-lg bg-white flex items-center justify-center shrink-0 shadow-xs overflow-hidden text-[#003B7A] font-extrabold text-xs`}>
          <img
            src="./logo-vnpt.png"
            alt="VNPT"
            className="w-full h-full object-contain"
            onError={(e) => { e.target.style.display = 'none'; e.target.parentNode.innerText = 'VN'; }}
          />
        </div>
      );
    }

    // Dữ liệu mẫu khớp dòng 6-7 bạn cung cấp (chỉ chạy khi GAS_API_URL để trống)
    const DEMO_SXKD = [
      { thang: "10/2026", ma_tinh: "QNH", nhomspdv_code: "ATTT", luong_spdv: "B,C", plo_code: "", dt_kh_luyke: 4151.70, dt_kh_thang: -831.51, dt_th_luyke: 24933.55, dt_th_thang: 1082.41 },
      { thang: "10/2026", ma_tinh: "QNH", nhomspdv_code: "CNNT", luong_spdv: "B,C", plo_code: "", dt_kh_luyke: 890.33, dt_kh_thang: 139.33, dt_th_luyke: 132.33, dt_th_thang: 4.11 },
      { thang: "10/2026", ma_tinh: "QNH", nhomspdv_code: "GOV+DLTM", luong_spdv: "A", plo_code: "PLO_CSDLDANGANH", dt_kh_luyke: 25000, dt_kh_thang: 2500, dt_th_luyke: 12000, dt_th_thang: 1500 },
      { thang: "10/2026", ma_tinh: "THA", nhomspdv_code: "GOV+DLTM", luong_spdv: "A", plo_code: "PLO_HANHCHINHSO", dt_kh_luyke: 120000, dt_kh_thang: 12000, dt_th_luyke: 42000, dt_th_thang: 5200 }
    ];

    const DEMO_PIPELINE = [
      { ma_tinh: "QNH", ma_chkd: "CHKD-QNH-007", nhomspdv_code: "GOV+DLTM", plo_code: "", ten_spdv: "VNPT DMIT", ten_duan: "Tạo lập, xây dựng, cập nhật CSDL ngành Công thương", ten_khachhang: "Sở Công thương", ngay_dukienchot: "2026-11-01", thang: "11/2026", trang_thai: "OPEN", trangthai_pipeline: "3. Triển khai thử nghiệm/POC", songay_trangthai: 88, tile_thang: 40, ngansach_duan: 10000, doanhthu_dubao: 4000 },
      { ma_tinh: "QNH", ma_chkd: "CHKD-QNH-002", nhomspdv_code: "GOV+DLTM", plo_code: "", ten_spdv: "VNPT DMIT", ten_duan: "Tạo lập, xây dựng, cập nhật CSDL ngành Nội vụ", ten_khachhang: "Sở Nội vụ", ngay_dukienchot: "2026-07-01", thang: "07/2026", trang_thai: "CLOSED", trangthai_pipeline: "10. Hỗ trợ sau bán hàng", songay_trangthai: 0, tile_thang: 100, ngansach_duan: 9581.87, doanhthu_dubao: 9582 },
      { ma_tinh: "THA", ma_chkd: "CHKD-THA-003", nhomspdv_code: "GOV+DLTM", plo_code: "PLO_HANHCHINHSO", ten_spdv: "VNPT ICS", ten_duan: "Xây dựng và triển khai hệ thống đài truyền thanh thông minh", ten_khachhang: "Sở KH&CN THA", ngay_dukienchot: "2026-12-15", thang: "12/2026", trang_thai: "OPEN", trangthai_pipeline: "4. Hình thành cơ hội khả thi (dự toán)", songay_trangthai: 15, tile_thang: 60, ngansach_duan: 118000, doanhthu_dubao: 70800 }
    ];

    // ================== HELPER ĐỊNH DẠNG & PHÂN LOẠI KỊCH BẢN ==================
    const fmt = (n, dec = 0) => Number(n || 0).toLocaleString('vi-VN', { minimumFractionDigits: dec, maximumFractionDigits: dec });

    function parseMonthOrder(mmYYYY) {
      const p = String(mmYYYY || '').split('/');
      if (p.length !== 2) return 0;
      return parseInt(p[1], 10) * 100 + parseInt(p[0], 10);
    }

    function classifyScenario(row) {
      if (row.projPct >= 100) {
        return {
          code: 'SAFE', label: 'Về đích an toàn', color: 'green',
          advice: 'Tập trung kiểm soát tiến độ nghiệm thu, thanh toán để ghi nhận đủ doanh thu trong năm.'
        };
      }
      if (row.netGap > 0 && row.coverage < 1.5) {
        return {
          code: 'THIEU_PHEU', label: 'Thiếu phễu (Báo động)', color: 'red',
          advice: 'Phễu CHKD quá mỏng (<1.5x Gap). Quay về Phần 2 (01_PHAPLY_NVU) rà soát nhiệm vụ có vốn để mở mới CHKD ngay.'
        };
      }
      return {
        code: 'NGHEN_CHOT', label: 'Nghẽn chốt Deal', color: 'yellow',
        advice: 'Phễu có quy mô nhưng tỷ lệ thắng/chốt còn thấp. Điều phối CLO + PLO đẩy nhanh các Deal Top giá trị sang ký HĐ.'
      };
    }

    // ================== COMPONENT BIỂU ĐỒ CHART.JS ==================
    function ChartBox({ id, title, subtitle, type, data, options }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) chartRef.current.destroy();
        chartRef.current = new Chart(canvasRef.current, { type, data, options });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [type, data, options]);

      return (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 flex flex-col">
          <div className="mb-3">
            <h3 className="text-sm font-bold text-[#003B7A] uppercase tracking-wide">{title}</h3>
            {subtitle && <p className="text-xs text-slate-500 mt-0.5">{subtitle}</p>}
          </div>
          <div className="relative h-64 w-full">
            <canvas ref={canvasRef} id={id}></canvas>
          </div>
        </div>
      );
    }

    // ================== MÀN HÌNH ĐĂNG NHẬP ==================
    function LoginModal({ onLogin, loading, errorMsg }) {
      const [email, setEmail] = useState("");
      const handleSubmit = (e) => {
        e.preventDefault();
        if (email.trim()) onLogin(email.trim().toLowerCase());
      };

      return (
        <div className="fixed inset-0 bg-[#003B7A]/90 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
            <div className="bg-gradient-to-r from-[#003B7A] to-[#0094D9] p-6 text-white">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-white p-1 flex items-center justify-center shrink-0 shadow-xs">
                  <img
                    src="./logo-vnpt.png"
                    alt="VNPT"
                    className="w-full h-full object-contain"
                  />
                </div>
                <div>
                  <div className="text-xs uppercase tracking-widest opacity-80">VNPT-IT • Ban KDGP</div>
                  <h1 className="text-lg font-bold">War-Room Điều hành SXKD</h1>
                </div>
              </div>
            </div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-600 uppercase mb-1.5">
                  Email xác thực (DMPHANQUYEN)
                </label>
                <input
                  type="email"
                  required
                  placeholder="ten.ban@vnpt.vn"
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#0094D9]"
                />
              </div>
              {errorMsg && <div className="text-xs text-[#D83A3A] bg-red-50 border border-red-200 rounded-lg p-2.5">{errorMsg}</div>}
              <button
                type="submit"
                disabled={loading}
                className="w-full py-2.5 bg-[#0094D9] hover:bg-[#007bb5] text-white font-semibold rounded-lg text-sm transition flex items-center justify-center gap-2"
              >
                {loading ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-right-to-bracket"></i>}
                Đăng nhập hệ thống
              </button>
              <p className="text-[11px] text-slate-400 text-center">
                Phân quyền tự động theo cấp L0 / CLO L1-L2-L3 / PLO từ Google Sheets Master.
              </p>
            </form>
          </div>
        </div>
      );
    }

    // ================== ỨNG DỤNG CHÍNH ==================
    function App() {
      const [user, setUser] = useState(() => {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY_USER) || "null"); } catch { return null; }
      });
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [sxkdData, setSxkdData] = useState([]);
      const [pipeData, setPipeData] = useState([]);
      const [updatedAt, setUpdatedAt] = useState("");
      const [loading, setLoading] = useState(false);
      const [authError, setAuthError] = useState("");

      // Bộ lọc Header
      const [fThang, setFThang] = useState("");
      const [fTinh, setFTinh] = useState("ALL");
      const [fNhom, setFNhom] = useState("ALL");
      const [fLuong, setFLuong] = useState("ALL");
      const [fPlo, setFPlo] = useState("ALL");

      // Chế độ bảng & lọc nhanh
      const [groupBy, setGroupBy] = useState("ma_tinh"); // 'ma_tinh' | 'nhomspdv_code'
      const [quickTab, setQuickTab] = useState("ALL");
      const [search, setSearch] = useState("");
      const [detailGroup, setDetailGroup] = useState(null);

      const fetchData = async (email) => {
        setLoading(true);
        setAuthError("");
        try {
          if (!GAS_API_URL) {
            const demoUser = { authorized: true, email, name: email.split('@')[0], role: 'L0', scope: 'ALL' };
            localStorage.setItem(STORAGE_KEY_USER, JSON.stringify(demoUser));
            setUser(demoUser);
            setSxkdData(DEMO_SXKD);
            setPipeData(DEMO_PIPELINE);
            setUpdatedAt("Chế độ dữ liệu mẫu");
            setLoading(false);
            return;
          }
          const res = await fetch(`${GAS_API_URL}?action=getSxkdData&email=${encodeURIComponent(email)}`);
          const json = await res.json();
          if (json.status !== 'success') {
            setAuthError(json.message || 'Không có quyền truy cập');
            setUser(null);
            localStorage.removeItem(STORAGE_KEY_USER);
          } else {
            localStorage.setItem(STORAGE_KEY_USER, JSON.stringify(json.user));
            setUser(json.user);
            setSxkdData(json.sxkd || []);
            setPipeData(json.pipeline || []);
            setUpdatedAt(json.updatedAt || '');
          }
        } catch (err) {
          setAuthError("Lỗi kết nối GAS API: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (user && user.email) fetchData(user.email);
      }, []);

      // Danh sách kỳ (thang) sắp xếp mới nhất lên đầu & tự chọn kỳ mới nhất
      const filterOpts = useMemo(() => {
        const thangs = [...new Set(sxkdData.map(r => r.thang).filter(Boolean))]
          .sort((a, b) => parseMonthOrder(b) - parseMonthOrder(a));
        return {
          thang: thangs,
          tinh: [...new Set([...sxkdData.map(r => r.ma_tinh), ...pipeData.map(r => r.ma_tinh)].filter(Boolean))].sort(),
          nhom: [...new Set([...sxkdData.map(r => r.nhomspdv_code), ...pipeData.map(r => r.nhomspdv_code)].filter(Boolean))].sort(),
          luong: [...new Set(sxkdData.map(r => r.luong_spdv).filter(Boolean))].sort(),
          plo: [...new Set([...sxkdData.map(r => r.plo_code), ...pipeData.map(r => r.plo_code)].filter(Boolean))].sort()
        };
      }, [sxkdData, pipeData]);

      useEffect(() => {
        if (!fThang && filterOpts.thang.length > 0) setFThang(filterOpts.thang[0]);
      }, [filterOpts.thang, fThang]);

      const handleLogout = () => {
        localStorage.removeItem(STORAGE_KEY_USER);
        setUser(null);
        setSxkdData([]);
        setPipeData([]);
      };

      // Lọc SXKD theo kỳ đang chọn + các chiều phân tích
      const filteredSxkd = useMemo(() => {
        return sxkdData.filter(r => {
          if (fThang && r.thang !== fThang) return false;
          if (fTinh !== "ALL" && r.ma_tinh !== fTinh) return false;
          if (fNhom !== "ALL" && r.nhomspdv_code !== fNhom) return false;
          if (fLuong !== "ALL" && r.luong_spdv !== fLuong) return false;
          if (fPlo !== "ALL" && r.plo_code !== fPlo) return false;
          return true;
        });
      }, [sxkdData, fThang, fTinh, fNhom, fLuong, fPlo]);

      // Lọc Pipeline tương ứng (chỉ dùng OPEN cho Dự báo bù Gap)
      const filteredPipe = useMemo(() => {
        return pipeData.filter(r => {
          if (fTinh !== "ALL" && r.ma_tinh !== fTinh) return false;
          if (fNhom !== "ALL" && r.nhomspdv_code !== fNhom) return false;
          if (fPlo !== "ALL" && r.plo_code !== fPlo) return false;
          return true;
        });
      }, [pipeData, fTinh, fNhom, fPlo]);

      // Tính 5 KPIs trọng tâm toàn cục
      const kpis = useMemo(() => {
        const kh = filteredSxkd.reduce((s, r) => s + Number(r.dt_kh_luyke || 0), 0);
        const th = filteredSxkd.reduce((s, r) => s + Number(r.dt_th_luyke || 0), 0);
        const htPct = kh > 0 ? (th / kh) * 100 : 0;
        const gap = Math.max(0, kh - th);

        const openDeals = filteredPipe.filter(p => String(p.trang_thai || '').toUpperCase() === 'OPEN');
        const openBudget = openDeals.reduce((s, p) => s + Number(p.ngansach_duan || 0), 0);
        const openForecast = openDeals.reduce((s, p) => s + Number(p.doanhthu_dubao || 0), 0);

        const totalProjected = th + openForecast;
        const projPct = kh > 0 ? (totalProjected / kh) * 100 : 0;
        const netGap = Math.max(0, gap - openForecast);
        const coverage = gap > 0 ? openBudget / gap : (openBudget > 0 ? 9.9 : 0);

        return { kh, th, htPct, gap, openCount: openDeals.length, openBudget, openForecast, totalProjected, projPct, netGap, coverage };
      }, [filteredSxkd, filteredPipe]);

      // Tổng hợp bảng điều hành theo Địa bàn hoặc Nhóm SPDV
      const summaryRows = useMemo(() => {
        const map = {};
        const ensure = (k) => {
          if (!map[k]) map[k] = { key: k, kh: 0, th: 0, openCount: 0, openBudget: 0, openForecast: 0, closedCount: 0, openDeals: [] };
          return map[k];
        };

        filteredSxkd.forEach(r => {
          const k = r[groupBy] || '(Chưa phân loại)';
          const m = ensure(k);
          m.kh += Number(r.dt_kh_luyke || 0);
          m.th += Number(r.dt_th_luyke || 0);
        });

        filteredPipe.forEach(p => {
          const k = p[groupBy] || '(Chưa phân loại)';
          const m = ensure(k);
          const st = String(p.trang_thai || '').toUpperCase();
          if (st === 'OPEN') {
            m.openCount += 1;
            m.openBudget += Number(p.ngansach_duan || 0);
            m.openForecast += Number(p.doanhthu_dubao || 0);
            m.openDeals.push(p);
          } else if (st === 'CLOSED') {
            m.closedCount += 1;
          }
        });

        return Object.values(map).map(m => {
          const htPct = m.kh > 0 ? (m.th / m.kh) * 100 : (m.th > 0 ? 100 : 0);
          const gap = Math.max(0, m.kh - m.th);
          const totalProjected = m.th + m.openForecast;
          const projPct = m.kh > 0 ? (totalProjected / m.kh) * 100 : (totalProjected > 0 ? 100 : 0);
          const netGap = Math.max(0, gap - m.openForecast);
          const coverage = gap > 0 ? m.openBudget / gap : (m.openBudget > 0 ? 9.9 : 0);
          const row = { ...m, htPct, gap, totalProjected, projPct, netGap, coverage };
          row.scenario = classifyScenario(row);
          row.openDeals.sort((a, b) => Number(b.doanhthu_dubao || 0) - Number(a.doanhthu_dubao || 0));
          return row;
        }).sort((a, b) => b.netGap - a.netGap || b.kh - a.kh);
      }, [filteredSxkd, filteredPipe, groupBy]);

      const visibleRows = useMemo(() => {
        return summaryRows.filter(r => {
          if (quickTab !== "ALL" && r.scenario.code !== quickTab) return false;
          if (search.trim() && !r.key.toLowerCase().includes(search.toLowerCase())) return false;
          return true;
        });
      }, [summaryRows, quickTab, search]);

      // Biểu đồ 1: Cấu trúc Khả năng Hoàn thành Kế hoạch (Bridge)
      const chartBridgeData = useMemo(() => ({
        labels: ['Kế hoạch giao', 'Thực hiện lũy kế', 'Dự báo OPEN (Weighted)', 'Tổng Dự kiến (TH+DB)', 'Net Gap còn thiếu'],
        datasets: [{
          label: 'Triệu VNĐ',
          data: [kpis.kh, kpis.th, kpis.openForecast, kpis.totalProjected, kpis.netGap],
          backgroundColor: ['#003B7A', '#00B050', '#0094D9', '#0EA5E9', '#D83A3A'],
          borderRadius: 6
        }]
      }), [kpis]);

      // Biểu đồ 2: Top 8 Đơn vị theo Kế hoạch vs (Thực hiện + Dự báo)
      const chartTopData = useMemo(() => {
        const top = [...summaryRows].sort((a, b) => b.kh - a.kh).slice(0, 8);
        return {
          labels: top.map(r => r.key),
          datasets: [
            { label: 'Kế hoạch giao', data: top.map(r => r.kh), backgroundColor: '#CBD5E1', borderRadius: 4 },
            { label: 'Thực hiện lũy kế', data: top.map(r => r.th), backgroundColor: '#003B7A', borderRadius: 4 },
            { label: 'Dự báo OPEN', data: top.map(r => r.openForecast), backgroundColor: '#0094D9', borderRadius: 4 }
          ]
        };
      }, [summaryRows]);

      const navItems = [
        { id: 'p1', label: 'Tổng quan SXKD', icon: 'fa-chart-line', href: 'index.html', active: true },
        { id: 'p2', label: 'Khung pháp lý CĐS', icon: 'fa-landmark', href: 'phaply.html' },
        { id: 'p3', label: 'Cơ hội kinh doanh', icon: 'fa-funnel-dollar', href: 'chkd.html' },
        { id: 'p4', label: 'Quản lý POC', icon: 'fa-flask', href: 'poc.html' },
        { id: 'p5', label: 'Đấu thầu', icon: 'fa-gavel', href: 'dauthau.html' },
        { id: 'p6', label: 'Hợp đồng', icon: 'fa-file-contract', href: 'hopdong.html' },
        { id: 'p7', label: 'Triển khai', icon: 'fa-gears', href: 'po.html' },
        { id: 'p8', label: 'Danh mục', icon: 'fa-database', href: 'danhmuc.html' }
      ];

      if (!user) return <LoginModal onLogin={fetchData} loading={loading} errorMsg={authError} />;

      return (
        <div className="min-h-screen flex bg-[#F4F7FB]">
          {/* =============== SIDEBAR CHUẨN DÙNG CHUNG (USER TRÊN NAV + FONT CHKD) =============== */}
          <aside className={`${sidebarOpen ? 'w-52' : 'w-14'} bg-[#003B7A] text-white flex flex-col transition-all duration-200 shrink-0 shadow-xl z-20`}>
            {/* 1. Logo & Nút thu gọn */}
            <div className="h-16 px-3 flex items-center justify-between border-b border-white/10">
              {sidebarOpen && (
                <div className="flex items-center gap-2 overflow-hidden">
                  <VnptLogo size="sm" />

                                <td className="py-2 px-2.5 text-right font-bold text-[#0094D9]">{fmt(d.doanhthu_dubao)}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                </div>

                <div className="px-5 py-3 bg-slate-50 border-t border-slate-200 flex justify-end">
                  <button onClick={() => setDetailGroup(null)} className="px-4 py-2 rounded-lg text-xs font-semibold bg-[#003B7A] text-white hover:bg-[#002855]">Đóng</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
