<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Executive Dashboard - VNPT</title>
  <!-- Nhúng font Nunito từ Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>

  <script>
    tailwind.config = { 
      theme: { 
        extend: { 
          fontFamily: {
            sans: ['Nunito', 'sans-serif'], 
          },
          colors: {vnpt: '#0094D9', navy: '#003B7A', good: '#22c55e', risk: '#ef4444'} 
        } 
      } 
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center font-sans">
  <div id="root" class="w-full h-screen bg-white overflow-hidden flex flex-col">
    <div class="p-10 text-center text-risk font-bold mt-20">Đang khởi tạo hệ thống...</div>
  </div>

  <script type="text/babel">
    try {
      const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = window.Recharts || {};
      const API_URL = 'https://script.google.com/macros/s/AKfycby6E6r6KhZ54J6by2s1PF8MqtOSJu74GcyqO4GsFnSwWd-GmDScZFrS5Brq0IwXlO1N/exec'; 

      // Tạo danh sách 12 tháng tự động cho năm hiện tại
      const currentYear = new Date().getFullYear();
      const monthOptions = Array.from({length: 12}, (_, i) => `${i + 1}/${currentYear}`);

      const mockChartData = Array.from({length: 10}, (_, i) => ({ thang: `T${i + 1}`, thucHien: Math.floor(Math.random() * 400 + 600), keHoach: 1000 }));
      const mockProjects = Array.from({length: 10}, (_, i) => ({ id: i + 1, ten: `Dự án CĐS Khối Y tế/GD ${i+1}`, giaTri: Math.floor(Math.random() * 50 + 10) + ' Tỷ', trangThai: i % 3 === 0 ? 'Rủi ro' : 'Đang bám sát' }));

      function App() {
        const [user, setUser] = React.useState(() => {
          try { return JSON.parse(localStorage.getItem('vnpt_user')); } catch { return null; }
        });
        const [email, setEmail] = React.useState('');
        const [loading, setLoading] = React.useState(false);
        const [rawData, setRawData] = React.useState([]);
        const [ploList, setPloList] = React.useState([]);
        
        // State bộ lọc chuẩn
        const [filters, setFilters] = React.useState({ thoiGian: '', maTinh: 'ALL', luongSPDV: 'ALL', nhomSPDV: 'ALL', plo: 'ALL' });

        React.useEffect(() => { if (user) fetchDashboardData(); }, [user]);

        const handleLogin = async (e) => {
          e.preventDefault();
          setLoading(true);
          try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', email }) }).then(r => r.json());
            if (res.status === 'success') {
              localStorage.setItem('vnpt_user', JSON.stringify(res.user));
              setUser(res.user);
            } else { alert('Sai thông tin đăng nhập!'); }
          } catch (err) {
            alert('Mất kết nối API. Chạy chế độ giả lập giao diện.');
            setUser({ email, level: 1, tenClo: 'CLO_L0_CEO', provinces: ['HNI', 'HPG', 'QNH','DNG','HUE','HCM', 'CTO','DNI','BNH'] });
          }
          setLoading(false);
        };

        const fetchDashboardData = async () => {
          setLoading(true);
          try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getData', provinces: user.provinces }) }).then(r => r.json());
            if (res.status === 'success') {
              setRawData(res.data || []);
              setPloList(res.ploData || []);
            }
          } catch (err) { console.warn("Lỗi đồng bộ dữ liệu"); }
          setLoading(false);
        };

        const fmtNum = (num) => new Intl.NumberFormat('vi-VN').format(num || 0);
        const fmtPct = (num) => `${(num * 100).toFixed(1)}%`;

        if (!user) {
          return (
            <div className="flex h-full items-center justify-center bg-gray-200">
              <form onSubmit={handleLogin} className="bg-white p-10 border-t-4 border-vnpt shadow-xl w-96 rounded">
                <h2 className="text-2xl font-bold text-navy mb-6 text-center">ĐĂNG NHẬP</h2>
                <input className="w-full mb-6 p-3 border rounded focus:outline-vnpt text-sm" placeholder="Email: dhkddulieu@gmail.com" value={email} onChange={e => setEmail(e.target.value)} required />
                <button disabled={loading} className="w-full bg-vnpt text-white py-3 font-bold rounded hover:bg-navy transition">{loading ? 'ĐANG KẾT NỐI...' : 'VÀO HỆ THỐNG'}</button>
              </form>
            </div>
          );
        }

        // LOGIC LỌC DỮ LIỆU ĐỘNG (Xử lý chặt chẽ trường hợp ALL)
        const filteredData = rawData.filter(d => {
          const matchTime = filters.thoiGian === '' || d['thang'] == filters.thoiGian;
          const matchTinh = filters.maTinh === 'ALL' || d['ma_tinh'] == filters.maTinh;
          const matchLuong = filters.luongSPDV === 'ALL' || d['luong_spdv'] == filters.luongSPDV;
          const matchNhom = filters.nhomSPDV === 'ALL' || d['nhomspdv_code'] == filters.nhomSPDV;
          const matchPlo = filters.plo === 'ALL' || d['plo_code'] == filters.plo;
          return matchTime && matchTinh && matchLuong && matchNhom && matchPlo;
        });

        // TỔNG HỢP KPI
        const kpi = filteredData.reduce((acc, curr) => {
          acc.dtThucHien += Number(curr['dt_thuc_hien']) || 0;
          acc.dtKeHoach += Number(curr['dt_ke_hoach']) || 0;
          acc.dtThangTruoc += Number(curr['dt_thang_truoc']) || 0;
          acc.pipeTongGt += Number(curr['pipe_tong_gt']) || 0;
          acc.pipeTongSl += Number(curr['pipe_tong_sl']) || 0;
          acc.pipeMoGt += Number(curr['pipe_mo_gt']) || 0;
          acc.pipeMoSl += Number(curr['pipe_mo_sl']) || 0;
          acc.pipeDongGt += Number(curr['pipe_dong_gt']) || 0;
          acc.pipeDongSl += Number(curr['pipe_dong_sl']) || 0;
          acc.duBaoDt += Number(curr['du_bao_dt']) || 0;
          return acc;
        }, { dtThucHien: 0, dtKeHoach: 0, dtThangTruoc: 0, pipeTongGt: 0, pipeTongSl: 0, pipeMoGt: 0, pipeMoSl: 0, pipeDongGt: 0, pipeDongSl: 0, duBaoDt: 0 });

        const tyLeHT = kpi.dtKeHoach ? kpi.dtThucHien / kpi.dtKeHoach : 0;
        const tangGiam = kpi.dtThangTruoc ? (kpi.dtThucHien - kpi.dtThangTruoc) / kpi.dtThangTruoc : 0;
        const winRate = kpi.pipeTongSl ? kpi.pipeDongSl / kpi.pipeTongSl : 0;
        const thieuHut = Math.max(kpi.dtKeHoach - kpi.dtThucHien, 0);

        // Nâng Font size KPI: text-[11px]->text-xs, text-xl->text-3xl, text-sm->text-base
        const KpiCard = ({ title, v1, l1, v2, l2, st }) => (
          <div className="bg-white border rounded flex-1 p-4 shadow-sm flex flex-col justify-between hover:border-vnpt transition min-w-[160px]">
            <h3 className="text-navy font-bold text-2xl mb-3 uppercase truncate">{title}</h3>
            <div>
              <div className={`text-3xl font-bold mb-1 ${st === 'good' ? 'text-good' : st === 'risk' ? 'text-risk' : 'text-vnpt'}`}>{v1}</div>
              <div className="text-xs text-gray-500 mb-3 truncate">{l1}</div>
              <div className="text-base font-bold text-gray-700 border-t pt-2">{v2}</div>
              <div className="text-xs text-gray-500 truncate">{l2}</div>
            </div>
          </div>
        );

        // Render cấu trúc giao diện
        return (
          <React.Fragment>
            <header className="bg-navy text-white px-8 py-4 flex justify-between items-center shrink-0">
              <h1 className="text-2xl font-bold uppercase tracking-wide">Dashboard Điều hành: Sản Xuất Kinh Doanh</h1>
              <div className="flex items-center gap-4 text-base">
                <span className="bg-vnpt px-4 py-1.5 rounded-full font-semibold">{user.tenClo}</span>
                <span className="opacity-90">{user.email}</span>
                <button onClick={() => { setUser(null); localStorage.removeItem('vnpt_user'); }} className="bg-risk px-4 py-1.5 rounded font-bold hover:bg-red-700 transition">Đăng xuất</button>
              </div>
            </header>

            {/* Điều hướng: Sử dụng flex-1 để chia đều 5 vùng không gian */}
            <div className="bg-white px-8 py-4 flex gap-4 shrink-0 border-b items-end">
              <div className="flex flex-col flex-1">
                <label className="text-base font-bold text-navy mb-1">Thời gian (tháng)</label>
                <select className="border p-2 rounded text-base w-full focus:outline-vnpt" value={filters.thoiGian} onChange={e => setFilters({...filters, thoiGian: e.target.value})}>
                  <option value="">-- Tất cả --</option>
                  {monthOptions.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
              <div className="flex flex-col flex-1">
                <label className="text-base font-bold text-navy mb-1">CLO Địa bàn</label>
                <select className="border p-2 rounded text-base w-full focus:outline-vnpt" value={filters.maTinh} onChange={e => setFilters({...filters, maTinh: e.target.value})}>
                  <option value="ALL">Toàn địa bàn</option>
                  {user.provinces && user.provinces.map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
              
              <div className="flex flex-col flex-1">
                <label className="text-base font-bold text-navy mb-1">Luồng SPDV</label>
                <select className="border p-2 rounded text-base w-full focus:outline-vnpt" value={filters.luongSPDV} onChange={e => setFilters({...filters, luongSPDV: e.target.value})}>
                  <option value="ALL">Tất cả</option>           
                  {[...new Set(rawData.map(d => d['luong_spdv']).filter(Boolean))].map(n => <option key={n} value={n}>{n}</option>)}
                </select>
              </div>
              <div className="flex flex-col flex-1">
                <label className="text-base font-bold text-navy mb-1">Nhóm SPDV</label>
                <select className="border p-2 rounded text-base w-full focus:outline-vnpt" value={filters.nhomSPDV} onChange={e => setFilters({...filters, nhomSPDV: e.target.value, plo: 'ALL'})}>
                  <option value="ALL">Tất cả</option>
                  {[...new Set(ploList.map(p => p['nhomspdv_code']).filter(Boolean))].map(n => <option key={n} value={n}>{n}</option>)}
                </select>
              </div>
              <div className="flex flex-col flex-1">
                <label className="text-base font-bold text-navy mb-1">Dịch vụ (PLO)</label>
                <select className="border p-2 rounded text-base w-full focus:outline-vnpt" value={filters.plo} onChange={e => setFilters({...filters, plo: e.target.value})}>
                  <option value="ALL">Tất cả PLO</option>
                  {[...new Set(ploList.filter(p => filters.nhomSPDV === 'ALL' || p['nhomspdv_code'] === filters.nhomSPDV).map(p => p['plo_code']).filter(Boolean))].map(n => <option key={n} value={n}>{n}</option>)}
                </select>
              </div>
            </div>

            {loading && <div className="text-center text-vnpt text-sm py-2 font-bold animate-pulse bg-gray-50">Đang đồng bộ dữ liệu...</div>}

            <div className="flex gap-4 px-8 py-6 bg-gray-50 shrink-0 overflow-x-auto">
              <KpiCard title="1. DOANH THU" v1={fmtNum(kpi.dtThucHien)} l1="Thực hiện (VNĐ)" v2={fmtNum(kpi.dtKeHoach)} l2="Kế hoạch (VNĐ)" st="neutral" />
              <KpiCard title="2. HIỆU SUẤT" v1={fmtPct(tyLeHT)} l1="Tỷ lệ HT Kế hoạch" v2={fmtPct(tangGiam)} l2="Tăng/Giảm (MoM)" st={tyLeHT >= 1 ? 'good' : 'risk'} />
              <KpiCard title="3. PIPELINE TỔNG" v1={fmtNum(kpi.pipeTongGt)} l1="Giá trị (VNĐ)" v2={fmtNum(kpi.pipeTongSl)} l2="Số lượng Cơ hội" st="neutral" />
              <KpiCard title="4. PIPELINE MỞ" v1={fmtNum(kpi.pipeMoGt)} l1="Đang xử lý (VNĐ)" v2={fmtNum(kpi.pipeMoSl)} l2="Số lượng" st="neutral" />
              <KpiCard title="5. DEAL THÀNH CÔNG" v1={fmtNum(kpi.pipeDongGt)} l1="Giá trị chốt (VNĐ)" v2={fmtNum(kpi.pipeDongSl)} l2="Số lượng chốt" st="good" />
              <KpiCard title="6. CHUYỂN ĐỔI" v1={fmtPct(winRate)} l1="Winrate (Số lượng)" v2={fmtNum(kpi.pipeDongSl)} l2="Deal thành công" st={winRate >= 0.3 ? 'good' : 'risk'} />
              <KpiCard title="7. DỰ BÁO" v1={fmtNum(kpi.duBaoDt)} l1="Dự báo cuối kỳ" v2={fmtPct(kpi.dtKeHoach ? kpi.duBaoDt/kpi.dtKeHoach : 0)} l2="Tỷ lệ Ước tính" st={(kpi.dtKeHoach ? kpi.duBaoDt/kpi.dtKeHoach : 0) >= 1 ? 'good' : 'risk'} />
              <KpiCard title="8. KHOẢNG TRỐNG" v1={fmtNum(thieuHut)} l1="Cần bù đắp (VNĐ)" v2={fmtPct(kpi.dtKeHoach ? thieuHut/kpi.dtKeHoach : 0)} l2="Tỷ lệ thiếu hụt" st={thieuHut > 0 ? 'risk' : 'good'} />
            </div>

            <main className="flex-1 px-8 pb-8 bg-gray-50 flex gap-8 overflow-hidden">
              <div className="flex-[2] bg-white border rounded shadow-sm p-6 flex flex-col">
                <h2 className="text-navy font-bold text-base mb-6 uppercase">Doanh thu Thực hiện vs Kế hoạch (10 Tháng)</h2>
                <div className="flex-1 w-full min-h-[300px]">
                  {window.Recharts && (
                    <ResponsiveContainer width="100%" height="100%">
                      <BarChart data={mockChartData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                        <XAxis dataKey="thang" tick={{fontSize: 14}} />
                        <YAxis tick={{fontSize: 14}} />
                        <Tooltip cursor={{fill: '#f3f4f6'}} />
                        <Legend wrapperStyle={{fontSize: '14px', paddingTop: '10px'}}/>
                        <Bar dataKey="thucHien" name="Thực hiện" fill="#0094D9" radius={[4,4,0,0]} />
                        <Bar dataKey="keHoach" name="Kế hoạch" fill="#cbd5e1" radius={[4,4,0,0]} />
                      </BarChart>
                    </ResponsiveContainer>
                  )}
                </div>
              </div>
              <div className="flex-[1] bg-white border rounded shadow-sm p-6 flex flex-col overflow-hidden">
                <h2 className="text-navy font-bold text-base mb-6 uppercase">Dự án Trọng điểm (Cần thúc đẩy)</h2>
                <div className="overflow-auto flex-1">
                  <table className="w-full text-left text-base">
                    <thead className="bg-gray-100 text-navy sticky top-0">
                      <tr><th className="p-3">Dự án</th><th className="p-3 text-right">Quy mô</th><th className="p-3 text-center">Trạng thái</th></tr>
                    </thead>
                    <tbody>
                      {mockProjects.map(p => (
                        <tr key={p.id} className="border-b">
                          <td className="p-3 truncate max-w-[140px] font-medium text-gray-700">{p.ten}</td>
                          <td className="p-3 text-right font-bold text-vnpt">{p.giaTri}</td>
                          <td className="p-3 text-center">
                            <span className={`text-xs px-3 py-1.5 rounded-full font-bold ${p.trangThai === 'Rủi ro' ? 'bg-red-100 text-risk' : 'bg-green-100 text-good'}`}>{p.trangThai}</span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>
          </React.Fragment>
        );
      }
      ReactDOM.render(<App />, document.getElementById('root'));
    } catch (err) {
      document.getElementById('root').innerHTML = `<div class="p-10 text-center text-risk font-bold text-xl">Lỗi hệ thống: ${err.message}</div>`;
    }
  </script>
</body>
</html>
