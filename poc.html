    // ================== HELPER XỬ LÝ NGÀY & CẢNH BÁO ==================
    function parseVNDate(str) {
      if (!str) return null;
      const parts = String(str).trim().split('/');
      if (parts.length !== 3) return null;
      const d = parseInt(parts[0], 10), m = parseInt(parts[1], 10) - 1, y = parseInt(parts[2], 10);
      const dt = new Date(y, m, d);
      return isNaN(dt.getTime()) ? null : dt;
    }

    function getOverdueDays(row) {
      const st = String(row.trangthai_poc || '').toLowerCase();
      if (!st.includes('đang')) return 0;
      const dk = parseVNDate(row.ngayketthuc_poc_dk);
      if (!dk) return 0;
      const diff = Math.floor((new Date() - dk) / 86400000);
      return diff > 0 ? diff : 0;
    }

    function computeAlertLevel(row) {
      if (row.mucdo_canhbao) return row.mucdo_canhbao;
      const overdue = getOverdueDays(row);
      if (overdue > 15 || (row.dexuat_chidao && !row.chidao_lanhdao)) return "Đỏ";
      if (overdue > 0 || Number(row.sl_loi_dq || 0) > 0) return "Vàng";
      return "Xanh";
    }

    // ================== COMPONENT BIỂU ĐỒ CHART.JS ==================
    function ChartBox({ id, title, subtitle, type, data, options }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) chartRef.current.destroy(); // Tránh chồng canvas khi lọc
        chartRef.current = new Chart(canvasRef.current, { type, data, options });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [type, data, options]);

      return (
        <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 flex flex-col">
          <div className="mb-3">
            <h3 className="text-sm font-bold text-[#003B7A] uppercase tracking-wide">{title}</h3>
            {subtitle && <p className="text-xs text-slate-500 mt-0.5">{subtitle}</p>}
          </div>
          <div className="relative h-60 w-full">
            <canvas ref={canvasRef} id={id}></canvas>
          </div>
        </div>
      );
    }

    // ================== MÀN HÌNH ĐĂNG NHẬP (ĐỒNG BỘ PHẦN 3) ==================

      const handleSubmit = (e) => {
        e.preventDefault();
        if (email.trim()) onLogin(email.trim().toLowerCase());
      };

      return (
        <div className="fixed inset-0 bg-[#003B7A]/90 backdrop-blur-sm flex items-center justify-center z-50 p-4">

            <div className="bg-gradient-to-r from-[#003B7A] to-[#0094D9] p-6 text-white">

                <div className="w-8 h-8 rounded-lg bg-white p-1 flex items-center justify-center shrink-0 shadow-xs">

                </div>
                <div>
                  <div className="text-xs uppercase tracking-widest opacity-80">VNPT-IT • Ban KDGP</div>

              </div>

                />
              </div>
              {errorMsg && <div className="text-xs text-[#D83A3A] bg-red-50 border border-red-200 rounded-lg p-2.5">{errorMsg}</div>}
              <button
                type="submit"
                disabled={loading}
                className="w-full py-2.5 bg-[#0094D9] hover:bg-[#007bb5] text-white font-semibold rounded-lg text-sm transition flex items-center justify-center gap-2"
              >
                {loading ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-right-to-bracket"></i>}
                Đăng nhập hệ thống
              </button>
              <p className="text-[11px] text-slate-400 text-center">
                Phân quyền tự động theo cấp L0 / CLO L1-L2-L3 / PLO từ Google Sheets Master.

    // ================== ỨNG DỤNG CHÍNH ==================
    function App() {
      const [user, setUser] = useState(() => {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY_USER) || "null"); } catch { return null; }
      });
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [rawData, setRawData] = useState([]);
      const [updatedAt, setUpdatedAt] = useState("Chế độ dữ liệu mẫu");
      const [loading, setLoading] = useState(false);
      const [authError, setAuthError] = useState("");

      // Bộ lọc Header
      const [fTinh, setFTinh] = useState("ALL");
      const [fPlo, setFPlo] = useState("ALL");
      const [fNhom, setFNhom] = useState("ALL");
      const [fTrangThai, setFTrangThai] = useState("ALL");
      const [quickTab, setQuickTab] = useState("ALL");
      const [search, setSearch] = useState("");

      // Modal Chi tiết & Chỉ đạo
      const [selectedRow, setSelectedRow] = useState(null);
      const [chiDaoInput, setChiDaoInput] = useState("");
      const [savingChiDao, setSavingChiDao] = useState(false);

      const fetchData = async (email) => {
        setLoading(true);
        setAuthError("");
        try {
          if (!GAS_API_URL) {
            // Chạy Demo khi chưa gắn URL GAS
            const demoUser = { authorized: true, email, name: email.split('@')[0], role: 'L0', scope: 'ALL' };
            localStorage.setItem(STORAGE_KEY_USER, JSON.stringify(demoUser));
            setUser(demoUser);
            setRawData(DEMO_DATA);
            setUpdatedAt(new Date().toLocaleString('vi-VN'));
            setLoading(false);
            return;
          }
          const res = await fetch(`${GAS_API_URL}?action=getPocData&email=${encodeURIComponent(email)}`);
          const json = await res.json();
          if (json.status !== 'success') {
            setAuthError(json.message || 'Không có quyền truy cập');
            setUser(null);
            localStorage.removeItem(STORAGE_KEY_USER);
          } else {
            localStorage.setItem(STORAGE_KEY_USER, JSON.stringify(json.user));
            setUser(json.user);
            setRawData(json.data || []);
            setUpdatedAt(json.updatedAt || '');
          }
        } catch (err) {
          setAuthError("Lỗi kết nối API: " + err.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (user && user.email) fetchData(user.email);
      }, []);

      const handleLogout = () => {
        localStorage.removeItem(STORAGE_KEY_USER);
        setUser(null);
        setRawData([]);
      };

      const handleSaveChiDao = async () => {
        if (!selectedRow) return;
        setSavingChiDao(true);
        try {
          if (GAS_API_URL) {
            // Không dùng header 'application/json' để tránh lỗi CORS của GAS
            const res = await fetch(GAS_API_URL, {
              method: 'POST',
              body: JSON.stringify({
                email: user.email,
                ma_poc: selectedRow.ma_poc,
                chidao_lanhdao: chiDaoInput
              })
            });
            const json = await res.json();
            if (json.status !== 'success') {
              throw new Error(json.message || 'GAS từ chối ghi dữ liệu');
            }
          }
          // Chỉ cập nhật giao diện khi Sheet đã ghi thành công
          setRawData(prev => prev.map(r => r.ma_poc === selectedRow.ma_poc ? { ...r, chidao_lanhdao: chiDaoInput } : r));
          setSelectedRow(null);
        } catch (e) {
          alert("Lưu chỉ đạo thất bại: " + e.message);
        } finally {
          setSavingChiDao(false);
        }
      };

      // Danh sách giá trị bộ lọc
      const filterOpts = useMemo(() => ({
        tinh: [...new Set(rawData.map(r => r.ma_tinh || '(Trống)'))].sort(),
        plo: [...new Set(rawData.map(r => r.plo_code || '(Chưa gán)'))].sort(),
        nhom: [...new Set(rawData.map(r => r.nhomspdv_code || '(Chưa gán)'))].sort(),
        trangThai: [...new Set(rawData.map(r => r.trangthai_poc || '(Trống)'))].sort()
      }), [rawData]);

      // Dữ liệu đã lọc
      const filteredData = useMemo(() => {
        return rawData.filter(r => {
          const tinhVal = r.ma_tinh || '(Trống)';
          const ploVal = r.plo_code || '(Chưa gán)';
          const nhomVal = r.nhomspdv_code || '(Chưa gán)';
          const ttVal = r.trangthai_poc || '(Trống)';
          if (fTinh !== "ALL" && tinhVal !== fTinh) return false;
          if (fPlo !== "ALL" && ploVal !== fPlo) return false;
          if (fNhom !== "ALL" && nhomVal !== fNhom) return false;
          if (fTrangThai !== "ALL" && ttVal !== fTrangThai) return false;

          const alertLvl = computeAlertLevel(r);
          const overdue = getOverdueDays(r);
          if (quickTab === "ALERT" && !(alertLvl === "Đỏ" || overdue > 0 || (r.dexuat_chidao && !r.chidao_lanhdao))) return false;
          if (quickTab === "ACTIVE" && !String(r.trangthai_poc).toLowerCase().includes("đang")) return false;
          if (quickTab === "WON" && !String(r.ketqua_poc).toLowerCase().includes("thành công")) return false;
          if (quickTab === "DQ" && !(Number(r.sl_loi_dq) > 0 || !r.ma_tinh || !r.ten_khachhang_poc)) return false;

          if (search.trim()) {
            const q = search.toLowerCase();
            const hay = `${r.ma_poc} ${r.ma_chkd} ${r.ten_duan_poc} ${r.ten_khachhang_poc} ${r.ten_spdv} ${r.ma_tinh}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }, [rawData, fTinh, fPlo, fNhom, fTrangThai, quickTab, search]);

      // Tính 5 KPIs trọng tâm
      const kpis = useMemo(() => {
        const total = filteredData.length;
        const active = filteredData.filter(r => String(r.trangthai_poc).toLowerCase().includes("đang")).length;
        const won = filteredData.filter(r => String(r.ketqua_poc).toLowerCase().includes("thành công") || String(r.ketqua_poc).toLowerCase().includes("đạt")).length;
        const overdue = filteredData.filter(r => getOverdueDays(r) > 0 || computeAlertLevel(r) === "Đỏ").length;
        const totalCost = filteredData.reduce((s, r) => s + Number(r.chiphi_hatang_poc || 0) + Number(r.chiphi_nguonluc_poc || 0), 0);
        const pendingDir = filteredData.filter(r => r.dexuat_chidao && !r.chidao_lanhdao).length;
        const dqIssues = filteredData.filter(r => Number(r.sl_loi_dq) > 0 || !r.ma_tinh).length;
        const convRate = total > 0 ? Math.round((won / total) * 100) : 0;
        return { total, active, won, convRate, overdue, totalCost, pendingDir, dqIssues };
      }, [filteredData]);

      // Dữ liệu biểu đồ 1: Phân bổ theo Trạng thái & Kết quả
      const chartStatusData = useMemo(() => {
        const map = {};
        filteredData.forEach(r => {
          const k = r.trangthai_poc || "Chưa xác định";
          map[k] = (map[k] || 0) + 1;
        });
        const labels = Object.keys(map);
        return {
          labels,
          datasets: [{
            label: 'Số lượng POC',
            data: labels.map(l => map[l]),
            backgroundColor: ['#0094D9', '#D83A3A', '#00B050', '#FFC000', '#003B7A'],
            borderRadius: 6
          }]
        };
      }, [filteredData]);

      // Dữ liệu biểu đồ 2: Top Địa bàn theo Số POC & Chi phí
      const chartTinhData = useMemo(() => {
        const map = {};
        filteredData.forEach(r => {
          const k = r.ma_tinh || "Chưa gán";
          if (!map[k]) map[k] = { count: 0, cost: 0 };
          map[k].count += 1;
          map[k].cost += Number(r.chiphi_hatang_poc || 0) + Number(r.chiphi_nguonluc_poc || 0);
        });
        const sorted = Object.entries(map).sort((a, b) => b[1].count - a[1].count).slice(0, 8);
        return {
          labels: sorted.map(x => x[0]),
          datasets: [
            { label: 'Số lượng POC', data: sorted.map(x => x[1].count), backgroundColor: '#003B7A', borderRadius: 6, yAxisID: 'y' },
            { label: 'Tổng chi phí (trVND)', data: sorted.map(x => x[1].cost), type: 'line', borderColor: '#0094D9', backgroundColor: '#0094D9', tension: 0.3, yAxisID: 'y1' }
          ]
        };
      }, [filteredData]);

      const navItems = [
        { id: 'p1', label: 'Tổng quan SXKD', icon: 'fa-chart-line', href: 'index.html' },
        { id: 'p2', label: 'Khung pháp lý CĐS', icon: 'fa-landmark', href: 'phaply.html' },
        { id: 'p3', label: 'Cơ hội kinh doanh', icon: 'fa-funnel-dollar', href: 'chkd.html' },
        { id: 'p4', label: 'Quản lý POC', icon: 'fa-flask', href: 'poc.html', active: true },
        { id: 'p5', label: 'Đấu thầu', icon: 'fa-gavel', href: 'dauthau.html' },
        { id: 'p6', label: 'Hợp đồng', icon: 'fa-file-contract', href: 'hopdong.html' },
        { id: 'p7', label: 'Triển khai', icon: 'fa-gears', href: 'po.html' },
        { id: 'p8', label: 'Danh mục', icon: 'fa-database', href: 'danhmuc.html' }
      ];

      if (!user) return <LoginModal onLogin={fetchData} loading={loading} errorMsg={authError} />;

      return (
        <div className="min-h-screen flex bg-[#F4F7FB]">          
          {/* =============== SIDEBAR CHUẨN DÙNG CHUNG (USER TRÊN NAV + FONT CHKD) =============== */}
          <aside className={`${sidebarOpen ? 'w-52' : 'w-14'} bg-[#003B7A] text-white flex flex-col transition-all duration-200 shrink-0 shadow-xl z-20`}>
            {/* 1. Logo & Nút thu gọn */}
            <div className="h-16 px-3 flex items-center justify-between border-b border-white/10">
              {sidebarOpen && (
                <div className="flex items-center gap-2 overflow-hidden">
                  <VnptLogo size="sm" />
                  <div className="leading-tight truncate">
                    <div className="text-xs font-extrabold tracking-wide">VNPT-IT • KDGP</div>
                    <div className="text-[10px] text-sky-200">Executive War-Room</div>
                  </div>
                </div>
              )}
              <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-1.5 rounded-lg hover:bg-white/10 text-sky-200">
                <i className={`fa-solid ${sidebarOpen ? 'fa-bars-staggered' : 'fa-bars'}`}></i>
              </button>
            </div>
          
            {/* 2. Thông tin User & Nút Đăng xuất (Chuyển lên trên thanh điều hướng) */}
            <div className="p-2.5 border-b border-white/10 bg-[#002D5E]">
              {sidebarOpen ? (
                <div className="flex items-center justify-between gap-2">
                  <div className="min-w-0">
                    <div className="text-xs font-bold truncate">{user.name}</div>
                    <div className="text-[10px] text-sky-300 truncate">{user.role} • {user.scope}</div>
                  </div>
                  <button onClick={handleLogout} title="Đăng xuất" className="p-1.5 rounded-lg hover:bg-red-500/20 text-red-300 shrink-0">
                    <i className="fa-solid fa-right-from-bracket"></i>
                  </button>
                </div>
              ) : (
                <button onClick={handleLogout} title={`Đăng xuất (${user.name})`} className="w-full p-1.5 rounded-lg hover:bg-red-500/20 text-red-300">
                  <i className="fa-solid fa-right-from-bracket"></i>
                </button>
              )}
            </div>
          
            {/* 3. Thanh điều hướng (Đồng bộ font text-xs giống chkd.html) */}
            <nav className="flex-1 py-3 px-2 space-y-1">
              {navItems.map(item => (
                <a
                  key={item.id}
                  href={item.href}
                  className={`flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-xs font-semibold transition ${
                    item.active ? 'bg-[#0094D9] text-white shadow-md' : 'text-sky-100/80 hover:bg-white/10 hover:text-white'
                  }`}
                >
                  <i className={`fa-solid ${item.icon} w-4 text-center`}></i>
                  {sidebarOpen && <span className="truncate">{item.label}</span>}
                </a>
              ))}
            </nav>
          </aside>

          {/* =============== KHUNG NỘI DUNG CHÍNH =============== */}
          <div className="flex-1 flex flex-col min-w-0">
            {/* HEADER 2 CỘT + BỘ LỌC ĐA CHIỀU */}
            <header className="bg-white border-b border-slate-200 px-6 py-3.5 sticky top-0 z-10 shadow-sm">
              <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
                <div>
                  <div className="text-[11px] font-semibold uppercase tracking-wider text-[#0094D9]">
                    Phần 4 • Sheet 05_QUANLY_POC
                  </div>
                  <h1 className="text-lg font-extrabold text-[#003B7A]">
                    Quản lý Dự án POC
                  </h1>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <select value={fTinh} onChange={e => setFTinh(e.target.value)} className="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-slate-50 font-medium">
                    <option value="ALL">Địa bàn: Tất cả</option>
                    {filterOpts.tinh.map(v => <option key={v} value={v}>{v}</option>)}
                  </select>
                  <select value={fPlo} onChange={e => setFPlo(e.target.value)} className="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-slate-50 font-medium">
                    <option value="ALL">PLO: Tất cả</option>
                    {filterOpts.plo.map(v => <option key={v} value={v}>{v}</option>)}
                  </select>
                  <select value={fNhom} onChange={e => setFNhom(e.target.value)} className="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-slate-50 font-medium">
                    <option value="ALL">Nhóm SPDV: Tất cả</option>
                    {filterOpts.nhom.map(v => <option key={v} value={v}>{v}</option>)}
                  </select>
                  <select value={fTrangThai} onChange={e => setFTrangThai(e.target.value)} className="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-slate-50 font-medium">
                    <option value="ALL">Trạng thái: Tất cả</option>
                    {filterOpts.trangThai.map(v => <option key={v} value={v}>{v}</option>)}
                  </select>
                  <button
                    onClick={() => fetchData(user.email)}
                    className="px-3 py-1.5 bg-[#0094D9] hover:bg-[#007bb5] text-white rounded-lg text-xs font-semibold flex items-center gap-1.5"
                  >
                    <i className={`fa-solid fa-rotate ${loading ? 'fa-spin' : ''}`}></i> Đồng bộ
                  </button>
                </div>
              </div>
            </header>

            <main className="flex-1 p-6 space-y-5 max-w-[1600px] w-full mx-auto">
              {/* TẦNG 1: 5 THẺ KPI TRỌNG TÂM */}
              <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4">
                <div className="kpi-card bg-white rounded-xl border border-slate-200 p-4 border-l-4 border-l-[#0094D9]">
                  <div className="text-xs font-semibold text-slate-500 uppercase">Tổng POC / Đang chạy</div>
                  <div className="mt-2 flex items-baseline gap-2">
                    <span className="text-2xl font-extrabold text-[#003B7A]">{kpis.active}</span>
                    <span className="text-sm font-semibold text-slate-400">/ {kpis.total} dự án</span>
                  </div>
                  <div className="mt-1 text-[11px] text-[#0094D9] font-medium">Kiểm soát băng thông hạ tầng</div>
                </div>

                <div className="kpi-card bg-white rounded-xl border border-slate-200 p-4 border-l-4 border-l-[#00B050]">
                  <div className="text-xs font-semibold text-slate-500 uppercase">Tỷ lệ Chuyển hóa (KPI 7)</div>
                  <div className="mt-2 flex items-baseline gap-2">
                    <span className={`text-2xl font-extrabold ${kpis.convRate >= 60 ? 'text-[#00B050]' : 'text-[#D83A3A]'}`}>
                      {kpis.convRate}%
                    </span>
                    <span className="text-xs text-slate-500">({kpis.won} đạt)</span>
                  </div>
                  <div className="mt-1 text-[11px] text-slate-500">Mục tiêu điều hành: ≥ 60%</div>
                </div>

                <div className="kpi-card bg-white rounded-xl border border-slate-200 p-4 border-l-4 border-l-[#D83A3A]">
                  <div className="text-xs font-semibold text-slate-500 uppercase">Quá hạn / Cảnh báo Đỏ</div>
                  <div className="mt-2 flex items-baseline gap-2">
                    <span className="text-2xl font-extrabold text-[#D83A3A]">{kpis.overdue}</span>
                    <span className="text-xs text-slate-500">POC rủi ro</span>
                  </div>
                  <div className="mt-1 text-[11px] text-[#D83A3A] font-medium">Cần rà soát cắt lỗ / giải cứu</div>
                </div>

                <div className="kpi-card bg-white rounded-xl border border-slate-200 p-4 border-l-4 border-l-[#003B7A]">
                  <div className="text-xs font-semibold text-slate-500 uppercase">Tổng chi phí POC</div>
                  <div className="mt-2 flex items-baseline gap-1.5">
                    <span className="text-2xl font-extrabold text-[#003B7A]">{kpis.totalCost.toLocaleString('vi-VN')}</span>
                    <span className="text-xs font-semibold text-slate-500">trVND</span>
                  </div>
                  <div className="mt-1 text-[11px] text-slate-500">Hạ tầng + Nguồn lực vận hành</div>
                </div>

                <div className="kpi-card bg-white rounded-xl border border-slate-200 p-4 border-l-4 border-l-[#FFC000]">
                  <div className="text-xs font-semibold text-slate-500 uppercase">Chờ LĐ Chỉ đạo / Lỗi DQ</div>
                  <div className="mt-2 flex items-baseline gap-2">
                    <span className="text-2xl font-extrabold text-amber-600">{kpis.pendingDir}</span>
                    <span className="text-xs text-slate-500">kiến nghị • {kpis.dqIssues} lỗi DQ</span>
                  </div>
                  <div className="mt-1 text-[11px] text-amber-700 font-medium">Cần xử lý tại giao ban tuần</div>
                </div>
              </div>

              {/* TẦNG 2: 2 BIỂU ĐỒ PHÂN TÍCH TRỰC QUAN */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <ChartBox
                  id="chartStatus"
                  title="Phân bổ POC theo Trạng thái triển khai"
                  subtitle="Theo dõi tỷ trọng Đang chạy / Dừng POC / Hoàn thành"
                  type="bar"
                  data={chartStatusData}
                  options={{
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                  }}
                />
                <ChartBox
                  id="chartTinh"
                  title="Top Địa bàn theo Số lượng POC & Chi phí (trVND)"
                  subtitle="Cột: Số lượng POC | Đường: Tổng chi phí hạ tầng + nguồn lực"
                  type="bar"
                  data={chartTinhData}
                  options={{
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                      y: { beginAtZero: true, position: 'left', ticks: { stepSize: 1 } },
                      y1: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false } }
                    }
                  }}
                />
              </div>

              {/* TẦNG 3: BẢNG ĐIỀU HÀNH & CHỈ ĐẠO LÃNH ĐẠO */}
              <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div className="p-4 border-b border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-3">
                  <div className="flex flex-wrap gap-1.5">
                    {[
                      { id: 'ALL', label: `Tất cả (${rawData.length})` },
                      { id: 'ALERT', label: '🔴 Cần LĐ Chỉ đạo / Quá hạn' },
                      { id: 'ACTIVE', label: '🔵 Đang chạy POC' },
                      { id: 'WON', label: '🟢 Thành công (Đạt)' },
                      { id: 'DQ', label: '⚠️ Thiếu dữ liệu (DQ)' }
                    ].map(t => (
                      <button
                        key={t.id}
                        onClick={() => setQuickTab(t.id)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                          quickTab === t.id ? 'bg-[#003B7A] text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}
                      >
                        {t.label}
                      </button>
                    ))}
                  </div>
                  <div className="relative w-full md:w-72">
                    <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    <input
                      type="text"
                      value={search}
                      onChange={e => setSearch(e.target.value)}
                      placeholder="Tìm mã POC, CHKD, dự án, SPDV..."
                      className="w-full pl-8 pr-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-[#0094D9]"
                    />
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr className="bg-slate-50 text-[#003B7A] uppercase text-[11px] border-b border-slate-200">
                        <th className="py-3 px-3 font-bold">Địa bàn / Mã POC</th>
                        <th className="py-3 px-3 font-bold">Dự án / Khách hàng / SPDV</th>
                        <th className="py-3 px-3 font-bold">Tiến độ POC</th>
                        <th className="py-3 px-3 font-bold">Chi phí (trVND)</th>
                        <th className="py-3 px-3 font-bold">Trạng thái & Kết quả</th>
                        <th className="py-3 px-3 font-bold">Cảnh báo & Chỉ đạo LĐ</th>
                        <th className="py-3 px-3 font-bold text-center">Thao tác</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredData.length === 0 ? (
                        <tr><td colSpan="7" className="py-8 text-center text-slate-400">Không có bản ghi POC phù hợp bộ lọc.</td></tr>
                      ) : filteredData.map((r, idx) => {
                        const overdue = getOverdueDays(r);
                        const alertLvl = computeAlertLevel(r);
                        const totalRowCost = Number(r.chiphi_hatang_poc || 0) + Number(r.chiphi_nguonluc_poc || 0);
                        return (
                          <tr key={r.ma_poc || idx} className="hover:bg-sky-50/40 transition">
                            <td className="py-3 px-3 align-top">
                              <span className={`inline-block px-2 py-0.5 rounded font-bold text-[10px] mb-1 ${r.ma_tinh ? 'bg-[#003B7A] text-white' : 'bg-red-100 text-[#D83A3A]'}`}>
                                {r.ma_tinh || 'THIẾU TỈNH'}
                              </span>
                              <div className="font-bold text-slate-800">{r.ma_poc}</div>
                              <div className="text-[10px] text-slate-500">{r.ma_chkd}</div>
                            </td>
                            <td className="py-3 px-3 align-top max-w-xs">
                              <div className="font-semibold text-slate-800">{r.ten_duan_poc}</div>
                              <div className="text-slate-500 mt-0.5">KH: {r.ten_khachhang_poc || <span className="text-amber-600 italic">Chưa nhập KH</span>}</div>
                              <div className="mt-1 flex flex-wrap gap-1">
                                <span className="px-1.5 py-0.5 bg-sky-50 text-[#0094D9] rounded text-[10px] font-semibold">{r.ten_spdv}</span>
                                {r.plo_code && <span className="px-1.5 py-0.5 bg-slate-100 text-slate-600 rounded text-[10px]">{r.plo_code}</span>}
                              </div>
                            </td>
                            <td className="py-3 px-3 align-top whitespace-nowrap">
                              <div>BĐ: <span className="font-medium">{r.ngaybatdau_poc || '—'}</span></div>
                              <div>DK: <span className="font-medium">{r.ngayketthuc_poc_dk || '—'}</span></div>
                              {overdue > 0 && (
                                <span className="inline-block mt-1 px-1.5 py-0.5 bg-red-100 text-[#D83A3A] rounded text-[10px] font-bold">
                                  Quá hạn {overdue} ngày
                                </span>
                              )}
                            </td>
                            <td className="py-3 px-3 align-top whitespace-nowrap">
                              <div className="font-bold text-[#003B7A]">{totalRowCost.toLocaleString('vi-VN')} tr</div>
                              <div className="text-[10px] text-slate-500">{r.dv_tracp_hatang || 'Chưa rõ ĐV chi trả'}</div>
                            </td>
                            <td className="py-3 px-3 align-top">
                              <div className="font-semibold text-slate-700">{r.trangthai_poc}</div>
                              {r.ketqua_poc && (
                                <span className={`inline-block mt-1 px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                  String(r.ketqua_poc).toLowerCase().includes('thành công') ? 'bg-emerald-100 text-[#00B050]' : 'bg-slate-100 text-slate-600'
                                }`}>
                                  {r.ketqua_poc}
                                </span>
                              )}
                            </td>
                            <td className="py-3 px-3 align-top max-w-xs">
                              <div className="flex items-center gap-1.5 mb-1">
                                <span className={`w-2.5 h-2.5 rounded-full ${
                                  alertLvl === 'Đỏ' ? 'bg-[#D83A3A]' : alertLvl === 'Vàng' ? 'bg-[#FFC000]' : 'bg-[#00B050]'
                                }`}></span>
                                <span className="font-bold text-[11px]">{alertLvl}</span>
                                {Number(r.sl_loi_dq) > 0 && (
                                  <span className="px-1.5 py-0.5 bg-amber-100 text-amber-800 rounded text-[10px] font-semibold">
                                    {r.sl_loi_dq} lỗi DQ
                                  </span>
                                )}
                              </div>
                              {r.dexuat_chidao && <div className="text-[11px] text-slate-600 line-clamp-2"><b>Đề xuất:</b> {r.dexuat_chidao}</div>}
                              {r.chidao_lanhdao && <div className="text-[11px] text-[#003B7A] mt-0.5 line-clamp-2"><b>Chỉ đạo:</b> {r.chidao_lanhdao}</div>}
                            </td>
                            <td className="py-3 px-3 align-top text-center">
                              <button
                                onClick={() => { setSelectedRow(r); setChiDaoInput(r.chidao_lanhdao || ''); }}
                                className="px-2.5 py-1.5 bg-[#0094D9]/10 hover:bg-[#0094D9] text-[#0094D9] hover:text-white rounded-lg font-semibold transition"
                              >
                                Chi tiết
                              </button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>

            {/* FOOTER ĐỒNG BỘ HỆ THỐNG */}
            <footer className="bg-white border-t border-slate-200 px-6 py-3 text-[11px] text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-2">
              <div>© 2026 <b>VNPT-IT | Ban KDGP - TTĐHKD</b> • Hệ thống Điều hành SXKD & Quản trị Dữ liệu (Fullstack Sheets → GitHub)</div>
              <div>Đồng bộ dữ liệu: <b className="text-[#003B7A]">{updatedAt}</b></div>
            </footer>
          </div>

          {/* =============== MODAL CHI TIẾT & CHỈ ĐẠO LÃNH ĐẠO =============== */}
          {selectedRow && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden">
                <div className="bg-[#003B7A] text-white px-5 py-3.5 flex justify-between items-center">
                  <div>
                    <div className="text-[10px] uppercase text-sky-300">{selectedRow.ma_poc} • {selectedRow.ma_chkd}</div>
                    <h2 className="text-sm font-bold">{selectedRow.ten_duan_poc}</h2>
                  </div>
                  <button onClick={() => setSelectedRow(null)} className="text-white/70 hover:text-white">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="p-5 space-y-4 max-h-[75vh] overflow-y-auto text-xs">
                  <div className="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div><span className="text-slate-400">Địa bàn / Nhiệm vụ:</span> <b className="block">{selectedRow.ma_tinh || '—'} / {selectedRow.nhiemvu_ID || '—'}</b></div>
                    <div><span className="text-slate-400">SPDV / Mã định danh:</span> <b className="block">{selectedRow.ten_spdv} ({selectedRow.madinhdanh || '—'})</b></div>
                    <div><span className="text-slate-400">Quy mô hạ tầng:</span> <b className="block">{selectedRow.quymo_hatang_poc || '—'}</b></div>
                    <div><span className="text-slate-400">Nguồn lực vận hành:</span> <b className="block">{selectedRow.nguonluc_poc || '—'}</b></div>
                    <div><span className="text-slate-400">Chi phí HT / NL:</span> <b className="block">{selectedRow.chiphi_hatang_poc} / {selectedRow.chiphi_nguonluc_poc} trVND ({selectedRow.dv_tracp_hatang || '—'})</b></div>
                    <div><span className="text-slate-400">Biên bản POC:</span> {selectedRow.link_vb_poc ? <a href={selectedRow.link_vb_poc} target="_blank" className="text-[#0094D9] underline block">Mở tài liệu</a> : <b className="block text-slate-400">Chưa đính kèm</b>}</div>
                  </div>

                  {selectedRow.nhom_vuongmac && (
                    <div className="bg-amber-50 border border-amber-200 rounded-xl p-3">
                      <div className="font-bold text-amber-800 mb-1">Vướng mắc / Cảnh báo chất lượng dữ liệu:</div>
                      <pre className="whitespace-pre-wrap font-sans text-amber-900">{selectedRow.nhom_vuongmac}</pre>
                    </div>
                  )}

                  {selectedRow.dexuat_chidao && (
                    <div className="bg-sky-50 border border-sky-200 rounded-xl p-3">
                      <div className="font-bold text-[#003B7A] mb-1">Đề xuất của PLO / Địa bàn:</div>
                      <div>{selectedRow.dexuat_chidao}</div>
                    </div>
                  )}

                  <div>
                    <label className="block font-bold text-[#003B7A] mb-1.5">Ý kiến Chỉ đạo của Lãnh đạo (ghi trực tiếp về cột AC):</label>
                    <textarea
                      rows="3"
                      value={chiDaoInput}
                      onChange={e => setChiDaoInput(e.target.value)}
                      placeholder="Nhập kết luận chỉ đạo, thời hạn xử lý hoặc quyết định thu hồi tài nguyên..."
                      className="w-full border border-slate-300 rounded-lg p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#0094D9]"
                    ></textarea>
                  </div>
                </div>

                <div className="px-5 py-3 bg-slate-50 border-t border-slate-200 flex justify-end gap-2">
                  <button onClick={() => setSelectedRow(null)} className="px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-200">Đóng</button>
                  <button
                    onClick={handleSaveChiDao}
                    disabled={savingChiDao}
                    className="px-4 py-2 rounded-lg text-xs font-semibold bg-[#003B7A] hover:bg-[#002855] text-white flex items-center gap-1.5"
                  >
                    {savingChiDao && <i className="fa-solid fa-spinner fa-spin"></i>} Lưu chỉ đạo
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
